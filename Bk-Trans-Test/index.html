<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Trans</title>

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#050505;
      --panel1:#0b0f14;
      --panel2:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;

      --textScale: 1;

      --chatBg: linear-gradient(180deg, rgba(14,20,32,.92), rgba(8,12,18,.92));
      --inputBg: #2e3440;
      --userBubbleBg: rgba(46, 52, 64, .92);
      --assistantBubbleBg: rgba(30,36,48,.92);
      --sendBtnBg: rgba(45,107,255,.18);
      --headerBg: rgba(20,24,32,.92);
      --copyBtnBg: rgba(255,255,255,.08);
    }

    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      position:sticky; top:0; z-index:30;
      padding: 0 10px;
      padding-top: env(safe-area-inset-top);
      background: transparent;
    }
    .headerInner{
      background: var(--headerBg);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      border: none;
      padding: 0;
      box-shadow: 0 4px 20px rgba(0,0,0,.35);
      position:relative;
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:6px;
      height:64px;
      padding: 0 14px;
    }
    .title{
      font-weight:800;
      letter-spacing:.3px;
      font-size: calc(14px * var(--textScale));
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      min-width:0;
      overflow:hidden;
    }
    .ver{
      font-size: calc(10px * var(--textScale));
      font-weight:600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,.06);
      color: rgba(230,237,243,.7);
      cursor:pointer;
      user-select:none;
      flex-shrink:0;
      letter-spacing:.3px;
    }
    #modelTag{
      padding: 5px 12px;
      border-radius: 8px;
      background: rgba(255,255,255,.12);
      color: #ffffff;
      font-size: calc(14px * var(--textScale));
      font-weight:700;
      display:inline-block;
      vertical-align:middle;
      letter-spacing:.2px;
      white-space:normal;
      word-break:keep-all;
      line-height:1.3;
      cursor:pointer;
      transition: background .15s;
    }
    #modelTag:hover{background:rgba(255,255,255,.18)}
    #modelTag:active{transform:scale(.97)}

    .modelDropdown{
      display:none;
      position:absolute;
      top:100%;
      left:10px;
      margin-top:6px;
      min-width:240px;
      max-width:320px;
      background: rgba(14,18,26,.97);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      padding:6px;
      z-index:50;
      backdrop-filter:blur(12px);
    }
    .modelDropdown.show{display:block}
    .modelDropdownItem{
      display:block;
      width:100%;
      padding:10px 12px;
      border:none;
      background:transparent;
      color:var(--text);
      font-size:calc(13px * var(--textScale));
      font-family:inherit;
      text-align:left;
      border-radius:10px;
      cursor:pointer;
      transition:background .12s;
    }
    .modelDropdownItem:hover{background:rgba(255,255,255,.08)}
    .modelDropdownItem:active{transform:scale(.98)}
    .modelDropdownItem.active{background:rgba(45,107,255,.2); color:#ffffff;}
    .modelDropdownItem .mdName{font-weight:700}
    .modelDropdownItem .mdId{font-size:calc(11px * var(--textScale)); color:var(--muted); margin-top:2px}

    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      border:none;
      background: transparent;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      padding:0;
      flex: 0 0 36px;
      transition: background .15s, color .15s;
    }
    .iconBtn:hover{background:rgba(255,255,255,.06); color:rgba(230,237,243,.9)}
    .iconBtn:active{transform:scale(.93)}
    .iconBtn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

    .rightBtns{
      display:flex;
      align-items:center;
      gap:2px;
    }

    .statusBtn{
      width:36px; height:36px;
      border-radius:10px;
      border:none;
      background:transparent;
      cursor:pointer;
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 36px;
      transition: background .15s;
    }
    .statusBtn:hover{background:rgba(255,255,255,.06)}
    .statusBtn:active{transform:scale(.93)}
    .statusCircle{
      width:10px; height:10px;
      border-radius:999px;
      background: var(--warn);
      box-shadow: 0 0 6px rgba(247,201,72,.4);
      transition: background .3s, box-shadow .3s;
    }

    main{
      flex:1;
      overflow:hidden;
      padding: 10px;
      padding-bottom: 82px;
      display:flex;
      flex-direction:column;
    }
    .wrap{
      max-width: 860px;
      margin:0 auto;
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      width:100%;
    }

    .panel{
      background: var(--chatBg);
      border: none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size: calc(13px * var(--textScale))}
    .panelHead .s{font-size: calc(12px * var(--textScale)); color:var(--muted); line-height:1.35}

    .settingsOverlay{
      display:none;
      position:fixed; top:0; left:0; right:0; bottom:0;
      z-index:100;
      background: rgba(0,0,0,.6);
      backdrop-filter: blur(4px);
      align-items:center; justify-content:center;
      padding: 20px;
    }
    .settingsOverlay.show{
      display:flex;
    }
    .settings{
      width:100%; max-width:580px;
      max-height: calc(100vh - 40px);
      overflow-y:auto;
      padding: 16px 16px 20px;
      background: rgba(10,14,20,.97);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      position:relative;
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    label{font-size: calc(12px * var(--textScale)); color:var(--muted); display:block; margin:10px 0 6px}
    input, textarea, select, button{
      font-family: inherit;
    }
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size: calc(14px * var(--textScale));
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size: calc(12px * var(--textScale)); color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: calc(13px * var(--textScale));
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}

    .colorItem{
      min-width:0;
    }
    .colorItem input[type="color"]{
      width:100%; height:36px; padding:0; border:none;
      border-radius:10px; background:rgba(0,0,0,.35); cursor:pointer;
    }
    .colorSwatches{
      display:flex; gap:5px; flex-wrap:wrap; margin-top:6px;
    }
    .cSwatch{
      width:24px; height:24px; border-radius:7px; border:1.5px solid rgba(255,255,255,.08);
      padding:0; cursor:pointer; transition: transform .1s, border-color .15s;
    }
    .cSwatch:hover{border-color:rgba(255,255,255,.3)}
    .cSwatch:active{transform:scale(.9)}
    .presetGrid{
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;
    }
    .presetBtn{
      border:none; border-radius:12px; padding:10px 0;
      cursor:pointer; background:rgba(255,255,255,.04);
      color:var(--text); font-size:calc(12px * var(--textScale));
      display:flex; flex-direction:column; align-items:center; gap:6px;
      transition: background .15s;
    }
    .presetBtn:hover{background:rgba(255,255,255,.08)}
    .presetBtn:active{transform:scale(.97)}
    .presetDot{
      width:20px; height:20px; border-radius:999px;
      box-shadow: 0 0 0 2px rgba(255,255,255,.08);
    }

    .chat{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 16px;
      flex:1;
      overflow-y:auto;
      min-height:0;
      scroll-padding-top: 14px;
      scroll-padding-bottom: 14px;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, #000 16px, #000 100%);
      mask-image: linear-gradient(to bottom, transparent 0px, #000 16px, #000 100%);
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: calc(15px * var(--textScale));
    }

    .msg.user .bubble{
      background: var(--userBubbleBg);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    .msg.assistant .bubble{
      background: var(--assistantBubbleBg);
      color: rgba(230,237,243,.92);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-left-radius: 10px;
      max-width: 92%;
    }

    .actionsRow{
      display:flex; gap:6px; align-items:center;
    }
    .copyPill{
      border:none;
      background: var(--copyBtnBg);
      border-radius: 10px;
      padding: 4px 10px;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      font-size: calc(11px * var(--textScale));
      font-family:inherit;
      font-weight:600;
      letter-spacing:.3px;
      transition: background .15s, color .15s;
    }
    .copyPill:hover{background:rgba(255,255,255,.14); color:rgba(230,237,243,.9)}
    .copyPill:active{transform:scale(.95)}

    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 0 10px calc(8px + env(safe-area-inset-bottom));
      padding-top:0;
      background: transparent;
      pointer-events:none;
    }
    .composerFade{
      height:24px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events:none;
    }
    .composerInner{
      max-width: 860px;
      margin:0 auto;
      background: var(--inputBg);
      border: none;
      border-radius: 18px;
      box-shadow: 0 6px 24px rgba(0,0,0,.4);
      display:flex;
      flex-direction:column;
      position:relative;
      pointer-events:auto;
    }

    #input{
      width:100%;
      min-height:46px;
      max-height:240px;
      padding: 14px 16px;
      border-radius: 18px;
      border:none;
      background: transparent;
      color: #ffffff;
      outline:none;
      font-size: calc(15px * var(--textScale));
      font-family:inherit;
      line-height:1.5;
      resize:none;
      overflow-y:auto;
      scroll-padding-top: 14px;
      scroll-padding-bottom: 12px;
    }


    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: calc(12px * var(--textScale));
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size: calc(12px * var(--textScale)); color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
      font-size: calc(13px * var(--textScale));
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      header{padding: 0 6px; padding-top: env(safe-area-inset-top);}
      .headerInner{border-radius:14px; padding:0;}
      .topbar{gap:4px; padding: 0 10px;}
      .title{font-size: calc(12px * var(--textScale)); gap:4px}
      .ver{font-size: calc(9px * var(--textScale)); padding:2px 6px}
      .topbar{height:56px}
      #modelTag{font-size: calc(12px * var(--textScale))}
      .modelDropdown{left:6px; min-width:220px; max-width:280px}
      .iconBtn{width:32px; height:32px; flex:0 0 32px}
      .iconBtn svg{width:18px; height:18px}
      .statusBtn{width:32px; height:32px; flex:0 0 32px}
      .rightBtns{gap:0}
      main{padding:10px; padding-bottom: 80px;}
      .bubble{font-size: calc(16px * var(--textScale))}
      .composer{padding: 0 6px calc(6px + env(safe-area-inset-bottom)); padding-top:6px;}
      .composerInner{border-radius:16px}
      #input{padding: 12px 16px; min-height:44px}
    }
  </style>
</head>

<body>
  <header>
    <div class="headerInner">
      <div class="topbar">
        <span class="ver" id="modelTag">Model</span>

        <div id="modelDropdown" class="modelDropdown"></div>

        <div style="flex:1"></div>

        <div class="title">BK Trans <span class="ver" id="appVer">v2.2T</span></div>

        <div class="rightBtns">
          <button id="settingsToggleBtn" class="iconBtn" type="button" aria-label="설정">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>

          <button id="topTestBtn" class="iconBtn" type="button" aria-label="연결 테스트">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="none"></path>
            </svg>
          </button>

          <button id="topClearBtn" class="iconBtn" type="button" aria-label="Clear(대화 삭제)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              <line x1="10" y1="11" x2="10" y2="17"></line>
              <line x1="14" y1="11" x2="14" y2="17"></line>
            </svg>
          </button>

          <button id="connBtn" class="statusBtn" type="button" aria-label="연결 상태">
            <span id="statusCircle" class="statusCircle"></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div id="settingsOverlay" class="settingsOverlay">
    <section id="settingsPanel" class="settings">
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <button id="saveBtn" class="btn" type="button" style="flex:1;">저장</button>
        <button id="settingsCloseBtn" class="btn secondary" type="button" style="flex:1;">닫기</button>
      </div>

        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." autocomplete="off" />

        <div class="row">
          <div style="flex:1 1 240px;">
            <label for="model">모델</label>
            <input id="model" type="text" value="google/gemini-3-flash-preview" list="modelList" />
            <datalist id="modelList">
              <option value="google/gemini-3-flash-preview">Gemini 3 Flash</option>
              <option value="anthropic/claude-haiku-4.5">Claude Haiku 4.5</option>
              <option value="anthropic/claude-sonnet-4.5">Claude Sonnet 4.5</option>
              <option value="openai/gpt-5.2">GPT 5.2</option>
              <option value="openai/gpt-5.2-chat">GPT 5.2 Chat</option>
            </datalist>
          </div>
          <div style="flex:1 1 140px;">
            <label for="temperature">temperature</label>
            <input id="temperature" type="text" value="0.2" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="top_p">top_p</label>
            <input id="top_p" type="text" value="1" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="text" value="800" />
          </div>
        </div>

        <label for="systemPrompt">프롬프트(시스템/규칙)</label>
        <textarea id="systemPrompt" placeholder="여기에 본인 프롬프트를 붙여넣으세요."></textarea>

        <div class="row" style="align-items:center; margin-top:10px;">
          <label style="margin:0; display:flex; align-items:center; gap:10px; color:var(--text);">
            <input id="autoCopy" type="checkbox" style="width:18px; height:18px; accent-color: var(--blue);" />
            번역 완료 시 자동 복사(Chrome 모바일)
          </label>
        </div>

        <label for="fontScale">글자 크기</label>
        <div class="row" style="align-items:center;">
          <input id="fontScale" type="range" min="0.85" max="1.35" step="0.05" value="1" style="flex:1 1 auto;" />
          <div id="fontScaleVal" class="hint" style="min-width:64px; text-align:right;">100%</div>
          <button id="fontScaleResetBtn" class="btn secondary" type="button">초기화</button>
        </div>

        <label>색상</label>
        <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;">
          <div class="colorItem">
            <div class="hint" style="margin-bottom:4px;">전체배경</div>
            <input id="colorBg" type="color" value="#050505" />
            <div class="colorSwatches" data-target="colorBg">
              <button class="cSwatch" type="button" data-color="#000000" style="background:#000000"></button>
              <button class="cSwatch" type="button" data-color="#050505" style="background:#050505"></button>
              <button class="cSwatch" type="button" data-color="#0a0a0a" style="background:#0a0a0a"></button>
              <button class="cSwatch" type="button" data-color="#0b0f14" style="background:#0b0f14"></button>
              <button class="cSwatch" type="button" data-color="#0f172a" style="background:#0f172a"></button>
              <button class="cSwatch" type="button" data-color="#111827" style="background:#111827"></button>
              <button class="cSwatch" type="button" data-color="#1a1a2e" style="background:#1a1a2e"></button>
              <button class="cSwatch" type="button" data-color="#0c0614" style="background:#0c0614"></button>
              <button class="cSwatch" type="button" data-color="#090c10" style="background:#090c10"></button>
              <button class="cSwatch" type="button" data-color="#050a08" style="background:#050a08"></button>
            </div>
          </div>
          <div class="colorItem">

    if(el.appVer) el.appVer.textContent = APP_VERSION;

    function prettifyModelName(modelId){
      const raw = String(modelId || '').trim();
      if(!raw) return 'Model';
      const short = raw.split('/').pop() || raw;
      const cleaned = short.replace(/[_]+/g,'-').replace(/-+/g,'-');
      return cleaned.split('-').filter(Boolean).map(t => {
        if(/^\d+(\.\d+)?$/.test(t)) return t;
        return t.charAt(0).toUpperCase() + t.slice(1);
      }).filter(word => word.toLowerCase() !== 'preview').join(' ');
    }

    function getCurrentModelId(){
      return (localStorage.getItem(LS.model) || (el.model ? el.model.value : '') || '').trim();
    }

    function updateModelTag(){
      const pretty = prettifyModelName(getCurrentModelId());
      if(el.modelTag) el.modelTag.textContent = pretty;
      document.title = pretty + ' BK Trans ' + APP_VERSION;
    }

    const MODEL_OPTIONS = [
      { id:'google/gemini-3-flash-preview', name:'Gemini 3 Flash' },
      { id:'anthropic/claude-haiku-4.5', name:'Claude Haiku 4.5' },
      { id:'anthropic/claude-sonnet-4.5', name:'Claude Sonnet 4.5' },
      { id:'openai/gpt-5.2', name:'GPT 5.2' },
      { id:'openai/gpt-5.2-chat', name:'GPT 5.2 Chat' }
    ];

    function renderModelDropdown(){
      if(!el.modelDropdown) return;
      const currentId = getCurrentModelId();
      el.modelDropdown.innerHTML = '';
      MODEL_OPTIONS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'modelDropdownItem' + (m.id === currentId ? ' active' : '');
        btn.type = 'button';
        btn.innerHTML = '<div class="mdName">' + m.name + '</div><div class="mdId">' + m.id + '</div>';
        btn.addEventListener('click', () => {
          if(el.model) el.model.value = m.id;
          localStorage.setItem(LS.model, m.id);
          updateModelTag();
          closeModelDropdown();
          toast(m.name + ' 선택');
        });
        el.modelDropdown.appendChild(btn);
      });
    }

    function toggleModelDropdown(){
      if(!el.modelDropdown) return;
      const isOpen = el.modelDropdown.classList.contains('show');
      if(isOpen){ closeModelDropdown(); }
      else { renderModelDropdown(); el.modelDropdown.classList.add('show'); }
    }

    function closeModelDropdown(){
      if(el.modelDropdown) el.modelDropdown.classList.remove('show');
    }

    document.addEventListener('click', (e) => {
      if(el.modelDropdown && el.modelDropdown.classList.contains('show')){
        if(!el.modelTag.contains(e.target) && !el.modelDropdown.contains(e.target)){
          closeModelDropdown();
        }
      }
    });

    function toast(msg){
      el.toast.textContent = String(msg ?? '');
      el.toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.toast.classList.remove('show'), 2200);
    }

    function scrollToBottom(behavior){
      const b = behavior || 'smooth';
      const scroller = el.chat;
      try{
        el.bottomAnchor.scrollIntoView({behavior: (b === 'instant' ? 'auto' : b), block:'end'});
      } catch {}
      const doScroll = () => {
        if(b === 'instant'){
          scroller.scrollTop = scroller.scrollHeight;
        } else {
          try{ scroller.scrollTo({ top: scroller.scrollHeight, behavior: b }); }
          catch { scroller.scrollTop = scroller.scrollHeight; }
        }
      };
      if(b === 'instant'){
        doScroll();
      } else {
        requestAnimationFrame(() => { doScroll(); requestAnimationFrame(doScroll); });
      }
    }

    async function copyToClipboard(text, silent){
      const t = String(text ?? '');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(t);
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      try{
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      if(!silent) toast('복사 실패(보안 정책)');
      return false;
    }

    let _pendingCopyText = '';
    function showCopyBar(text){
      _pendingCopyText = String(text ?? '');
      el.copyBar.classList.remove('hidden');
    }
    function hideCopyBar(){
      _pendingCopyText = '';
      el.copyBar.classList.add('hidden');
    }

    function hasChinese(s){
      return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(String(s || ''));
    }
    function hasKorean(s){
      return /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(String(s || ''));
    }
    function isEnglishLongText(s){
      const str = String(s || '');
      if(hasKorean(str) || hasChinese(str)) return false;
      const englishChars = str.match(/[a-zA-Z]/g);
      return englishChars && englishChars.length >= 40;
    }

    const FONT_SCALE_MIN = 0.85;
    const FONT_SCALE_MAX = 1.35;

    function clamp(n, min, max){
      return Math.min(max, Math.max(min, n));
    }

    function applyFontScale(scale){
      let s = Number(scale);
      if(!Number.isFinite(s)) s = 1;
      s = clamp(s, FONT_SCALE_MIN, FONT_SCALE_MAX);
      document.documentElement.style.setProperty('--textScale', String(s));
      if(el.fontScale) el.fontScale.value = String(s);
      if(el.fontScaleVal) el.fontScaleVal.textContent = Math.round(s * 100) + '%';
    }

    function initFontScale(){
      const saved = localStorage.getItem(LS.fontScale);
      const v = saved ? Number(saved) : 1;
      applyFontScale(v);
    }

      navy:      { bg:'#05070f', chatBg:'#070c18', inputBg:'#22304a', userBubbleBg:'#22304a', assistantBubbleBg:'#162038', sendBtnBg:'#4f7cff', headerBg:'#0a1020', copyBtnBg:'#162038' },
      purple:    { bg:'#0c0614', chatBg:'#1b1026', inputBg:'#2d2240', userBubbleBg:'#2d2240', assistantBubbleBg:'#221832', sendBtnBg:'#8b5cf6', headerBg:'#1b1026', copyBtnBg:'#221832' },
      emerald:   { bg:'#050a08', chatBg:'#071b14', inputBg:'#1f3a30', userBubbleBg:'#1f3a30', assistantBubbleBg:'#122a20', sendBtnBg:'#22c55e', headerBg:'#0a1a14', copyBtnBg:'#122a20' },
      warm:      { bg:'#090604', chatBg:'#140f0b', inputBg:'#3a2a22', userBubbleBg:'#3a2a22', assistantBubbleBg:'#261c16', sendBtnBg:'#f59e0b', headerBg:'#1a1410', copyBtnBg:'#261c16' },
      mono:      { bg:'#0a0a0a', chatBg:'#111111', inputBg:'#2a2a2a', userBubbleBg:'#2a2a2a', assistantBubbleBg:'#1e1e1e', sendBtnBg:'#ffffff', headerBg:'#1a1a1a', copyBtnBg:'#1e1e1e' },

    function applyColorsFromStorage(){
      const savedBg = localStorage.getItem(LS.colorBg);
      if(el.colorBg) el.colorBg.value = savedBg || COLOR_DEFAULTS.bg;

      const savedChat = localStorage.getItem(LS.colorChatBg);
      if(el.colorChatBg) el.colorChatBg.value = savedChat || COLOR_DEFAULTS.chatBg;
      if(savedChat) document.documentElement.style.setProperty('--chatBg', savedChat);

    const DB_NAME = 'bk_tr_test_db_test';
    const DB_STORE = 'kv';
    let _fontBlobUrl = null;

    function openDB(){
      return new Promise((resolve, reject) => {
        if(!('indexedDB' in window)) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const os = tx.objectStore(DB_STORE);
        const r = os.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    async function idbSet(key, val){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function normalizeNewlines(s){
      return String(s).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    }

    function countMeaningfulLines(s){
      const norm = normalizeNewlines(s);
      const trimmed = norm.replace(/\n+$/g, '');
      if(trimmed.length === 0) return 1;
      return trimmed.split('\n').length;
    }

    function normalizeOutput(src, out){
      const srcLineCount = countMeaningfulLines(src);
      const norm = normalizeNewlines(out).trimEnd();
      if(norm.length === 0) return '';
      const lines = norm.split('\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const uniq = [...new Set(nonEmpty.map(l => l.trim()))];
      if(srcLineCount === 1 && uniq.length === 1 && nonEmpty.length > 1){
        return uniq[0];
      }
      return norm;
    }

    function validateNumber(x, min, max, name){
      const v = Number(x);
      if(!Number.isFinite(v)) throw new Error(name + ' 값이 숫자가 아닙니다.');
      if(v < min || v > max) throw new Error(name + ' 범위 오류(' + min + '~' + max + ')');
      return v;
    }

    async function callOpenRouterStream(userText, onChunk){
      const apiKey = el.apiKey.value.trim();
      if(!apiKey) throw new Error('API Key가 비어 있습니다.');

      const model = el.model.value.trim();
      if(!model) throw new Error('모델이 비어 있습니다.');

      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const top_p = validateNumber(el.top_p.value.trim(), 0, 1, 'top_p');
      const maxTokensRaw = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 32000, 'max_tokens'));
      const systemPrompt = el.systemPrompt.value || defaultSystemPrompt();

      const messages = [
        { role: 'system', content: systemPrompt },
        { role: 'user', content: userText }
      ];

      const payload = {
        model,
        messages,
        temperature,
        stream: true
      };

      if(isAnthropicModel(model)){
        payload.max_tokens = Math.min(maxTokensRaw, 4096);
      } else {
        payload.max_tokens = maxTokensRaw;
      }

      if(top_p < 1) payload.top_p = top_p;

      const ac = new AbortController();
      _currentAbort = ac;
      const timeout = setTimeout(() => ac.abort(), 30000);

      let res;
      try{
        res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify(payload),
          cache: 'no-store',
          mode: 'cors',
          signal: ac.signal
        });
      } finally {
        clearTimeout(timeout);
      }

      if(!res.ok){
        const text = await res.text();
        let msg = text;
        try { msg = JSON.parse(text).error.message; } catch{}
        throw new Error('HTTP ' + res.status + ': ' + msg);
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let full = '';
      let buf = '';

      while(true){
        const { done, value } = await reader.read();
        if(done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop() || '';
        for(const line of lines){
          const trimmed = line.trim();
          if(!trimmed || !trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim();
          if(data === '[DONE]') break;
          try{
            const j = JSON.parse(data);
            const delta = j.choices && j.choices[0] && j.choices[0].delta;
            if(delta && delta.content){
              full += delta.content;
              onChunk(full);
            }
          } catch{}
        }
      }
      return full;
    }

    async function send(){
      if(_isBusy){ abortCurrentRequest(); return; }

      const userText = el.input.value.trim();
      if(!userText) return;

      hideCopyBar();

      chat.push({ role:'user', text:userText, ts:Date.now() });
      renderChat();

      el.input.value = '';
      autoResizeInput();
      if(document.activeElement === el.input) el.input.blur();
      setConnState('busy');

      const streamRow = document.createElement('div');
      streamRow.className = 'msg assistant';
      const streamBubble = document.createElement('div');
      streamBubble.className = 'bubble';
      streamBubble.textContent = '번역 중...';
      streamBubble.style.opacity = '0.5';
      streamRow.appendChild(streamBubble);
      el.chat.insertBefore(streamRow, el.bottomAnchor);

      let _scrollRaf = 0;
      function scrollThrottled(){
        if(_scrollRaf) return;
        _scrollRaf = requestAnimationFrame(() => {
          _scrollRaf = 0;
          el.chat.scrollTop = el.chat.scrollHeight;
        });
      }
      scrollThrottled();

      try{
        const translatedRaw = await callOpenRouterStream(userText, (partial) => {
          streamBubble.style.opacity = '1';
          streamBubble.textContent = partial;
          scrollThrottled();
        });
        const translated = normalizeOutput(userText, translatedRaw);

        chat.push({ role:'assistant', text: translated, ts: Date.now() });
        trimChatToMaxInputs();
        saveChatHistory();

        streamBubble.textContent = translated;
        streamBubble.style.opacity = '1';

        const actions = document.createElement('div');
        actions.className = 'actionsRow';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copyPill';
        copyBtn.type = 'button';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', async () => { await copyToClipboard(translated, false); });
        actions.appendChild(copyBtn);
        streamRow.appendChild(actions);

        scrollThrottled();

        if(el.autoCopy.checked && hasChinese(translated)){
          const ok = await copyToClipboard(translated, true);
          if(ok){
            toast('중국어 자동 복사 완료');
            updateLastClipboard(translated);
          } else {
            showCopyBar(translated);
            toast('자동 복사 제한 → 아래 바 탭');
          }
        } else {
          hideCopyBar();
        }

        setConnState('ok');
      } catch(err){
        const msg = (err && err.message) ? err.message : String(err);
        const isAbort = (err && err.name === 'AbortError');
        if(streamRow.parentNode) streamRow.remove();

        if(isAbort){
          toast('번역 취소됨');
          chat.pop();
        } else {
          chat.push({ role:'assistant', text: '오류: ' + msg, ts: Date.now() });
          trimChatToMaxInputs();
          toast('요청 실패: ' + msg);
        }
        saveChatHistory();
        renderChat();
        setConnState(isAbort ? 'warn' : 'err');
      } finally {
        _currentAbort = null;
      }
    }

    document.querySelectorAll('[data-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        const key = btn.getAttribute('data-preset');
        applyPreset(key);
      });
    });

    const composerEl = document.querySelector('.composer');
    function adjustForKeyboard(){
      if(!window.visualViewport) return;
      const vv = window.visualViewport;
      const bottomOffset = window.innerHeight - vv.height - vv.offsetTop;
      if(composerEl){
        composerEl.style.bottom = Math.max(0, bottomOffset) + 'px';
      }
      if(el.main){
        el.main.style.paddingBottom = (Math.max(0, bottomOffset) + 82) + 'px';
      }
      scrollToBottom('instant');
    }
    if(el.input) el.input.addEventListener('focus', () => { adjustForKeyboard(); scrollToBottom('smooth'); });
    if(el.input) el.input.addEventListener('blur', () => {
      if(composerEl) composerEl.style.bottom = '0';
      if(el.main) el.main.style.paddingBottom = '';
    });
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', adjustForKeyboard);
      window.visualViewport.addEventListener('scroll', adjustForKeyboard);
    }

    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      toast('권장: HTTPS에서 사용하세요(키 보안)');
    }
  </script>
</body>
</html>
