<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Trans</title>

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#050505;
      --panel1:#0b0f14;
      --panel2:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;

      --menuScale: 1;
      --chatScale: 1;

      --headerSpacing: 10px;
      --chatSpacing: 16px;
      --inputSpacing: 4px;
      --maxWidth: 860px;

      /* 상단바 커스터마이징 */
      --topbarHeight: 64px;
      --topbarHPadding: 14px;
      --headerHPadding: 16px;

      --chatBg: #0e1420;
      --inputBg: #2e3440;
      --userBubbleBg: #2e3440;
      --assistantBubbleBg: #1e2430;
      --sendBtnBg: #2d6bff;
      --headerBg: #0b0f14;
      --copyBtnBg: #1a1f2a;

      /* 입력창 커스터마이징 */
      --inputMinHeight: 72px;
      --inputMaxHeight: 240px;
      --inputMaxWidth: 860px;
      --composerPadding: 10px;
      --chatBottomPadding: 4px;
      --composerBlur: 12px;
      --keyboardSpacing: 8px;
      --chatTopBlur: 4px;
      --chatTopFadeHeight: 24px;
    }

    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      position:sticky; top:0; z-index:30;
      padding: 0 var(--headerHPadding) 0;
      padding-top: calc(var(--headerSpacing) + env(safe-area-inset-top));
      background: var(--bg);
    }
    .headerInner{
      background: var(--headerBg);
      border-radius: 16px;
      border: none;
      padding: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
      position:relative;
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:6px;
      height: var(--topbarHeight);
      padding: 0 var(--topbarHPadding);
    }
    .title{
      font-weight:800;
      letter-spacing:.3px;
      font-size: calc(14px * var(--textScale));
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      min-width:0;
      overflow:hidden;
    }
    .ver{
      font-size: calc(10px * var(--textScale));
      font-weight:600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,.06);
      color: rgba(230,237,243,.7);
      cursor:pointer;
      user-select:none;
      flex-shrink:0;
      letter-spacing:.3px;
    }
    #modelTag{
      padding: 5px 12px;
      border-radius: 8px;
      background: var(--sendBtnBg);
      color: #ffffff;
      font-size: calc(14px * var(--textScale));
      font-weight:700;
      display:inline-block;
      vertical-align:middle;
      letter-spacing:.2px;
      white-space:normal;
      word-break:keep-all;
      line-height:1.3;
      cursor:pointer;
      transition: background .15s, transform .15s;
    }
    #modelTag:hover{filter: brightness(1.15)}
    #modelTag:active{transform:scale(.97)}

    .modelDropdown{
      display:none;
      position:absolute;
      top:100%;
      left:10px;
      margin-top:6px;
      min-width:240px;
      max-width:320px;
      background: var(--panel2);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      padding:6px;
      z-index:50;
      max-height:60vh;
      overflow-y:auto;
    }
    .modelDropdown.show{display:block}
    .modelDropdownItem{
      display:block;
      width:100%;
      padding:10px 12px;
      border:none;
      background:transparent;
      color:var(--text);
      font-size:calc(13px * var(--textScale));
      font-family:inherit;
      text-align:left;
      border-radius:10px;
      cursor:pointer;
      transition:background .12s;
    }
    .modelDropdownItem:hover{background:rgba(255,255,255,.08)}
    .modelDropdownItem:active{transform:scale(.98)}
    .modelDropdownItem.active{background:rgba(45,107,255,.2); color:#ffffff;}
    .modelDropdownItem .mdName{font-weight:700}
    .modelDropdownItem .mdId{font-size:calc(11px * var(--textScale)); color:var(--muted); margin-top:2px}

    .menuDropdownWrap{position:relative; display:inline-block;}
    .menuDropdown{
      display:none;
      position:absolute;
      top:100%;
      right:0;
      margin-top:6px;
      min-width:200px;
      background: var(--panel2);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      padding:6px;
      z-index:50;
    }
    .menuDropdown.show{display:block}
    .menuDropdownItem{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      padding:10px 12px;
      border:none;
      background:transparent;
      color:var(--text);
      font-size:calc(13px * var(--textScale));
      font-family:inherit;
      text-align:left;
      border-radius:10px;
      cursor:pointer;
      transition:background .12s;
    }
    .menuDropdownItem:hover{background:rgba(255,255,255,.08)}
    .menuDropdownItem:active{transform:scale(.98)}
    .menuDropdownItem svg{width:18px; height:18px; flex:0 0 18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--muted);}
    .menuDropdownItem.danger{color:var(--danger, #ff6b6b);}
    .menuDropdownItem.danger svg{color:var(--danger, #ff6b6b);}

    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      border:none;
      background: transparent;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      padding:0;
      flex: 0 0 36px;
      transition: background .15s, color .15s;
    }
    .iconBtn.newActive{
      opacity:1 !important;
      color:#4af;
      font-weight:700;
    }
    .iconBtn:hover{background:rgba(255,255,255,.06); color:rgba(230,237,243,.9)}
    .iconBtn:active{transform:scale(.93)}
    .iconBtn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

    .rightBtns{
      display:flex;
      align-items:center;
      gap:2px;
    }

    .statusBtn{
      width:36px; height:36px;
      border-radius:10px;
      border:none;
      background:transparent;
      cursor:pointer;
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 36px;
      transition: background .15s;
    }
    .statusBtn:hover{background:rgba(255,255,255,.06)}
    .statusBtn:active{transform:scale(.93)}
    .statusCircle{
      width:10px; height:10px;
      border-radius:999px;
      background: var(--warn);
      box-shadow: 0 0 6px rgba(247,201,72,.4);
      transition: background .3s, box-shadow .3s;
    }

    main{
      flex:1;
      overflow:hidden;
      padding-top: var(--headerSpacing);
      padding-left: var(--chatSpacing);
      padding-right: var(--chatSpacing);
      padding-bottom: 100px;
      display:flex;
      flex-direction:column;
    }
    .wrap{
      max-width: var(--maxWidth);
      margin:0 auto;
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      width:100%;
    }

    .panel{
      background: var(--chatBg);
      border: none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      position:relative;
    }
    .chatTopFade{
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--chatTopFadeHeight);
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      backdrop-filter: blur(var(--chatTopBlur));
      -webkit-backdrop-filter: blur(var(--chatTopBlur));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .chatTopFade.visible{
      opacity: 1;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size: calc(13px * var(--textScale))}
    .panelHead .s{font-size: calc(12px * var(--textScale)); color:var(--muted); line-height:1.35}

    .settingsOverlay{
      display:none;
      position:fixed; top:0; left:0; right:0; bottom:0;
      z-index:100;
      background: rgba(0,0,0,.75);
      align-items:center; justify-content:center;
      padding: 20px;
    }
    .settingsOverlay.show{
      display:flex;
    }
    .settings{
      width:100%; max-width:580px;
      max-height: calc(100vh - 40px);
      overflow-y:auto;
      padding: 16px 16px 20px;
      background: rgba(10,14,20,.97);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      position:relative;
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    label{font-size: calc(12px * var(--textScale)); color:var(--muted); display:block; margin:10px 0 6px}
    input, textarea, select, button{
      font-family: inherit;
    }
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size: calc(14px * var(--textScale));
    }
    .colorTextInput{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: calc(11px * var(--textScale));
      font-family: 'Courier New', monospace;
      text-transform: none;
      flex:1;
      min-width:0;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size: calc(12px * var(--textScale)); color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: calc(13px * var(--textScale));
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}

    .colorItem{
      min-width:0;
    }
    .colorItem input[type="color"]{
      width:100%; height:36px; padding:0; border:none;
      border-radius:10px; background:rgba(0,0,0,.35); cursor:pointer;
    }
    .colorSwatches{
      display:flex; gap:5px; flex-wrap:wrap; margin-top:6px;
    }
    .cSwatch{
      width:24px; height:24px; border-radius:7px; border:1.5px solid rgba(255,255,255,.08);
      padding:0; cursor:pointer; transition: transform .1s, border-color .15s;
    }
    .cSwatch:hover{border-color:rgba(255,255,255,.3)}
    .cSwatch:active{transform:scale(.9)}
    .presetGrid{
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;
    }
    .presetBtn{
      border:none; border-radius:12px; padding:10px 0;
      cursor:pointer; background:rgba(255,255,255,.04);
      color:var(--text); font-size:calc(12px * var(--textScale));
      display:flex; flex-direction:column; align-items:center; gap:6px;
      transition: background .15s;
    }
    .presetBtn:hover{background:rgba(255,255,255,.08)}
    .presetBtn:active{transform:scale(.97)}
    .presetDot{
      width:20px; height:20px; border-radius:999px;
      box-shadow: 0 0 0 2px rgba(255,255,255,.08);
    }

    .chat{
      padding: 14px;
      padding-bottom: var(--chatBottomPadding);
      display:flex;
      flex-direction:column;
      gap: 16px;
      flex:1;
      overflow-y:auto;
      min-height:0;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: calc(15px * var(--chatScale));
    }

    .msg.user .bubble{
      background: var(--userBubbleBg);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    .msg.assistant .bubble{
      background: var(--assistantBubbleBg);
      color: rgba(230,237,243,.92);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-left-radius: 10px;
      max-width: 92%;
    }

    .focusOverlay{
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,.95); z-index:9999;
      justify-content:center; align-items:center;
      padding:24px; box-sizing:border-box; cursor:pointer;
    }
    .focusOverlay.active{display:flex}
    .focusOverlay .focusText{
      color:#fff; font-size:28px; line-height:1.7;
      text-align:center; white-space:pre-wrap; word-break:break-word;
      max-width:90%; max-height:90vh; overflow-y:auto;
      user-select:text; -webkit-user-select:text;
    }

    .actionsRow{
      display:flex; gap:6px; align-items:center;
    }
    .retryPill{
      border:none;
      background: rgba(220,80,60,.7);
      border-radius: 10px;
      padding: 5px 12px;
      cursor:pointer;
      color: #fff;
      font-size: calc(12px * var(--textScale));
      font-family:inherit;
      font-weight:600;
      letter-spacing:.3px;
      transition: background .15s;
    }
    .retryPill:hover{background: rgba(220,80,60,.9)}

    .copyPill{
      border:none;
      background: var(--copyBtnBg);
      border-radius: 10px;
      padding: 4px 10px;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      font-size: calc(11px * var(--textScale));
      font-family:inherit;
      font-weight:600;
      letter-spacing:.3px;
      transition: background .15s, color .15s;
    }
    .copyPill:hover{background:rgba(255,255,255,.14); color:rgba(230,237,243,.9)}
    .copyPill:active{transform:scale(.95)}
    .ttsBtn{
      border:none;
      background: var(--copyBtnBg);
      border-radius: 10px;
      padding: 4px 8px;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      font-size: calc(13px * var(--textScale));
      font-family:inherit;
      display:inline-flex;
      align-items:center;
      gap:3px;
      transition: background .15s, color .15s;
    }
    .ttsBtn:hover{background:rgba(255,255,255,.14); color:rgba(230,237,243,.9)}
    .ttsBtn:active{transform:scale(.95)}
    .ttsBtn.speaking{color:#4af; background:rgba(45,107,255,.2)}

    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 0 var(--composerPadding) calc(var(--keyboardSpacing) + env(safe-area-inset-bottom));
      background: transparent;
      pointer-events:none;
      transition: background 0.3s, backdrop-filter 0.3s;
    }
    .composer.keyboard-visible{
      background: rgba(5,5,5,0.75);
      backdrop-filter: blur(var(--composerBlur));
      -webkit-backdrop-filter: blur(var(--composerBlur));
    }
    .composerFade{
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      height: 24px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .composer:focus-within .composerFade{
      opacity: 1;
    }
    .composerInner{
      position: relative;
    }
    .composerInner{
      max-width: var(--inputMaxWidth);
      margin:0 auto;
      background: var(--inputBg);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      display:flex;
      flex-direction:column;
      position:relative;
      pointer-events:auto;
    }

    #input{
      width:100%;
      min-height: var(--inputMinHeight);
      max-height: var(--inputMaxHeight);
      padding: 20px 16px;
      border-radius: 18px;
      border:none;
      background: transparent;
      color: #ffffff;
      outline:none;
      font-size: calc(15px * var(--chatScale));
      font-family:inherit;
      line-height:1.5;
      resize:none;
      overflow-y:auto;
    }


    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: calc(12px * var(--textScale));
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size: calc(12px * var(--textScale)); color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
      font-size: calc(13px * var(--textScale));
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      header{padding: 10px 6px 0; padding-top: calc(10px + env(safe-area-inset-top));}
      .headerInner{border-radius:14px; padding:0;}
      .topbar{gap:4px; padding: 0 10px;}
      .title{font-size: calc(12px * var(--textScale)); gap:4px}
      .ver{font-size: calc(9px * var(--textScale)); padding:2px 6px}
      .topbar{height:56px}
      #modelTag{font-size: calc(12px * var(--textScale))}
      .modelDropdown{left:6px; min-width:220px; max-width:280px}
      .iconBtn{width:32px; height:32px; flex:0 0 32px}
      .iconBtn svg{width:18px; height:18px}
      .statusBtn{width:32px; height:32px; flex:0 0 32px}
      .rightBtns{gap:0}
      main{padding-top: var(--headerSpacing); padding-left: var(--chatSpacing); padding-right: var(--chatSpacing); padding-bottom: var(--inputSpacing);}
      .bubble{font-size: calc(16px * var(--chatScale))}
      .composer{padding: 0 6px calc(6px + env(safe-area-inset-bottom)); padding-top:6px;}
      .composerInner{border-radius:16px}
      #input{padding: 20px 50px 20px 16px; min-height: var(--inputMinHeight)}
    }
  </style>
</head>

<body>
  <div id="focusOverlay" class="focusOverlay"><div class="focusText" id="focusText"></div></div>
  <header>
    <div class="headerInner">
      <div class="topbar">
        <span class="ver" id="modelTag">Model</span>

        <div id="modelDropdown" class="modelDropdown"></div>

        <div style="flex:1"></div>

        <div class="title" id="appTitle" style="cursor:pointer;">BK Trans <span class="ver" id="appVer">v9.4t</span></div>

        <div class="rightBtns">
          <div class="menuDropdownWrap">
            <button id="topMenuBtn" class="iconBtn" type="button" aria-label="메뉴" aria-haspopup="true" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
            <div id="topMenuDropdown" class="menuDropdown" role="menu">
              <button id="layoutToggleBtn" class="menuDropdownItem" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="3" width="7" height="7" rx="1"></rect>
                  <rect x="14" y="14" width="7" height="7" rx="1"></rect>
                  <rect x="3" y="14" width="7" height="7" rx="1"></rect>
                </svg>
                <span>레이아웃</span>
              </button>
              <button id="settingsToggleBtn" class="menuDropdownItem" type="button" role="menuitem">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <circle cx="12" cy="12" r="3"></circle>

      apiKey: document.getElementById('apiKey'),

      colorCopyBtnBg: document.getElementById('colorCopyBtnBg'),
    };

    if(el.appVer) el.appVer.textContent = APP_VERSION;

    function prettifyModelName(modelId){
      const raw = String(modelId || '').trim();
      if(!raw) return 'Model';
      const found = MODEL_OPTIONS.find(m => m.id === raw);
      if(found) return found.name;
      const short = raw.split('/').pop() || raw;
      const cleaned = short.replace(/[_]+/g,'-').replace(/-+/g,'-');
      return cleaned.split('-').filter(Boolean).map(t => {
        if(/^\d+(\.\d+)?$/.test(t)) return t;
        return t.charAt(0).toUpperCase() + t.slice(1);
      }).filter(word => word.toLowerCase() !== 'preview').join(' ');
    }

    function getCurrentModelId(){
      return (localStorage.getItem(LS.model) || (el.model ? el.model.value : '') || '').trim();
    }

    function updateModelTag(){
      const pretty = prettifyModelName(getCurrentModelId());
      if(el.modelTag) el.modelTag.textContent = pretty;
      document.title = pretty + ' BK Trans ' + APP_VERSION;
    }

    const MODEL_OPTIONS = [
      { id:'google/gemini-3-flash-preview', name:'Gemini 3 Flash' },
      { id:'google/gemini-3.1-flash-lite', name:'Gemini 3.1 Flash Lite' },
      { id:'google/gemini-3.5-flash', name:'Gemini 3.5 Flash' },
      { id:'google/gemini-3.1-pro-preview', name:'Gemini 3.1 Pro' },
      { id:'anthropic/claude-haiku-4.5', name:'Claude Haiku 4.5' },
      { id:'anthropic/claude-opus-4.7', name:'Claude Opus 4.7' },
      { id:'openai/gpt-5.5', name:'GPT 5.5' }
    ];

    function renderModelDropdown(){
      if(!el.modelDropdown) return;
      const currentId = getCurrentModelId();
      el.modelDropdown.innerHTML = '';
      MODEL_OPTIONS.forEach(m => {
        const btn = document.createElement('button');
        btn.className = 'modelDropdownItem' + (m.id === currentId ? ' active' : '');
        btn.type = 'button';
        btn.innerHTML = '<div class="mdName">' + m.name + '</div><div class="mdId">' + m.id + '</div>';
        btn.addEventListener('click', () => {
          if(el.model) el.model.value = m.id;
          localStorage.setItem(LS.model, m.id);
          updateModelTag();
          closeModelDropdown();
          toast(m.name + ' 선택');
        });
        el.modelDropdown.appendChild(btn);
      });
    }

    function toggleModelDropdown(){
      if(!el.modelDropdown) return;
      const isOpen = el.modelDropdown.classList.contains('show');
      if(isOpen){ closeModelDropdown(); }
      else { renderModelDropdown(); el.modelDropdown.classList.add('show'); }
    }

    function closeModelDropdown(){
      if(el.modelDropdown) el.modelDropdown.classList.remove('show');
    }

    document.addEventListener('click', (e) => {
      if(el.modelDropdown && el.modelDropdown.classList.contains('show')){
        if(!el.modelTag.contains(e.target) && !el.modelDropdown.contains(e.target)){
          closeModelDropdown();
        }
      }
    });

    function toast(msg){
      el.toast.textContent = String(msg ?? '');
      el.toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.toast.classList.remove('show'), 2200);
    }

    function scrollToBottom(behavior){
      const b = behavior || 'smooth';
      const scroller = el.chat;
      try{
        el.bottomAnchor.scrollIntoView({behavior: (b === 'instant' ? 'auto' : b), block:'end'});
      } catch {}
      const doScroll = () => {
        if(b === 'instant'){
          scroller.scrollTop = scroller.scrollHeight;
        } else {
          try{ scroller.scrollTo({ top: scroller.scrollHeight, behavior: b }); }
          catch { scroller.scrollTop = scroller.scrollHeight; }
        }
      };
      if(b === 'instant'){
        doScroll();
      } else {
        requestAnimationFrame(() => { doScroll(); requestAnimationFrame(doScroll); });
      }
    }

    // 채팅창 스크롤 시 상단 블러 효과
    const chatTopFade = document.getElementById('chatTopFade');
    if(el.chat && chatTopFade){
      el.chat.addEventListener('scroll', () => {
        if(el.chat.scrollTop > 20){
          chatTopFade.classList.add('visible');
        } else {
          chatTopFade.classList.remove('visible');
        }
      });
    }

    async function copyToClipboard(text, silent){
      const t = String(text ?? '');
      updateLastClipboard(t);
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(t);
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      try{
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      if(!silent) toast('복사 실패(보안 정책)');
      return false;
    }

    let _pendingCopyText = '';
    function showCopyBar(text){
      _pendingCopyText = String(text ?? '');
      el.copyBar.classList.remove('hidden');
    }
    function hideCopyBar(){
      _pendingCopyText = '';
      el.copyBar.classList.add('hidden');
    }

    function hasChinese(s){
      return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(String(s || ''));
    }
    function hasKorean(s){
      return /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(String(s || ''));
    }
    function countCharsByType(s){
      const str = String(s || '');
      const ko = (str.match(/[\uAC00-\uD7AF]/g) || []).length;
      const zh = (str.match(/[\u4E00-\u9FFF\u3400-\u4DBF]/g) || []).length;
      const en = (str.match(/[a-zA-Z]/g) || []).length;
      return { ko, zh, en, total: str.replace(/\s/g, '').length };
    }
    function detectDominantLang(s){
      const c = countCharsByType(s);
      if(c.ko === 0 && c.zh === 0) return 'en';
      return c.ko >= c.zh ? 'ko' : 'zh';
    }
    function isEnglishLongText(s){
      const str = String(s || '');
      const c = countCharsByType(str);
      if(c.ko + c.zh === 0 && c.en >= 40) return true;
      const cjk = c.ko + c.zh;
      if(cjk > 0 && c.en >= 40 && cjk / (cjk + c.en) < 0.15) return true;
      return false;
    }

    const DB_NAME = 'bk_tr_test_db_test';

    function openDB(){
      return new Promise((resolve, reject) => {
        if(!('indexedDB' in window)) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const os = tx.objectStore(DB_STORE);
        const r = os.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    async function idbSet(key, val){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function normalizeNewlines(s){
      return String(s).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    }

    function countMeaningfulLines(s){
      const norm = normalizeNewlines(s);
      const trimmed = norm.replace(/\n+$/g, '');
      if(trimmed.length === 0) return 1;
      return trimmed.split('\n').length;
    }

    function stripTranslationPrefix(s){
      return String(s).replace(/^\s*(?:번역|译文|翻译|译|Translation)\s*[:：]\s*/i, '');
    }

    function stripSurroundingQuotes(s){
      const str = String(s).trim();
      const pairs = [['"','"'],['\'','\''],['“','”'],['‘','’'],['「','」'],['『','』']];
      for(const [a,b] of pairs){
        if(str.startsWith(a) && str.endsWith(b) && str.length >= 2){
          const inner = str.slice(a.length, str.length - b.length);
          if(!inner.includes(a) && !inner.includes(b)) return inner;
        }
      }
      return str;
    }

    function normalizeChinesePunctuation(s){
      if(!hasChinese(s)) return s;
      return String(s)
        .replace(/([\u4E00-\u9FFF]) ?, ?/g, '$1，')
        .replace(/([\u4E00-\u9FFF]) ?\. ?(?=[\u4E00-\u9FFF]|$)/g, '$1。')
        .replace(/([\u4E00-\u9FFF]) ?\? ?/g, '$1？')
        .replace(/([\u4E00-\u9FFF]) ?! ?/g, '$1！')
        .replace(/([\u4E00-\u9FFF]) ?: ?/g, '$1：')
        .replace(/([\u4E00-\u9FFF]) ?; ?/g, '$1；');
    }

    function normalizeOutput(src, out){
      const srcLineCount = countMeaningfulLines(src);
      let norm = normalizeNewlines(out).trimEnd();
      if(norm.length === 0) return '';

      norm = norm.split('\n').map(l => stripTranslationPrefix(l)).join('\n');
      norm = stripSurroundingQuotes(norm);
      norm = normalizeChinesePunctuation(norm);

      const lines = norm.split('\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const uniq = [...new Set(nonEmpty.map(l => l.trim()))];
      if(srcLineCount === 1 && uniq.length === 1 && nonEmpty.length > 1){
        return uniq[0];
      }
      return norm;
    }

      if(!Number.isFinite(v)) throw new Error(name + ' 값이 숫자가 아닙니다.');
      if(v < min || v > max) throw new Error(name + ' 범위 오류(' + min + '~' + max + ')');
      return v;
    }

    async function callOpenRouterStreamOnce(userText, onChunk, timeoutMs){
      const apiKey = el.apiKey.value.trim();
      if(!apiKey) throw new Error('API Key가 비어 있습니다.');

      const model = el.model.value.trim();
      if(!model) throw new Error('모델이 비어 있습니다.');

      const isPing = userText === 'ping';
      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const topP = validateNumber(el.topP.value.trim(), 0, 1, 'top_p');
      const topK = Math.floor(validateNumber(el.topK.value.trim(), 1, 200, 'top_k'));
      const maxTokensRaw = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 32000, 'max_tokens'));
      const dynMax = isPing ? 16 : maxTokensRaw;

      const messages = isPing
        ? [{ role: 'user', content: 'ping' }]
        : buildContextMessages(userText);

      const payload = {
        model,
        messages,
        temperature,
        top_p: topP,
        top_k: topK,
        stream: true,
        max_tokens: dynMax
      };

      const ac = new AbortController();
      _currentAbort = ac;
      const timeout = setTimeout(() => ac.abort('timeout'), timeoutMs);

      let res;
      try{
        res = await fetch(getApiUrl(), {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey
          },
          body: JSON.stringify(payload),
          signal: ac.signal
        });
      } finally {
        clearTimeout(timeout);
      }

      if(!res.ok){
        const text = await res.text();
        let msg = text;
        try { msg = JSON.parse(text).error.message; } catch{}
        if(res.status === 403){
          msg += '\n(VPN 연결 확인 / 브라우저 데이터절약 모드 OFF 필요)';
        }
        const err = new Error('HTTP ' + res.status + ': ' + msg);
        err.status = res.status;
        throw err;
      }

      let full = '';

      if(res.body && res.body.getReader){
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while(true){
          const { done, value } = await reader.read();
          if(done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for(const line of lines){
            const trimmed = line.trim();
            if(!trimmed || !trimmed.startsWith('data:')) continue;
            const data = trimmed.slice(5).trim();
            if(data === '[DONE]') break;
            try{
              const j = JSON.parse(data);
              const delta = j.choices && j.choices[0] && j.choices[0].delta;
              if(delta && delta.content){
                full += delta.content;
                const visible = stripThinkingTags(full);
                if(visible) onChunk(visible);
              }
            } catch{}
          }
        }
      } else {
        const text = await res.text();
        const lines = text.split('\n');
        for(const line of lines){
          const trimmed = line.trim();
          if(!trimmed || !trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim();
          if(data === '[DONE]') continue;
          try{
            const j = JSON.parse(data);
            const delta = j.choices && j.choices[0] && j.choices[0].delta;
            if(delta && delta.content) full += delta.content;
            const msg = j.choices && j.choices[0] && j.choices[0].message;
            if(msg && msg.content) full += msg.content;
          } catch{}
        }
        onChunk(stripThinkingTags(full));
      }
      return stripThinkingTags(full);
    }

    function stripThinkingTags(s){
      return s.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    }

    async function callOpenRouterStream(userText, onChunk){
      const timeoutMs = CONFIG.REQUEST_TIMEOUT_MS;
      try{
        return await callOpenRouterStreamOnce(userText, onChunk, timeoutMs);
      } catch(err){
        const status = err && err.status;
        const retriable = !status || status === 408 || status === 429 || (status >= 500 && status < 600);
        const isAbort = err && (err.name === 'AbortError' || String(err.message || '').includes('abort'));
        if(!retriable || isAbort) throw err;
        await new Promise(r => setTimeout(r, 400));
        return await callOpenRouterStreamOnce(userText, onChunk, timeoutMs);
      }
    }

    function splitTtsChunks(text, max){
      if(text.length <= max) return [text];
      var chunks = [];
      var rest = text;
      while(rest.length > 0){
        if(rest.length <= max){ chunks.push(rest); break; }
        var i = rest.lastIndexOf('。', max);
        if(i < max * 0.3) i = rest.lastIndexOf('.', max);
        if(i < max * 0.3) i = rest.lastIndexOf('!', max);
        if(i < max * 0.3) i = rest.lastIndexOf('?', max);
        if(i < max * 0.3) i = rest.lastIndexOf(',', max);
        if(i < max * 0.3) i = rest.lastIndexOf('，', max);
        if(i < max * 0.3) i = rest.lastIndexOf(' ', max);
        if(i < max * 0.3) i = max;
        chunks.push(rest.substring(0, i + 1).trim());
        rest = rest.substring(i + 1).trim();
      }
      return chunks.filter(function(c){ return c.length > 0; });
    }

    function stopTts(){
      _ttsBusy = false;
      _ttsChunks = [];
      _ttsIdx = 0;
      _ttsEl.onended = null;

    function ttsUrl(chunk, lang){
      var le = lang === 'zh' ? 'zh' : lang === 'ko' ? 'ko' : 'en';
      return 'https://tts.youdao.com/fanyivoice?word=' + encodeURIComponent(chunk) + '&le=' + le + '&keyfrom=speaker-target';
    }

    function playNextChunk(){
      if(!_ttsBusy || _ttsIdx >= _ttsChunks.length){
        _ttsBusy = false;
        if(_ttsBtn) _ttsBtn.classList.remove('speaking');
        return;
      }
      var chunk = _ttsChunks[_ttsIdx++];
      _ttsEl.onended = function(){ playNextChunk(); };
      _ttsEl.onerror = function(){ playNextChunk(); };
      _ttsEl.src = ttsUrl(chunk, _ttsTl);
      _ttsEl.play().catch(function(){ setTimeout(playNextChunk, 200); });
    }

    function speakText(text, btn){
      if(_ttsBusy){
        stopTts();
        if(_ttsBtn === btn) return;
      }
      _ttsBusy = true;
      _ttsBtn = btn;
      if(btn) btn.classList.add('speaking');

      var lang = detectDominantLang(text);
      _ttsTl = lang;

      _ttsChunks = splitTtsChunks(text, 200);
      _ttsIdx = 0;
      playNextChunk();
    }

    function createTtsBtn(text){

    function retryTranslate(userText){
      if(_isBusy || !userText) return;
      const lastErr = chat.length > 0 && chat[chat.length - 1];
      if(lastErr && lastErr.role === 'assistant' && lastErr.text.startsWith('오류:')) chat.pop();
      const lastUsr = chat.length > 0 && chat[chat.length - 1];
      if(lastUsr && lastUsr.role === 'user' && lastUsr.text === userText) chat.pop();
      el.input.value = userText;
      send();
    }

    function retryWithModel(userText, modelId){
      if(_isBusy || !userText) return;
      const prev = el.model.value;
      el.model.value = modelId;
      localStorage.setItem(LS.model, modelId);
      updateModelTag();
      el.input.value = userText;
      send().finally(() => {
        el.model.value = prev;
        localStorage.setItem(LS.model, prev);
        updateModelTag();
      });
    }

    async function send(){
      if(_isBusy){ abortCurrentRequest(); return; }

      const userText = el.input.value.trim();
      if(!userText) return;

      hideCopyBar();

      chat.push({ role:'user', text:userText, ts:Date.now() });
      renderChat();

      el.input.value = '';
      autoResizeInput();
      if(document.activeElement === el.input) el.input.blur();
      setConnState('busy');

      const streamRow = document.createElement('div');
      streamRow.className = 'msg assistant';
      const streamBubble = document.createElement('div');
      streamBubble.className = 'bubble';
      streamBubble.textContent = '번역 중...';
      streamBubble.style.opacity = '0.5';
      streamRow.appendChild(streamBubble);
      el.chat.insertBefore(streamRow, el.bottomAnchor);

      let _scrollRaf = 0;
      function scrollThrottled(){
        if(_scrollRaf) return;
        _scrollRaf = requestAnimationFrame(() => {
          _scrollRaf = 0;
          el.chat.scrollTop = el.chat.scrollHeight;
        });
      }
      scrollThrottled();

      try{
        const translatedRaw = await callOpenRouterStream(userText, (partial) => {
          streamBubble.style.opacity = '1';
          streamBubble.textContent = partial;
          scrollThrottled();
        });
        const translated = normalizeOutput(userText, translatedRaw);

        chat.push({ role:'assistant', text: translated, ts: Date.now(), model: prettifyModelName(getCurrentModelId()) });
        trimChatToMaxInputs();
        saveChatHistory();

        streamBubble.textContent = translated;
        streamBubble.style.opacity = '1';
        streamBubble.style.cursor = 'pointer';
        streamBubble.addEventListener('click', () => showFocusOverlay(translated));

        const actions = document.createElement('div');
        actions.className = 'actionsRow';
        actions.appendChild(createTtsBtn(translated));
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copyPill';
        copyBtn.type = 'button';
        copyBtn.textContent = '복사';
        copyBtn.addEventListener('click', async () => { await copyToClipboard(translated, false); });
        actions.appendChild(copyBtn);
        streamRow.appendChild(actions);

        scrollThrottled();

        if(el.autoCopy.checked && hasChinese(translated)){
          const ok = await copyToClipboard(translated, true);
          if(ok){
            toast('중국어 자동 복사 완료');
            updateLastClipboard(translated);
          } else {
            showCopyBar(translated);
            toast('자동 복사 제한 → 아래 바 탭');
          }
        } else {
          hideCopyBar();
        }

        setConnState('ok');
      } catch(err){
        const msg = (err && err.message) ? err.message : String(err);
        const isAbort = (err && err.name === 'AbortError');
        if(streamRow.parentNode) streamRow.remove();

        if(isAbort){
          toast('번역 취소됨');
          chat.pop();
        } else {
          chat.push({ role:'assistant', text: '오류: ' + msg, ts: Date.now(), model: prettifyModelName(getCurrentModelId()) });
          trimChatToMaxInputs();
          toast('요청 실패: ' + msg);
        }
        saveChatHistory();
        renderChat();
        setConnState(isAbort ? 'warn' : 'err');
      } finally {
        _currentAbort = null;
      }
    }

    function shuffleArray(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

      const currentPrompt = el.systemPrompt.value || defaultSystemPrompt();

    async function checkClipboard(){
      try{
        if(_isBusy || _autoSending) return;
        if(!navigator.clipboard || !navigator.clipboard.readText) return;
        if(!document.hasFocus || !document.hasFocus()) return;

        const clipText = await navigator.clipboard.readText();
        const trimmed = String(clipText || '').trim();
        if(!trimmed) return;

        if(_lastClipboardText === trimmed) return;
        if(!hasKorean(trimmed) && !hasChinese(trimmed)) return;
        if(isEnglishLongText(trimmed)) return;

        if(trimmed.length >= CONFIG.AUTO_TRANSLATE_MAX_LEN){
          if(_lastLongTextWarn !== trimmed){
            _lastLongTextWarn = trimmed;
            toast('긴 텍스트(' + trimmed.length + '자) 자동 번역 생략 - 직접 입력하세요');
          }
          updateLastClipboard(trimmed);
          return;
        }

        updateLastClipboard(trimmed);
        if(isChatDuplicate(trimmed)) return;

        _autoSending = true;
        try{
          el.input.value = trimmed;
          await send();
        } finally {
          _autoSending = false;
        }
      } catch(err){
      }
    }

        const num = Number(v);
        const val = Number.isFinite(num) ? num : def;
        document.documentElement.style.setProperty(cssVar, val + suffix);
        if(extraCssVars) extraCssVars(val);

        if(valEl) valEl.textContent = val + suffix;
        if(onApply) onApply(val);

        slider.addEventListener('input', (e) => {
          const v = e.target.value;
          apply(v);
          try{ localStorage.setItem(lsKey, String(v)); } catch {}
        });
      }
      if(resetBtn){
        resetBtn.addEventListener('click', () => {
          apply(def);
          try{ localStorage.setItem(lsKey, String(def)); } catch {}
        });
      }
      return apply;
    }

    function parseRgba(str){
      const match = str.match(/rgba?\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+))?\s*\)/i);
      if(!match) return null;
      const r = parseInt(match[1]);
      const g = parseInt(match[2]);
      const b = parseInt(match[3]);
      const a = match[4] !== undefined ? parseFloat(match[4]) : 1;
      if(r > 255 || g > 255 || b > 255 || a < 0 || a > 1) return null;
      return { r, g, b, a };
    }

    function rgbToHex(r, g, b){
      return '#' + [r, g, b].map(x => {
        const hex = x.toString(16);
        return hex.length === 1 ? '0' + hex : hex;
      }).join('');
    }

    function hexToRgba(hex, alpha){
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

        const colorPicker = document.getElementById(targetId);
        if(!colorPicker) return;

        const updateTextInput = () => {
          const hex = colorPicker.value;
          textInput.value = hex.toUpperCase();
        };

        updateTextInput();

        colorPicker.addEventListener('input', updateTextInput);

        textInput.addEventListener('input', (e) => {
          let val = e.target.value.trim();

          // Try parsing as hex
          if(!val.startsWith('#')) val = '#' + val;
          if(isValidHex(val)){
            colorPicker.value = val;
            colorPicker.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
      });
    }

    syncColorTextInputs();



    const composerEl = document.querySelector('.composer');
    function adjustForKeyboard(){
      if(!window.visualViewport) return;
      const vv = window.visualViewport;
      const bottomOffset = window.innerHeight - vv.height - vv.offsetTop;

      // 키보드가 올라왔을 때만 블러 효과 적용
      if(composerEl){
        composerEl.style.bottom = Math.max(0, bottomOffset) + 'px';
        if(bottomOffset > 50){
          composerEl.classList.add('keyboard-visible');
        } else {
          composerEl.classList.remove('keyboard-visible');
        }
      }

      if(el.main){
        el.main.style.paddingBottom = (Math.max(0, bottomOffset) + 82) + 'px';
      }
      scrollToBottom('instant');
    }
    if(el.input) el.input.addEventListener('focus', () => { adjustForKeyboard(); scrollToBottom('smooth'); });
    if(el.input) el.input.addEventListener('blur', () => {
      if(composerEl){
        composerEl.style.bottom = '0';
        composerEl.classList.remove('keyboard-visible');
      }
      if(el.main) el.main.style.paddingBottom = '';
      setTimeout(updateMainPaddingBottom, 10);
    });
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', adjustForKeyboard);
      window.visualViewport.addEventListener('scroll', adjustForKeyboard);
    }
    window.addEventListener('resize', () => setTimeout(updateMainPaddingBottom, 100));

    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      toast('권장: HTTPS에서 사용하세요(키 보안)');
    }
  </script>
</body>
</html>
