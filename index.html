<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Translator (OpenRouter)</title>

  <!-- 404 favicon 방지 -->
  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#050505;
      --panel1:#0b0f14;
      --panel2:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;
    }

    /* GitHub Pages에 올린 woff2가 있으면 자동 적용 (업로드폰트가 있으면 그게 우선) */
    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* ===== Header ===== */
    header{
      position:sticky; top:0; z-index:30;
      padding: 10px 10px calc(10px + env(safe-area-inset-top));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:10px;
    }
    .title{
      font-weight:800;
      letter-spacing:.2px;
      font-size:14px;
      margin-right:4px;
    }

    /* 아이콘 버튼: 크기 통일 / 진한 검은색 / 테두리 없음 */
    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      border:none;
      background: #070707;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor:pointer;
      color: rgba(230,237,243,.88);
      padding:0;
    }
    .iconBtn:active{transform:scale(.98)}
    .iconBtn svg{width:18px; height:18px; fill: currentColor}

    /* 연결 상태 버튼도 동일 크기 */
    .connBtn{ position:relative; }
    .connDot{
      position:absolute;
      right:8px; bottom:8px;
      width:8px; height:8px; border-radius:999px;
      background: var(--warn);
      box-shadow: 0 0 0 2px rgba(5,5,5,.95);
    }

    /* ===== Main ===== */
    main{
      flex:1;
      overflow:auto;
      padding: 10px;
      padding-bottom: 92px;
    }
    .wrap{
      max-width: 860px;
      margin:0 auto;
    }

    /* 카드/테두리 제거: 배경색으로만 구분 */
    .panel{
      background: linear-gradient(180deg, rgba(14,20,32,.92), rgba(8,12,18,.92));
      border:none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size:13px}
    .panelHead .s{font-size:12px; color:var(--muted); line-height:1.35}

    /* ===== Settings ===== */
    .settings{
      margin-bottom:10px;
      padding: 12px 14px 14px;
      background: rgba(10,14,20,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    label{font-size:12px; color:var(--muted); display:block; margin:10px 0 6px}
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size:14px;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size:12px; color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size:13px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}

    /* ===== Chat ===== */
    .chat{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 16px;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
    }

    /* ✅ 입력 말풍선: 단색 진한 회색(그라데이션 제거) */
    .msg.user .bubble{
      background: rgba(46, 52, 64, .92); /* 진한 회색 */
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    /* 출력 말풍선: 배경 없음(투명) + 그림자 제거 */
    .msg.assistant .bubble{
      background: transparent;
      color: rgba(230,237,243,.92);
      box-shadow: none;
      padding: 0;
      border-radius: 0;
      max-width: 92%;
    }

    .actionsRow{
      display:flex; gap:8px; align-items:center;
      opacity:.9;
    }
    .miniIconBtn{
      width:32px; height:32px;
      border:none;
      background: rgba(255,255,255,.06);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      color: rgba(230,237,243,.9);
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }
    .miniIconBtn svg{width:18px; height:18px; fill: currentColor}

    /* ===== Composer ===== */
    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .composerInner{
      max-width: 860px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    /* ✅ (1) 입력창만 단색 진한 회색으로 변경 */
    #input{
      height:44px;
      line-height:44px;
      flex: 0 1 440px;
      min-width: 160px;
      max-width: 520px;
      padding: 0 12px;
      border-radius: 16px;
      border:none;

      background: #2e3440;  /* 단색 진한 회색 */
      color: #ffffff;       /* 가독성 */

      outline:none;
      font-size: 15px;
    }

    /* 전송 버튼: 배경 그대로 + 화살표 흰색 */
    .sendBtn{
      height:44px;
      min-width: 54px;
      border-radius: 16px;
      border:none;
      background: rgba(45,107,255,.18);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
    }
    .sendBtn:active{transform:scale(.98)}
    .sendBtn svg{
      width:20px; height:20px;
      fill:none;
      stroke:#ffffff;
      stroke-width:2.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* 토스트 */
    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    /* 복사 바 */
    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size:12px; color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      .title{font-size:13px}
      .iconBtn{width:36px; height:36px}
      main{padding:10px; padding-bottom: 96px;}
      .bubble{font-size:16px}
      #input{
        flex: 1 1 auto;
        max-width: none;
        height:46px;
        line-height:46px;
      }
      .sendBtn{
        height:46px;
        min-width: 56px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="title">BK Translator</div>

      <!-- 설정(메뉴) -->
      <button id="settingsToggleBtn" class="iconBtn" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <!-- 번역 기록 다운로드 -->
      <button id="downloadBtn" class="iconBtn" type="button" aria-label="번역 기록 다운로드">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zm7-18v12l4-4 1.4 1.4L12 16.8l-5.4-5.4L8 10l4 4V2z"/></svg>
      </button>

      <!-- 학습 버튼 -->
      <button id="learnBtn" class="iconBtn" type="button" aria-label="학습 실행">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 12.18L3.82 10 12 5.82 20.18 10 12 15.18zM5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82z"/></svg>
      </button>

      <!-- 프롬프트 선택 버튼 -->
      <button id="promptSelectBtn" class="iconBtn" type="button" aria-label="프롬프트 선택">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      </button>

      <div style="flex:1"></div>

      <!-- 연결 TEST + Clear -->
      <button id="topTestBtn" class="iconBtn" type="button" aria-label="연결 테스트">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 1 7 7v3h1a2 2 0 0 1 2 2v6h-2v-6h-2v-5a6 6 0 1 0-12 0v5H2v6H0v-6a2 2 0 0 1 2-2h1V9a7 7 0 0 1 7-7z"/></svg>
      </button>

      <button id="topClearBtn" class="iconBtn" type="button" aria-label="Clear(대화 삭제)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
      </button>

      <!-- 연결 상태 -->
      <button id="connBtn" class="iconBtn connBtn" type="button" aria-label="연결 상태">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l-1.5 1.5a4 4 0 0 1-5.7-5.6L5 10.7a4 4 0 0 1 5.6 0l.8.8-1.4 1.4-.8-.8a2 2 0 0 0-2.8 0L4.2 14.3a2 2 0 1 0 2.8 2.8L8.6 15.5 10 17zm4-10l1.5-1.5a4 4 0 1 1 5.7 5.6L19 13.3a4 4 0 0 1-5.6 0l-.8-.8 1.4-1.4.8.8a2 2 0 0 0 2.8 0l2.2-2.2a2 2 0 1 0-2.8-2.8L15.4 8.5 14 7zM8 14l6-6 1.4 1.4-6 6L8 14z"/></svg>
        <span id="connDot" class="connDot"></span>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">

      <!-- 설정 패널 -->
      <section id="settingsPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          OpenRouter(Gemini) 설정 · 프롬프트 · 폰트(폰 업로드)
        </div>

        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." autocomplete="off" />

        <div class="row">
          <div style="flex:1 1 240px;">
            <label for="model">모델</label>
            <input id="model" type="text" value="google/gemini-2.0-flash" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="temperature">temperature</label>
            <input id="temperature" type="text" value="0.2" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="top_p">top_p</label>
            <input id="top_p" type="text" value="1" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="text" value="800" />
          </div>
        </div>

        <label for="systemPrompt">프롬프트(시스템/규칙)</label>
        <textarea id="systemPrompt" placeholder="여기에 본인 프롬프트를 붙여넣으세요."></textarea>

        <div class="row" style="align-items:center; margin-top:10px;">
          <label style="margin:0; display:flex; align-items:center; gap:10px; color:var(--text);">
            <input id="autoCopy" type="checkbox" style="width:18px; height:18px; accent-color: var(--blue);" />
            번역 완료 시 자동 복사(Chrome 모바일)
          </label>
        </div>

        <label>폰트(폰에서 업로드)</label>
        <div class="row" style="align-items:center;">
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff2" />
          <button id="clearFontBtn" class="btn secondary" type="button">폰트 초기화</button>
          <button id="saveBtn" class="btn" type="button">저장</button>
        </div>
        <div class="hint">현재 폰트: <span id="fontStatus">기본(레포 woff2 우선)</span></div>
      </section>

      <!-- 학습 패널 -->
      <section id="learnPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          학습 기능 - 대화 기록 기반 프롬프트 개선
        </div>

        <label for="learnPrompt1">학습 1번 프롬프트 (질문용)</label>
        <textarea id="learnPrompt1" placeholder="예: 아래 번역 프롬프트와 대화 기록을 분석하여 개선된 번역 프롬프트를 작성해줘"></textarea>

        <label for="learnPrompt2">학습 2번 프롬프트 (학습 결과 저장)</label>
        <textarea id="learnPrompt2" placeholder="학습 결과가 여기에 저장됩니다." readonly style="background:var(--card); cursor:default;"></textarea>

        <div class="row" style="align-items:center; margin-top:10px; gap:10px;">
          <button id="runLearnBtn" class="btn" type="button">학습 실행</button>
          <button id="saveLearnBtn" class="btn secondary" type="button">학습 설정 저장</button>
          <button id="clearLearnBtn" class="btn secondary" type="button">학습 결과 초기화</button>
        </div>
        <div id="learnStatus" class="hint" style="margin-top:8px;">학습 상태: 대기 중</div>
      </section>

      <!-- 프롬프트 선택 패널 -->
      <section id="promptSelectPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          번역에 사용할 프롬프트 선택
        </div>
        <div class="row" style="gap:10px; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; color:var(--text);">
            <input type="radio" name="promptSelect" value="original" checked style="width:18px; height:18px; accent-color:var(--blue);" />
            기존 프롬프트
          </label>
          <label style="display:flex; align-items:center; gap:6px; color:var(--text);">
            <input type="radio" name="promptSelect" value="learned" style="width:18px; height:18px; accent-color:var(--blue);" />
            학습 프롬프트
          </label>
          <label style="display:flex; align-items:center; gap:6px; color:var(--text);">
            <input type="radio" name="promptSelect" value="merged" style="width:18px; height:18px; accent-color:var(--blue);" />
            프롬프트 합치기
          </label>
        </div>
        <div class="row" style="margin-top:10px;">
          <button id="applyPromptBtn" class="btn" type="button">선택 적용</button>
          <button id="mergeToOriginalBtn" class="btn secondary" type="button">학습→기존 복사</button>
        </div>
        <div id="promptSelectStatus" class="hint" style="margin-top:8px;">현재: 기존 프롬프트 사용 중</div>
      </section>

      <!-- 대화 -->
      <section class="panel">
        <div class="panelHead">
          <div class="left">
            <div class="h">Chat</div>
          </div>
        </div>
        <div id="chat" class="chat"></div>
        <div id="bottomAnchor" style="height:1px;"></div>
      </section>

    </div>
  </main>

  <!-- Composer -->
  <div class="composer">
    <div class="composerInner">
      <button id="sendBtnL" class="sendBtn" type="button" aria-label="전송(좌)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>

      <input id="input" type="text" placeholder="" autocomplete="off" />

      <button id="sendBtnR" class="sendBtn" type="button" aria-label="전송(우)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Copy bar -->
  <div id="copyBar" class="copyBar hidden" role="button" aria-label="복사 바">
    <div class="copyBarText">번역 완료 · 탭하면 복사</div>
    <button id="copyBarBtn" class="copyBarBtn" type="button">복사</button>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const LS = {
      apiKey: 'bk_tr_apiKey',
      model: 'bk_tr_model',
      temp: 'bk_tr_temp',
      top_p: 'bk_tr_top_p',
      maxTokens: 'bk_tr_maxTokens',
      system: 'bk_tr_systemPrompt',
      autoCopy: 'bk_tr_autoCopy',
      chat: 'bk_tr_chat',
      learnPrompt1: 'bk_tr_learnPrompt1',
      learnPrompt2: 'bk_tr_learnPrompt2',
      promptSelect: 'bk_tr_promptSelect'
    };

    const el = {
      main: document.getElementById('main'),

      settingsToggleBtn: document.getElementById('settingsToggleBtn'),
      settingsPanel: document.getElementById('settingsPanel'),
      downloadBtn: document.getElementById('downloadBtn'),

      topTestBtn: document.getElementById('topTestBtn'),
      topClearBtn: document.getElementById('topClearBtn'),
      connBtn: document.getElementById('connBtn'),
      connDot: document.getElementById('connDot'),

      apiKey: document.getElementById('apiKey'),
      model: document.getElementById('model'),
      temperature: document.getElementById('temperature'),
      top_p: document.getElementById('top_p'),
      maxTokens: document.getElementById('maxTokens'),
      systemPrompt: document.getElementById('systemPrompt'),
      autoCopy: document.getElementById('autoCopy'),
      saveBtn: document.getElementById('saveBtn'),

      chat: document.getElementById('chat'),
      bottomAnchor: document.getElementById('bottomAnchor'),

      input: document.getElementById('input'),
      sendBtnL: document.getElementById('sendBtnL'),
      sendBtnR: document.getElementById('sendBtnR'),

      copyBar: document.getElementById('copyBar'),
      copyBarBtn: document.getElementById('copyBarBtn'),
      toast: document.getElementById('toast'),

      fontFile: document.getElementById('fontFile'),
      clearFontBtn: document.getElementById('clearFontBtn'),
      fontStatus: document.getElementById('fontStatus')
    };

    function toast(msg){
      el.toast.textContent = String(msg ?? '');
      el.toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.toast.classList.remove('show'), 2200);
    }

    function scrollToBottom(behavior){
      const b = behavior || 'smooth';
      const scroller = el.main;
      const doScroll = () => {
        if(b === 'instant'){
          scroller.scrollTop = scroller.scrollHeight;
        } else {
