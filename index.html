<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Translator (OpenRouter)</title>

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#050505;
      --chatBg:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;

      /* ✅ 테마 색상(사용자 선택) */
      --userBubbleBg:#2e3440;
      --assistantBubbleBg: transparent;
      --inputBg:#2e3440;
      --sendBtnBg:#1d4ed8;
    }

    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      position:sticky; top:0; z-index:30;
      padding: 10px 10px calc(10px + env(safe-area-inset-top));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:10px;
    }
    .title{
      font-weight:800;
      letter-spacing:.2px;
      font-size:14px;
      margin-right:4px;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .ver{
      font-size:12px;
      color: var(--muted);
      font-weight:700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      border:none;
      background: #070707;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor:pointer;
      color: rgba(230,237,243,.88);
      padding:0;
    }
    .iconBtn:active{transform:scale(.98)}
    .iconBtn svg{width:18px; height:18px; fill: currentColor}

    /* ✅ 연결상태: 아이콘 없이 원형 색상만 */
    .statusOnly{
      width:18px;
      height:18px;
      border-radius:999px;
      border: 2px solid rgba(255,255,255,.14);
      background: var(--warn);
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      padding:0;
      cursor:pointer;
    }
    .statusOnly:active{transform:scale(.98)}

    main{
      flex:1;
      overflow:auto;
      padding: 10px;
      padding-bottom: 92px;
    }
    .wrap{
      max-width: 860px;
      margin:0 auto;
    }

    .panel{
      background: var(--chatBg);
      border:none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size:13px}
    .panelHead .s{font-size:12px; color:var(--muted); line-height:1.35}

    .settings{
      margin-bottom:10px;
      padding: 12px 14px 14px;
      background: rgba(10,14,20,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    label{font-size:12px; color:var(--muted); display:block; margin:10px 0 6px}
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size:14px;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size:12px; color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size:13px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}

    /* ===== Theme controls (팔레트 + HEX) ===== */
    .colorGrid{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:8px;
    }
    .colorItem{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }
    .colorItem span{
      font-size:12px;
      color: rgba(230,237,243,.88);
      font-weight:700;
    }
    .colorCtl{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .swatchBtn{
      width:40px;
      height:32px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.10);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      padding:0;
    }
    .swatchBtn:active{transform:scale(.98)}
    .hexInput{
      width:110px;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    /* 오버레이 */
    .pickerOverlay{
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding: 12px;
    }
    .pickerCard{
      width: min(860px, 96vw);
      border-radius: 18px;
      background: rgba(10,16,32,.96);
      box-shadow: 0 18px 48px rgba(0,0,0,.55);
      padding: 14px;
    }
    .pickerTitle{
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .pickerPalette{
      display:grid;
      grid-template-columns: repeat(8, 1fr);
      gap:10px;
    }
    .palBtn{
      width:100%;
      aspect-ratio: 1/1;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      cursor:pointer;
      padding:0;
    }
    .palBtn:active{transform:scale(.98)}
    .palBtn.transparent{
      background:
        linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25% 50%, rgba(255,255,255,.18) 50% 75%, transparent 75%),
        linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25% 50%, rgba(255,255,255,.18) 50% 75%, transparent 75%);
      background-size: 14px 14px;
      background-position: 0 0, 7px 7px;
    }
    .pickerRow{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top: 12px;
    }

    /* ===== Chat ===== */
    .chat{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 16px;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
    }

    .msg.user .bubble{
      background: var(--userBubbleBg);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    /* ✅ 출력 말풍선도 색상 지정 가능(기본 transparent) */
    .msg.assistant .bubble{
      background: var(--assistantBubbleBg);
      color: rgba(230,237,243,.92);
      box-shadow: none;
      max-width: 92%;
    }

    .actionsRow{
      display:flex; gap:8px; align-items:center;
      opacity:.9;
    }
    .miniIconBtn{
      width:32px; height:32px;
      border:none;
      background: rgba(255,255,255,.06);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      color: rgba(230,237,243,.9);
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }
    .miniIconBtn svg{width:18px; height:18px; fill: currentColor}

    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .composerInner{
      max-width: 860px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    #input{
      height:44px;
      line-height:44px;
      flex: 0 1 440px;
      min-width: 160px;
      max-width: 520px;
      padding: 0 12px;
      border-radius: 16px;
      border:none;
      background: var(--inputBg);
      color: #ffffff;
      outline:none;
      font-size: 15px;
    }

    .sendBtn{
      height:44px;
      min-width: 54px;
      border-radius: 16px;
      border:none;
      background: var(--sendBtnBg);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
    }
    .sendBtn:active{transform:scale(.98)}
    .sendBtn svg{
      width:20px; height:20px;
      fill:none;
      stroke:#ffffff;
      stroke-width:2.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size:12px; color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      .title{font-size:13px}
      .iconBtn{width:36px; height:36px}
      main{padding:10px; padding-bottom: 96px;}
      .bubble{font-size:16px}
      #input{
        flex: 1 1 auto;
        max-width: none;
        height:46px;
        line-height:46px;
      }
      .sendBtn{
        height:46px;
        min-width: 56px;
      }
      .pickerPalette{ grid-template-columns: repeat(6, 1fr); }
      .hexInput{ width: 120px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="title">
        BK Translator <span id="verTag" class="ver">v1.40</span>
      </div>

      <button id="settingsToggleBtn" class="iconBtn" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <button id="downloadBtn" class="iconBtn" type="button" aria-label="번역 기록 다운로드">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zm7-18v12l4-4 1.4 1.4L12 16.8l-5.4-5.4L8 10l4 4V2z"/></svg>
      </button>

      <div style="flex:1"></div>

      <!-- ✅ 연결 TEST: 와이파이 아이콘 -->
      <button id="topTestBtn" class="iconBtn" type="button" aria-label="연결 테스트">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 18.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path>
          <path d="M2.3 9.9a14 14 0 0 1 19.4 0l-1.4 1.4a12 12 0 0 0-16.6 0L2.3 9.9z"></path>
          <path d="M5.8 13.4a9 9 0 0 1 12.4 0l-1.4 1.4a7 7 0 0 0-9.6 0l-1.4-1.4z"></path>
          <path d="M9.3 16.9a4 4 0 0 1 5.4 0l-1.4 1.4a2 2 0 0 0-2.6 0l-1.4-1.4z"></path>
        </svg>
      </button>

      <button id="topClearBtn" class="iconBtn" type="button" aria-label="Clear(대화 삭제)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
      </button>

      <!-- ✅ 연결 상태: 원형 색상만 -->
      <button id="connBtn" class="statusOnly" type="button" aria-label="연결 상태"></button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">

      <section id="settingsPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          OpenRouter 설정 · 프롬프트 · 폰트 · 테마(색상)
        </div>

        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." autocomplete="off" />

        <div class="row">
          <div style="flex:1 1 240px;">
            <label for="model">모델</label>
            <input id="model" type="text" value="google/gemini-2.0-flash" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="temperature">temperature</label>
            <input id="temperature" type="text" value="0.2" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="top_p">top_p</label>
            <input id="top_p" type="text" value="1" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="text" value="800" />
          </div>
        </div>

        <label for="systemPrompt">프롬프트(시스템/규칙)</label>
        <textarea id="systemPrompt" placeholder="여기에 본인 프롬프트를 붙여넣으세요."></textarea>

        <div class="row" style="align-items:center; margin-top:10px;">
          <label style="margin:0; display:flex; align-items:center; gap:10px; color:var(--text);">
            <input id="autoCopy" type="checkbox" style="width:18px; height:18px; accent-color: var(--blue);" />
            번역 완료 시 자동 복사(Chrome 모바일)
          </label>
        </div>

        <label>폰트(폰에서 업로드)</label>
        <div class="row" style="align-items:center;">
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff2" />
          <button id="clearFontBtn" class="btn secondary" type="button">폰트 초기화</button>
          <button id="saveBtn" class="btn" type="button">저장</button>
        </div>
        <div class="hint">현재 폰트: <span id="fontStatus">기본(레포 woff2 우선)</span></div>

        <!-- ✅ 테마(색상) 설정: 모바일 호환(팔레트+HEX) -->
        <label style="margin-top:14px;">색상 테마</label>
        <div class="hint">일부 모바일에서 색상선택이 안 되는 문제 방지(팔레트 + HEX 입력)</div>

        <div class="colorGrid">
          <div class="colorItem">
            <span>전체 배경색</span>
            <div class="colorCtl">
              <button id="sw_bg" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_bg" class="hexInput" type="text" maxlength="12" placeholder="#050505" />
            </div>
          </div>

          <div class="colorItem">
            <span>채팅방 배경색</span>
            <div class="colorCtl">
              <button id="sw_chatBg" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_chatBg" class="hexInput" type="text" maxlength="12" placeholder="#0e1420" />
            </div>
          </div>

          <div class="colorItem">
            <span>입력 말풍선색</span>
            <div class="colorCtl">
              <button id="sw_userBubble" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_userBubble" class="hexInput" type="text" maxlength="12" placeholder="#2e3440" />
            </div>
          </div>

          <div class="colorItem">
            <span>출력 말풍선색</span>
            <div class="colorCtl">
              <button id="sw_assistBubble" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_assistBubble" class="hexInput" type="text" maxlength="12" placeholder="transparent" />
            </div>
          </div>

          <div class="colorItem">
            <span>입력창색</span>
            <div class="colorCtl">
              <button id="sw_input" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_input" class="hexInput" type="text" maxlength="12" placeholder="#2e3440" />
            </div>
          </div>

          <div class="colorItem">
            <span>전송 버튼색</span>
            <div class="colorCtl">
              <button id="sw_sendBtn" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_sendBtn" class="hexInput" type="text" maxlength="12" placeholder="#1d4ed8" />
            </div>
          </div>

          <div class="row" style="margin-top:6px;">
            <button id="themeResetBtn" class="btn secondary" type="button">테마 초기화</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div class="left">
            <div class="h">Chat</div>
            <div class="s">입력 후 전송하면 번역 결과가 아래에 표시됩니다.</div>
          </div>
        </div>
        <div id="chat" class="chat"></div>
        <div id="bottomAnchor" style="height:1px;"></div>
      </section>

    </div>
  </main>

  <div class="composer">
    <div class="composerInner">
      <button id="sendBtnL" class="sendBtn" type="button" aria-label="전송(좌)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>

      <input id="input" type="text" placeholder="" autocomplete="off" />

      <button id="sendBtnR" class="sendBtn" type="button" aria-label="전송(우)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="copyBar" class="copyBar hidden" role="button" aria-label="복사 바">
    <div class="copyBarText">번역 완료 · 탭하면 복사</div>
    <button id="copyBarBtn" class="copyBarBtn" type="button">복사</button>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ✅ 모바일 호환 색상선택 오버레이 -->
  <div id="pickerOverlay" class="pickerOverlay hidden" role="dialog" aria-modal="true">
    <div class="pickerCard">
      <div class="pickerTitle">색상 선택</div>
      <div id="pickerPalette" class="pickerPalette"></div>

      <div class="pickerRow">
        <input id="pickerHex" class="hexInput" type="text" maxlength="12" placeholder="#RRGGBB 또는 transparent" />
        <button id="pickerApplyBtn" class="btn" type="button">적용</button>
        <button id="pickerCloseBtn" class="btn secondary" type="button">닫기</button>
      </div>

      <div class="hint" style="margin-top:8px;">HEX 예: #1d4ed8 / 투명: transparent</div>
    </div>
  </div>

  <script>
    /**********************
     * Version (v1.xx)
     **********************/
    const BUILD_ID = "2026-01-26-02"; // ✅ (수정) 코드 수정 시 여기만 변경(자동 버전 증가 트리거)
    const LS_VER = "bk_tr_version";
    const LS_BUILD = "bk_tr_build";
    function clamp2(n){ return Math.round(n * 100) / 100; }
    function fmtVer(n){
      const v = clamp2(n);
      // 소수점 두 자리까지만
      return v.toFixed(2);
    }
    function bumpVersionIfNeeded(){

    /**********************
     * Clipboard Copy
     **********************/
    async function copyToClipboard(text, silent){
      const t = String(text ?? '');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(t);
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      try{
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      if(!silent) toast('복사 실패(보안 정책)');
      return false;
    }

    function hasChinese(s){
      return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(String(s || ''));
    }
    function hasKorean(s){
      return /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(String(s || ''));
    }
    function isEnglishLongText(s){
      const str = String(s || '');

    /**********************
     * Font: IndexedDB
     **********************/
    const DB_NAME = 'bk_tr_db';
    const DB_STORE = 'kv';
    let _fontBlobUrl = null;

    function openDB(){
      return new Promise((resolve, reject) => {
        if(!('indexedDB' in window)) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const os = tx.objectStore(DB_STORE);
        const r = os.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    async function idbSet(key, val){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function applyFontRecord(rec){
      if(_fontBlobUrl){
        try{ URL.revokeObjectURL(_fontBlobUrl); } catch {}
        _fontBlobUrl = null;
      }
      const styleId = 'customFontStyle';
      let st = document.getElementById(styleId);
      if(!st){
        st = document.createElement('style');
        st.id = styleId;
        document.head.appendChild(st);
      }

      if(!rec){
        st.textContent = '';
        document.documentElement.style.setProperty('--fontMain', 'system-ui');
        el.fontStatus.textContent = '기본(레포 woff2 우선)';
        return;
      }

      const blob = new Blob([rec.data], {type: rec.type || 'font/ttf'});
      _fontBlobUrl = URL.createObjectURL(blob);

      const format = (rec.type && rec.type.includes('woff2')) ? 'woff2' : 'truetype';
      st.textContent =
        '@font-face{' +
          'font-family:"BKCustom";' +
          'src:url("' + _fontBlobUrl + '") format("' + format + '");' +
          'font-display:swap;' +
        '}';

      document.documentElement.style.setProperty('--fontMain', '"BKCustom"');
      el.fontStatus.textContent = rec.name || 'BKCustom';
    }

    /**********************
     * Theme (팔레트 + HEX)
     **********************/
    function normalizeColor(s){
      const raw = String(s || '').trim();
      if(!raw) return null;
      const low = raw.toLowerCase();
      if(low === 'transparent') return 'transparent';
      const v = raw.startsWith('#') ? raw : ('#' + raw);
      if(/^#[0-9A-Fa-f]{6}$/.test(v)) return v.toUpperCase();
      if(/^#[0-9A-Fa-f]{3}$/.test(v)){
        const r = v[1], g = v[2], b = v[3];
        return ('#' + r + r + g + g + b + b).toUpperCase();
      }
      return null;
    }

          'linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25% 50%, rgba(255,255,255,.18) 50% 75%, transparent 75%)';
        btn.style.backgroundSize = '14px 14px';
        btn.style.backgroundPosition = '0 0, 7px 7px';
      } else {
        btn.style.background = color;
        btn.style.backgroundSize = '';
        btn.style.backgroundPosition = '';
      }
    }

    function normalizeNewlines(s){
      return String(s).replace(/\\r\\n/g, '\\n').replace(/\\r/g, '\\n');
    }
    function countMeaningfulLines(s){
      const norm = normalizeNewlines(s);
      const trimmed = norm.replace(/\\n+$/g, '');
      if(trimmed.length === 0) return 1;
      return trimmed.split('\\n').length;
    }
    function normalizeOutput(src, out){
      const srcLineCount = countMeaningfulLines(src);
      const norm = normalizeNewlines(out).trimEnd();
      if(norm.length === 0) return '';
      const lines = norm.split('\\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const uniq = [...new Set(nonEmpty.map(l => l.trim()))];
      if(srcLineCount === 1 && uniq.length === 1 && nonEmpty.length > 1){
        return uniq[0];
      }
      return norm;
    }

    function validateNumber(x, min, max, name){
      const v = Number(x);
      if(!Number.isFinite(v)) throw new Error(name + ' 값이 숫자가 아닙니다.');
      if(v < min || v > max) throw new Error(name + ' 범위 오류(' + min + '~' + max + ')');
      return v;
    }

    async function callOpenRouter(userText){
      const apiKey = el.apiKey.value.trim();
      if(!apiKey) throw new Error('API Key가 비어 있습니다.');

      const model = el.model.value.trim();
      if(!model) throw new Error('모델이 비어 있습니다.');

      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const top_p = validateNumber(el.top_p.value.trim(), 0, 1, 'top_p');
      const max_tokens = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 8000, 'max_tokens'));
      const systemPrompt = el.systemPrompt.value || defaultSystemPrompt();

      const payload = {
        model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userText }
        ],
        temperature,
        top_p,
        max_tokens
      };

      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey,
          'HTTP-Referer': location.origin,
          'X-Title': 'BK Translator (Personal)'
        },
        body: JSON.stringify(payload)
      });

      const text = await res.text();
      let json = null;
      try{ json = JSON.parse(text); } catch {}

      if(!res.ok){
        const msg = (json && (json.error?.message || json.message)) ? (json.error?.message || json.message) : text;
        throw new Error('HTTP ' + res.status + ': ' + String(msg).slice(0, 300));
      }

      const out = json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
      if(typeof out !== 'string') throw new Error('응답 파싱 실패');
      return out;
    }

      const row = document.createElement('div');
      row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');

      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = m.text;
      row.appendChild(bubble);

      if(m.role === 'assistant'){
        const actions = document.createElement('div');
        actions.className = 'actionsRow';
        const copyBtn = document.createElement('button');
        copyBtn.className = 'miniIconBtn';
        copyBtn.type = 'button';
        copyBtn.setAttribute('aria-label', '복사');
        copyBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 18H8V7h11v16z"/></svg>';
        copyBtn.addEventListener('click', async () => { await copyToClipboard(m.text, false); });
        actions.appendChild(copyBtn);
        row.appendChild(actions);
      }

      return row;
    }

    function renderChatInitial(){
      el.chat.innerHTML = '';
      if(chat.length === 0){
        const empty = document.createElement('div');
        empty.className = 'hint';
        empty.textContent = '대화가 없습니다. 아래 입력창에 문장을 입력하세요.';
        el.chat.appendChild(empty);
        forceScrollBottom(); // ✅ (수정)
        return;
      }
      for(const m of chat){
        el.chat.appendChild(makeMsgNode(m));
      }
      pruneChatAndDom();     // ✅ (추가)
      forceScrollBottom();   // ✅ (수정)
    }

    function appendChatMessage(m){
      // empty hint 제거
      const first = el.chat.firstChild;
      if(first && first.classList && first.classList.contains('hint')){
        el.chat.innerHTML = '';
      }
      el.chat.appendChild(makeMsgNode(m));

      // ✅ (추가) DOM 제한 + 즉시 하단 고정
      pruneChatAndDom();
      forceScrollBottom();
    }

    async function send(){
      const userText = el.input.value.trim();
      if(!userText) return;

      hideCopyBar();

      const um = { role:'user', text:userText, ts:Date.now() };
      chat.push(um);
      chatTextSet.add(um.text);   // ✅ (추가) Set 업데이트
      pruneChatAndDom();          // ✅ (추가) chat 자체도 길이 제한
      saveChat();
      appendChatMessage(um);

      el.input.value = '';
      setConnState('busy');

      try{
        const translatedRaw = await callOpenRouter(userText);
        const translated = normalizeOutput(userText, translatedRaw);

        const am = { role:'assistant', text: translated, ts: Date.now() };
        chat.push(am);
        chatTextSet.add(am.text); // ✅ (추가)
        pruneChatAndDom();        // ✅ (추가)
        saveChat();
        appendChatMessage(am);

        // 자동복사(정책상 간헐 실패 가능 → 실패 시 재시도 예약)
        if(el.autoCopy.checked && hasChinese(translated)){
          const ok = await copyToClipboard(translated, true);
          if(ok){
            toast('중국어 자동 복사 완료');
            updateLastClipboard(translated);
          } else {
            showCopyBar(translated);
            scheduleCopyRetry(translated);
            toast('자동 복사 제한 → 아래 바 탭(또는 화면 터치 시 재시도)');
          }
        } else {
          hideCopyBar();
        }

        setConnState('ok');
        forceScrollBottom(); // ✅ (수정) 번역 완료 즉시 하단
      } catch(err){
        const msg = (err && err.message) ? err.message : String(err);
        const em = { role:'assistant', text: '오류: ' + msg, ts: Date.now() };
        chat.push(em);
        chatTextSet.add(em.text); // ✅ (추가)
        pruneChatAndDom();        // ✅ (추가)
        saveChat();
        appendChatMessage(em);
        setConnState('err');
        toast('요청 실패: ' + msg);
      }
    }

    async function testConnection(){
      setConnState('busy');
      try{
        await callOpenRouter('ping');
        setConnState('ok');
        toast('연결 테스트 성공');
      } catch(err){
        setConnState('err');
        toast('연결 테스트 실패: ' + (err && err.message ? err.message : err));
      }
    }

    function clearChatOnly(){
      if(!confirm('대화를 삭제합니다. 계속할까요?')) return;
      chat = [];
      chatTextSet = new Set(); // ✅ (추가)
      hideCopyBar();
      try{ localStorage.setItem(LS.chat, '[]'); } catch {}
      try{ localStorage.removeItem(LS.chat); } catch {}
      renderChatInitial();
      toast('Clear 완료');
    }

    function downloadChatAsTxt(){
      if(chat.length === 0){
        toast('다운로드할 번역 기록이 없습니다.');
        return;
      }
      let content = '';
      for(const m of chat){
        const role = m.role === 'user' ? '[입력]' : '[번역]';
        const time = m.ts ? new Date(m.ts).toLocaleString('ko-KR') : '';
        content += role + ' ' + time + '\\n' + m.text + '\\n\\n';
      }
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'BK_Translator_' + new Date().toISOString().slice(0,10) + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('번역 기록 다운로드 완료');
    }

    /**********************
     * Clipboard auto-watch (>=300자 자동번역 방지)
     **********************/
    const LS_LAST_CLIP = 'bk_tr_lastClip';
    let _lastClipboardText = localStorage.getItem(LS_LAST_CLIP) || '';
    function updateLastClipboard(text){
      _lastClipboardText = text;
      try{ localStorage.setItem(LS_LAST_CLIP, text); } catch {}
    }

    async function checkClipboard(){
      try{
        if(_isBusy) return;
        if(!navigator.clipboard || !navigator.clipboard.readText) return;

        const clipText = await navigator.clipboard.readText();
        const trimmed = String(clipText || '').trim();
        if(!trimmed) return;

        // ✅ 300자 이상 자동번역 금지(프롬프트 붙여넣기 방지)
        if(trimmed.length >= 300) return;

        if(_lastClipboardText === trimmed) return;

        // ✅ (수정) 대화 내 중복 방지: chat 순회 제거(Set로 O(1))
        if(chatTextSet.has(trimmed)) return;

        // 한국어/중국어만 자동
        if(!hasKorean(trimmed) && !hasChinese(trimmed)) return;
        if(isEnglishLongText(trimmed)) return;

        updateLastClipboard(trimmed);
        el.input.value = trimmed;
        setTimeout(() => send(), 80);
      } catch(err){
        // 권한 거부 등 무시
      }
    }

    /**********************
     * Init
     **********************/
    const ver = bumpVersionIfNeeded();
    el.verTag.textContent = 'v' + fmtVer(ver);

    loadSettings();
    loadCustomFont();
    loadTheme();

    // 테마 input 바인딩
    [el.c_bg, el.c_chatBg, el.c_userBubble, el.c_assistBubble, el.c_input, el.c_sendBtn].forEach(bindThemeInput);

    // swatch 버튼 → picker
    el.sw_bg.addEventListener('click', () => openPicker(el.c_bg));
    el.sw_chatBg.addEventListener('click', () => openPicker(el.c_chatBg));
    el.sw_userBubble.addEventListener('click', () => openPicker(el.c_userBubble));
    el.sw_assistBubble.addEventListener('click', () => openPicker(el.c_assistBubble));
    el.sw_input.addEventListener('click', () => openPicker(el.c_input));
    el.sw_sendBtn.addEventListener('click', () => openPicker(el.c_sendBtn));

    el.pickerApplyBtn.addEventListener('click', () => {
      if(!_pickerTargetInput) return;
      const n = normalizeColor(el.pickerHex.value);
      if(!n){ toast('형식 오류: #RRGGBB 또는 transparent'); return; }
      _pickerTargetInput.value = n;
      _pickerTargetInput.dispatchEvent(new Event('input', { bubbles:true }));
      closePicker();
    });
    el.pickerCloseBtn.addEventListener('click', closePicker);
    el.pickerOverlay.addEventListener('click', (e) => {
      if(e.target === el.pickerOverlay) closePicker();
    });

    el.themeResetBtn.addEventListener('click', () => {
      el.c_bg.value = DEFAULT_THEME.bg;
      el.c_chatBg.value = DEFAULT_THEME.chatBg;
      el.c_userBubble.value = DEFAULT_THEME.userBubble;
      el.c_assistBubble.value = DEFAULT_THEME.assistBubble;
      el.c_input.value = DEFAULT_THEME.inputBg;
      el.c_sendBtn.value = DEFAULT_THEME.sendBtn;
      const t = currentThemeFromInputs();
      applyTheme(t);
      saveTheme(t);
      toast('테마 초기화 완료');
    });

    renderChatInitial();
    setSettingsVisible(false);
    setConnState('warn');

    // 클립보드 감시
    checkClipboard();
    setInterval(checkClipboard, 1000);

    /**********************
     * Events
     **********************/
    el.settingsToggleBtn.addEventListener('click', toggleSettings);
    el.downloadBtn.addEventListener('click', downloadChatAsTxt);
    el.topTestBtn.addEventListener('click', testConnection);
    el.topClearBtn.addEventListener('click', clearChatOnly);
    el.saveBtn.addEventListener('click', saveSettings);

    el.sendBtnL.addEventListener('click', send);
    el.sendBtnR.addEventListener('click', send);

    el.input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        send();
      }
      if(e.key === 'Escape'){
        el.input.value = '';
      }
    });

    el.copyBar.addEventListener('click', async () => {
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });
    el.copyBarBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });

    el.fontFile.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) await saveCustomFontFile(file);
      e.target.value = '';
    });
    el.clearFontBtn.addEventListener('click', clearCustomFont);

    // ✅ (수정) 포커스/리사이즈 시에도 강제 하단 고정(PC/모바일)
    el.input.addEventListener('focus', () => forceScrollBottom());
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', () => forceScrollBottom());
    }
    window.addEventListener('resize', () => forceScrollBottom());

    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      toast('권장: HTTPS에서 사용하세요(키 보안)');
    }
  </script>
</body>
</html>
