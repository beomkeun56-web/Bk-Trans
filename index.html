<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Translator v1.2</title>

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#050505;
      --panel1:#0b0f14;
      --panel2:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;
    }

    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* ===== Header ===== */
    header{
      position:sticky; top:0; z-index:30;
      padding: 10px 10px calc(10px + env(safe-area-inset-top));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:10px;
    }
    .title{
      font-weight:800;
      letter-spacing:.2px;
      font-size:14px;
      margin-right:4px;
      display: flex;
      align-items: baseline;
      gap: 4px;
    }
    .version-tag {
        font-size: 11px;
        font-weight: 400;
        color: var(--muted);
        opacity: 0.8;
    }

    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      border:none;
      background: #070707;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor:pointer;
      color: rgba(230,237,243,.88);
      padding:0;
    }
    .iconBtn:active{transform:scale(.98)}
    
    /* [수정] 아이콘 크기 최적화 */
    .iconBtn svg{width:22px; height:22px; fill: currentColor}

    /* 연결 상태 표시등 스타일 */
    .status-indicator-box {
      width:36px; height:36px;
      display:flex; align-items:center; justify-content:center;
      background: transparent;
      box-shadow: none;
      cursor: default;
    }
    .connDot{
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--warn);
      box-shadow: 0 0 8px rgba(0,0,0,0.5);
      border: 2px solid rgba(255,255,255,0.1);
      transition: background 0.3s ease;
    }

    /* ===== Main ===== */
    main{
      flex:1;
      overflow:auto;
      padding: 10px;
      padding-bottom: 92px;
    }
    .wrap{
      max-width: 860px;
      margin:0 auto;
    }

    .panel{
      background: linear-gradient(180deg, rgba(14,20,32,.92), rgba(8,12,18,.92));
      border:none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size:13px}
    .panelHead .s{font-size:12px; color:var(--muted); line-height:1.35}

    /* ===== Settings & Learning ===== */
    .settings, .learningPanel{
      margin-bottom:10px;
      padding: 12px 14px 14px;
      background: rgba(10,14,20,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .settings .row, .learningPanel .row{display:flex; gap:10px; flex-wrap:wrap}
      
    label{font-size:12px; color:var(--muted); display:block; margin:10px 0 6px}
    .sectionTitle {
        font-size: 13px; font-weight: 700; color: var(--blue); margin: 15px 0 5px; 
        border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px;
    }

    input[type="password"], input[type="text"], textarea, select {
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size:14px;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size:12px; color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size:13px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      flex: 1; 
      min-width: 80px;
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}
    .btn.full{width: 100%;}

    /* 라디오 버튼 그룹 */
    .radio-group {
        display: flex; gap: 10px; margin-bottom: 10px; background: rgba(0,0,0,0.2); padding: 5px; border-radius: 12px;
    }
    .radio-label {
        flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 10px; font-size: 13px; color: var(--muted); margin: 0;
        transition: all 0.2s;
    }
    .radio-label:hover { background: rgba(255,255,255,0.05); }
    input[type="radio"] { display: none; }
    input[type="radio"]:checked + .radio-label {
        background: var(--blue); color: white; font-weight: bold;
    }

    /* ===== Chat ===== */
    .chat{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 16px;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
    }

    .msg.user .bubble{
      background: rgba(46, 52, 64, .92);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    .msg.assistant .bubble{
      background: transparent;
      color: rgba(230,237,243,.92);
      box-shadow: none;
      padding: 0;
      border-radius: 0;
      max-width: 92%;
    }

    .actionsRow{
      display:flex; gap:8px; align-items:center;
      opacity:.9;
    }
    .miniIconBtn{
      width:32px; height:32px;
      border:none;
      background: rgba(255,255,255,.06);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      color: rgba(230,237,243,.9);
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }
    .miniIconBtn svg{width:18px; height:18px; fill: currentColor}

    /* ===== Composer ===== */
    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .composerInner{
      max-width: 860px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    #input{
      height:44px;
      line-height:44px;
      flex: 0 1 440px;
      min-width: 160px;
      max-width: 520px;
      padding: 0 12px;
      border-radius: 16px;
      border:none;
      background: #2e3440;
      color: #ffffff;
      outline:none;
      font-size: 15px;
    }

    .sendBtn{
      height:44px;
      min-width: 54px;
      border-radius: 16px;
      border:none;
      background: rgba(45,107,255,.18);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
    }
    .sendBtn:active{transform:scale(.98)}
    .sendBtn svg{
      width:20px; height:20px;
      fill:none;
      stroke:#ffffff;
      stroke-width:2.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* 토스트 */
    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    /* 복사 바 */
    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size:12px; color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      .title{font-size:13px}
      .iconBtn{width:36px; height:36px}
      main{padding:10px; padding-bottom: 96px;}
      .bubble{font-size:16px}
      #input{
        flex: 1 1 auto;
        max-width: none;
        height:46px;
        line-height:46px;
      }
      .sendBtn{
        height:46px;
        min-width: 56px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="title">
        BK Translator <span class="version-tag">v1.2</span>
      </div>

      <button id="settingsToggleBtn" class="iconBtn" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <button id="learningToggleBtn" class="iconBtn" type="button" aria-label="학습 메뉴">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/></svg>
      </button>

      <button id="downloadBtn" class="iconBtn" type="button" aria-label="번역 기록 다운로드">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zm7-18v12l4-4 1.4 1.4L12 16.8l-5.4-5.4L8 10l4 4V2z"/></svg>
      </button>

      <div style="flex:1"></div>

      <button id="topTestBtn" class="iconBtn" type="button" aria-label="연결 테스트" style="color:#ffffff;">
        <svg viewBox="0 0 24 24" aria-hidden="true">
           <path d="M12.01 21.49L23.64 7c-.45-.34-4.93-4-11.64-4C5.28 3 .81 6.66.36 7l11.63 14.49.01.01.01-.01z"/>
        </svg>
      </button>

      <button id="topClearBtn" class="iconBtn" type="button" aria-label="Clear(대화 삭제)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
      </button>

      <div class="iconBtn status-indicator-box" aria-label="연결 상태">
        <span id="connDot" class="connDot"></span>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="wrap">

      <section id="settingsPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          OpenRouter(Gemini) 설정 · 기존 프롬프트
        </div>

        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." autocomplete="off" />

        <div class="row">
          <div style="flex:1 1 240px;">
            <label for="model">모델</label>
            <input id="model" type="text" value="google/gemini-2.0-flash" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="temperature">temperature</label>
            <input id="temperature" type="text" value="0.2" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="top_p">top_p</label>
            <input id="top_p" type="text" value="1" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="text" value="800" />
          </div>
        </div>

        <label for="systemPrompt">기존 번역 프롬프트</label>
        <textarea id="systemPrompt" placeholder="기존 시스템 프롬프트 내용"></textarea>

        <div class="row" style="align-items:center; margin-top:10px;">
          <label style="margin:0; display:flex; align-items:center; gap:10px; color:var(--text);">
            <input id="autoCopy" type="checkbox" style="width:18px; height:18px; accent-color: var(--blue);" />
            번역 완료 시 자동 복사(Chrome 모바일)
          </label>
        </div>

        <label>폰트(폰에서 업로드)</label>
        <div class="row" style="align-items:center;">
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff2" />
          <button id="clearFontBtn" class="btn secondary" type="button">폰트 초기화</button>
          <button id="saveBtn" class="btn" type="button">저장</button>
        </div>
        <div class="hint">현재 폰트: <span id="fontStatus">기본(레포 woff2 우선)</span></div>
      </section>

      <section id="learningPanel" class="learningPanel hidden">
        <div class="hint" style="margin-bottom:8px; color:var(--blue);">
          자동 학습 및 프롬프트 개선 (Self-Learning)
        </div>

        <div class="sectionTitle">1. 학습용 질문 (Prompt 1)</div>
        <div class="hint">이 내용을 토대로 기존 프롬프트와 대화기록을 분석하여 개선안을 만듭니다.</div>
        <textarea id="analysisPromptInput">
당신은 'AI 번역 품질 분석가'이자 '프롬프트 엔지니어'입니다.
아래 제공되는 [기존 프롬프트]와 [대화 기록]을 정밀 분석하십시오.
사용자가 AI의 번역을 수정했거나, 특정 패턴으로 재요청한 내용을 찾아내세요.
이를 바탕으로 오역, 오타, 문맥 오류를 줄이고 사용자의 말투를 반영하도록 [기존 프롬프트]를 개선하십시오.
출력은 설명 없이 오직 [개선된 시스템 프롬프트 전체 전문]만 출력해야 합니다.
        </textarea>
        
        <button id="runLearnBtn" class="btn full" type="button" style="background:var(--blue2); margin-top:8px;">
           지금 학습 시작 (API 호출)
        </button>

        <div class="sectionTitle" style="margin-top:20px;">2. 학습된 프롬프트 (Prompt 2)</div>
        <textarea id="learnedPromptInput" placeholder="학습 결과가 여기에 표시됩니다."></textarea>

        <div class="sectionTitle">프롬프트 선택</div>
        <div class="radio-group">
            <input type="radio" id="useOriginal" name="promptMode" value="original" checked>
            <label class="radio-label" for="useOriginal">기존 프롬프트 사용</label>

            <input type="radio" id="useLearned" name="promptMode" value="learned">
            <label class="radio-label" for="useLearned">학습된(Prompt 2) 사용</label>
        </div>

        <div class="row">
             <button id="mergePromptBtn" class="btn secondary" type="button">합치기 (학습2 → 기존 덮어쓰기)</button>
        </div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div class="left">
            <div class="h">Chat</div>
          </div>
        </div>
        <div id="chat" class="chat"></div>
        <div id="bottomAnchor" style="height:1px;"></div>
      </section>

    </div>
  </main>

  <div class="composer">
    <div class="composerInner">
      <button id="sendBtnL" class="sendBtn" type="button" aria-label="전송(좌)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>

      <input id="input" type="text" placeholder="" autocomplete="off" />

      <button id="sendBtnR" class="sendBtn" type="button" aria-label="전송(우)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="copyBar" class="copyBar hidden" role="button" aria-label="복사 바">
    <div class="copyBarText">번역 완료 · 탭하면 복사</div>
    <button id="copyBarBtn" class="copyBarBtn" type="button">복사</button>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // [중요] 마지막 처리된 텍스트 저장 (무한 루프/중복 방지용)
    let lastProcessedText = "";

    const LS = {
      apiKey: 'bk_tr_apiKey',
      model: 'bk_tr_model',
      temp: 'bk_tr_temp',
      top_p: 'bk_tr_top_p',
      maxTokens: 'bk_tr_maxTokens',
      system: 'bk_tr_systemPrompt',
      autoCopy: 'bk_tr_autoCopy',
      chat: 'bk_tr_chat',
      analysisPrompt: 'bk_tr_analysisPrompt',
      learnedPrompt: 'bk_tr_learnedPrompt',
      activeMode: 'bk_tr_activeMode',
      draft: 'bk_tr_draft' 
    };

    const el = {
      main: document.getElementById('main'),

      settingsToggleBtn: document.getElementById('settingsToggleBtn'),
      settingsPanel: document.getElementById('settingsPanel'),
      
      learningToggleBtn: document.getElementById('learningToggleBtn'),
      learningPanel: document.getElementById('learningPanel'),

      downloadBtn: document.getElementById('downloadBtn'),

      topTestBtn: document.getElementById('topTestBtn'),
      topClearBtn: document.getElementById('topClearBtn'),
      connDot: document.getElementById('connDot'),

      apiKey: document.getElementById('apiKey'),
      model: document.getElementById('model'),
      temperature: document.getElementById('temperature'),
      top_p: document.getElementById('top_p'),
      maxTokens: document.getElementById('maxTokens'),
      systemPrompt: document.getElementById('systemPrompt'),
      autoCopy: document.getElementById('autoCopy'),
      saveBtn: document.getElementById('saveBtn'),

      analysisPromptInput: document.getElementById('analysisPromptInput'),
      runLearnBtn: document.getElementById('runLearnBtn'),
      learnedPromptInput: document.getElementById('learnedPromptInput'),
      useOriginal: document.getElementById('useOriginal'),
      useLearned: document.getElementById('useLearned'),
      mergePromptBtn: document.getElementById('mergePromptBtn'),

      chat: document.getElementById('chat'),
      bottomAnchor: document.getElementById('bottomAnchor'),

      input: document.getElementById('input'),
      sendBtnL: document.getElementById('sendBtnL'),
      sendBtnR: document.getElementById('sendBtnR'),

      copyBar: document.getElementById('copyBar'),
      copyBarBtn: document.getElementById('copyBarBtn'),
      toast: document.getElementById('toast'),

      fontFile: document.getElementById('fontFile'),
      clearFontBtn: document.getElementById('clearFontBtn'),
      fontStatus: document.getElementById('fontStatus')
    };

    function toast(msg){
      el.toast.textContent = String(msg ?? '');
      el.toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.toast.classList.remove('show'), 2200);
    }

    function scrollToBottom(behavior){
      const b = behavior || 'smooth';
      const scroller = el.main;
      const doScroll = () => {
        if(b === 'instant'){
          scroller.scrollTop = scroller.scrollHeight;
        } else {
          try{ scroller.scrollTo({ top: scroller.scrollHeight, behavior: b }); }
          catch { scroller.scrollTop = scroller.scrollHeight; }
        }
      };
      if(b === 'instant'){
        doScroll();
      } else {
        requestAnimationFrame(() => { doScroll(); requestAnimationFrame(doScroll); });
      }
    }

    async function copyToClipboard(text, silent){
      const t = String(text ?? '');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(t);
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      try{
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}

    function hasChinese(s){

    function hasKorean(s){
      return /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(String(s || ''));

    function isEnglishLongText(s){
      const str = String(s || '');
      if(hasKorean(str) || hasChinese(str)) return false;
      const englishChars = str.match(/[a-zA-Z]/g);
      return englishChars && englishChars.length >= 40;
    }

    function speakChinese(text){
      if(!('speechSynthesis' in window)) {
        toast('TTS 미지원 브라우저');
        return;
      }
      window.speechSynthesis.cancel();
      const speak = () => {
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';
        utterance.rate = 0.9;
        utterance.pitch = 1.1;
        const voices = window.speechSynthesis.getVoices();
        const zhVoice = voices.find(v => 
          (v.lang === 'zh-CN' || v.lang === 'zh_CN' || v.lang.startsWith('zh')) && 
          (v.name.toLowerCase().includes('female') || v.name.includes('Ting') || v.name.includes('Xiaoxiao') || v.name.includes('Huihui'))
        ) || voices.find(v => v.lang === 'zh-CN' || v.lang === 'zh_CN' || v.lang.startsWith('zh'));
        if(zhVoice) utterance.voice = zhVoice;
        window.speechSynthesis.speak(utterance);
      };
      const voices = window.speechSynthesis.getVoices();
      if(voices.length > 0){
        speak();
      } else {
        window.speechSynthesis.onvoiceschanged = () => {
          speak();
          window.speechSynthesis.onvoiceschanged = null;
        };
        setTimeout(() => {
          if(window.speechSynthesis.getVoices().length > 0) speak();
        }, 100);
      }
    }

    // ===== Font: IndexedDB =====
    const DB_NAME = 'bk_tr_db';
    const DB_STORE = 'kv';
    let _fontBlobUrl = null;

    function openDB(){
      return new Promise((resolve, reject) => {
        if(!('indexedDB' in window)) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const os = tx.objectStore(DB_STORE);
        const r = os.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    async function idbSet(key, val){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

      if(_fontBlobUrl){

      let st = document.getElementById(styleId);
      if(!st){
        st = document.createElement('style');
        st.id = styleId;

        document.documentElement.style.setProperty('--fontMain', 'system-ui');
        el.fontStatus.textContent = '기본(레포 woff2 우선)';

      const blob = new Blob([rec.data], {type: rec.type || 'font/ttf'});
      _fontBlobUrl = URL.createObjectURL(blob);

      const format = (rec.type && rec.type.includes('woff2')) ? 'woff2' : 'truetype';
      st.textContent =
        '@font-face{' +
          'font-family:"BKCustom";' +
          'src:url("' + _fontBlobUrl + '") format("' + format + '");' +
          'font-display:swap;' +

    function normalizeNewlines(s){
      return String(s).replace(/\\r\\n/g, '\\n').replace(/\\r/g, '\\n');
    }

    function countMeaningfulLines(s){
      const norm = normalizeNewlines(s);
      const trimmed = norm.replace(/\\n+$/g, '');
      if(trimmed.length === 0) return 1;
      return trimmed.split('\\n').length;
    }

    function normalizeOutput(src, out){
      const srcLineCount = countMeaningfulLines(src);
      const norm = normalizeNewlines(out).trimEnd();
      if(norm.length === 0) return '';
      const lines = norm.split('\\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const uniq = [...new Set(nonEmpty.map(l => l.trim()))];
      if(srcLineCount === 1 && uniq.length === 1 && nonEmpty.length > 1){
        return uniq[0];
      }
      return norm;
    }

    function validateNumber(x, min, max, name){
      const v = Number(x);
      if(!Number.isFinite(v)) throw new Error(name + ' 값이 숫자가 아닙니다.');
      if(v < min || v > max) throw new Error(name + ' 범위 오류(' + min + '~' + max + ')');
      return v;
    }

    async function callOpenRouter(userText, overrideSystemPrompt){
      const apiKey = el.apiKey.value.trim();
      if(!apiKey) throw new Error('API Key가 비어 있습니다.');

      const model = el.model.value.trim();
      if(!model) throw new Error('모델이 비어 있습니다.');

      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const top_p = validateNumber(el.top_p.value.trim(), 0, 1, 'top_p');
      const max_tokens = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 8000, 'max_tokens'));
      
      let systemPrompt = overrideSystemPrompt;
      if (!systemPrompt) {
          if (el.useLearned.checked && el.learnedPromptInput.value.trim()) {
              systemPrompt = el.learnedPromptInput.value;
          } else {
              systemPrompt = el.systemPrompt.value || defaultSystemPrompt();
          }
      }

      const payload = {
        model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userText }
        ],
        temperature,
        top_p,
        max_tokens
      };

      // [수정] 429 오류 발생 시 자동 재시도 로직 추가
      let retries = 0;
      const maxRetries = 3;

      while(true){
          const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + apiKey,
              'HTTP-Referer': location.origin || 'http://localhost', 
              'X-Title': 'BK Translator (Personal)'
            },
            body: JSON.stringify(payload)
          });

          if(res.status === 429){
              if(retries < maxRetries){
                  retries++;
                  const delay = 1000 * retries; // 1초, 2초, 3초 대기
                  toast(`서버 혼잡 (429). ${retries}차 재시도 중...`);
                  await new Promise(r => setTimeout(r, delay));
                  continue; // 루프 다시 실행
              } else {
                   throw new Error('HTTP 429: 서버가 너무 바쁩니다. 잠시 후 다시 시도하세요.');
              }
          }

          const text = await res.text();
          let json = null;
          try{ json = JSON.parse(text); } catch {}

          if(!res.ok){
            const msg = (json && (json.error?.message || json.message)) ? (json.error?.message || json.message) : text;
            throw new Error('HTTP ' + res.status + ': ' + String(msg).slice(0, 300));
          }

          const out = json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
          if(typeof out !== 'string') throw new Error('응답 파싱 실패');
          return out;
      }
    }

    async function send(){
      const userText = el.input.value.trim();
      if(!userText) return;

      // [무한 루프 차단 1차] 방금 전송한 내용과 완벽히 동일하면 무시
      if(userText === lastProcessedText) {

          return;

        saveChat();
        renderChat();

        if(el.autoCopy.checked && hasChinese(translated)){
          const ok = await copyToClipboard(translated, true);
          if(ok){

            // [무한 루프 차단 2차] 자동 복사한 내용은 클립보드 감지에서 무시하도록 즉시 업데이트
            updateLastClipboard(translated); 
          }
          else{
            showCopyBar(translated);
            toast('자동 복사 제한 → 아래 바 탭');
          }
        } else {
          hideCopyBar();
        }

        setConnState('ok');
      } catch(err){
        const msg = (err && err.message) ? err.message : String(err);
        chat.push({ role:'assistant', text: '오류: ' + msg, ts: Date.now() });
        saveChat();
        renderChat();
        setConnState('err');
        toast('요청 실패: ' + msg);
      }
    }

    async function checkClipboard(){
      try{
        if(_isBusy) return;
        if(!navigator.clipboard || !navigator.clipboard.readText) return;
        
        const clipText = await navigator.clipboard.readText();
        const trimmed = String(clipText || '').trim();
        
        if(!trimmed) return;
        
        // 1. 방금 처리한 텍스트와 같으면 패스 (1차 방어)
        if(trimmed === lastProcessedText) return;

        // 2. 내부적으로 알고 있는 마지막 클립보드 내용과 같으면 패스 (2차 방어)
        if(_lastClipboardText === trimmed) return;

        // 3. [핵심 수정] 대화 기록 전체(User + Assistant) 중 동일한 내용이 있으면 패스
        // 단순 === 비교가 아니라 trim() 후 비교하여 미세한 공백 차이로 인한 루프 방지
        const isExistInHistory = chat.some(msg => msg.text.trim() === trimmed);

        if(isExistInHistory) {
            // 이미 기록에 존재함 → 클립보드 상태만 갱신하고 자동 입력은 하지 않음
            updateLastClipboard(trimmed);
            return;
        }
        
        // 언어 감지 필터
        if(!hasKorean(trimmed) && !hasChinese(trimmed)) return;
        if(isEnglishLongText(trimmed)) return;
        
        // 통과 시 실행
        updateLastClipboard(trimmed);
        el.input.value = trimmed;
        toast('클립보드 감지 → 자동 번역');

        setTimeout(() => send(), 200);

      } catch(err){
      }
    }
    
    checkClipboard();
    setInterval(checkClipboard, 1000);

    if('speechSynthesis' in window){
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    // Events
    el.settingsToggleBtn.addEventListener('click', toggleSettings);
    el.learningToggleBtn.addEventListener('click', toggleLearning);
    el.downloadBtn.addEventListener('click', downloadChatAsTxt);
    el.topTestBtn.addEventListener('click', testConnection);
    el.topClearBtn.addEventListener('click', clearChatOnly);
    el.saveBtn.addEventListener('click', saveSettings);
    
    el.runLearnBtn.addEventListener('click', runLearning);
    el.mergePromptBtn.addEventListener('click', mergePrompt);
    
    el.useOriginal.addEventListener('change', saveSettings);
    el.useLearned.addEventListener('change', saveSettings);

    el.sendBtnL.addEventListener('click', send);
    el.sendBtnR.addEventListener('click', send);

    el.input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        send();
      }
      if(e.key === 'Escape'){
        el.input.value = '';
      }
    });

    el.copyBar.addEventListener('click', async () => {
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });
    el.copyBarBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });

    el.fontFile.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) await saveCustomFontFile(file);
      e.target.value = '';
    });
    el.clearFontBtn.addEventListener('click', clearCustomFont);

    el.input.addEventListener('focus', () => scrollToBottom('smooth'));
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', () => scrollToBottom('smooth'));
    }

    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      toast('권장: HTTPS에서 사용하세요(키 보안)');
    }
  </script>
</body>
</html>
