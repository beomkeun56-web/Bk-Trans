<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Translator (OpenRouter)</title>

  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#050505;
      --chatBg:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;

      /* ✅ 테마 색상(사용자 선택) */
      --userBubbleBg:#2e3440;
      --assistantBubbleBg: transparent;
      --inputBg:#2e3440;
      --sendBtnBg:#1d4ed8;
    }

    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      position:sticky; top:0; z-index:30;
      padding: 10px 10px calc(10px + env(safe-area-inset-top));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:10px;
    }
    .title{
      font-weight:800;
      letter-spacing:.2px;
      font-size:14px;
      margin-right:4px;
      display:flex;
      gap:8px;
      align-items:center;
    }
    .ver{
      font-size:12px;
      color: var(--muted);
      font-weight:700;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.06);
    }

    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      border:none;
      background: #070707;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor:pointer;
      color: rgba(230,237,243,.88);
      padding:0;
    }
    .iconBtn:active{transform:scale(.98)}
    .iconBtn svg{width:18px; height:18px; fill: currentColor}

    /* ✅ 연결상태: 아이콘 없이 원형 색상만 */
    .statusOnly{
      width:18px;
      height:18px;
      border-radius:999px;
      border: 2px solid rgba(255,255,255,.14);
      background: var(--warn);
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      padding:0;
      cursor:pointer;
    }
    .statusOnly:active{transform:scale(.98)}

    main{
      flex:1;
      overflow:auto;
      padding: 10px;
      padding-bottom: 92px;
    }
    .wrap{
      max-width: 860px;
      margin:0 auto;
    }

    .panel{
      background: var(--chatBg);
      border:none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size:13px}
    .panelHead .s{font-size:12px; color:var(--muted); line-height:1.35}

    .settings{
      margin-bottom:10px;
      padding: 12px 14px 14px;
      background: rgba(10,14,20,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    label{font-size:12px; color:var(--muted); display:block; margin:10px 0 6px}
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size:14px;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size:12px; color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size:13px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}

    /* ===== Theme controls (팔레트 + HEX) ===== */
    .colorGrid{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:8px;
    }
    .colorItem{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding: 10px 10px;
      border-radius: 14px;
      background: rgba(255,255,255,.04);
    }
    .colorItem span{
      font-size:12px;
      color: rgba(230,237,243,.88);
      font-weight:700;
    }
    .colorCtl{
      display:flex;
      align-items:center;
      gap:10px;
    }
    .swatchBtn{
      width:40px;
      height:32px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.10);
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      padding:0;
    }
    .swatchBtn:active{transform:scale(.98)}
    .hexInput{
      width:110px;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    /* 오버레이 */
    .pickerOverlay{
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.55);
      display:flex;
      align-items:flex-end;
      justify-content:center;
      padding: 12px;
    }
    .pickerCard{
      width: min(860px, 96vw);
      border-radius: 18px;
      background: rgba(10,16,32,.96);
      box-shadow: 0 18px 48px rgba(0,0,0,.55);
      padding: 14px;
    }
    .pickerTitle{
      font-weight: 800;
      font-size: 13px;
      margin-bottom: 10px;
    }
    .pickerPalette{
      display:grid;
      grid-template-columns: repeat(8, 1fr);
      gap:10px;
    }
    .palBtn{
      width:100%;
      aspect-ratio: 1/1;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.10);
      cursor:pointer;
      padding:0;
    }
    .palBtn:active{transform:scale(.98)}
    .palBtn.transparent{
      background:
        linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25% 50%, rgba(255,255,255,.18) 50% 75%, transparent 75%),
        linear-gradient(45deg, rgba(255,255,255,.18) 25%, transparent 25% 50%, rgba(255,255,255,.18) 50% 75%, transparent 75%);
      background-size: 14px 14px;
      background-position: 0 0, 7px 7px;
    }
    .pickerRow{
      display:flex;
      gap:10px;
      align-items:center;
      margin-top: 12px;
    }

    /* ===== Chat ===== */
    .chat{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 16px;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
    }

    .msg.user .bubble{
      background: var(--userBubbleBg);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    /* ✅ 출력 말풍선도 색상 지정 가능(기본 transparent) */
    .msg.assistant .bubble{
      background: var(--assistantBubbleBg);
      color: rgba(230,237,243,.92);
      box-shadow: none;
      max-width: 92%;
    }

    .actionsRow{
      display:flex; gap:8px; align-items:center;
      opacity:.9;
    }
    .miniIconBtn{
      width:32px; height:32px;
      border:none;
      background: rgba(255,255,255,.06);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      color: rgba(230,237,243,.9);
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }
    .miniIconBtn svg{width:18px; height:18px; fill: currentColor}

    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .composerInner{
      max-width: 860px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    #input{
      height:44px;
      line-height:44px;
      flex: 0 1 440px;
      min-width: 160px;
      max-width: 520px;
      padding: 0 12px;
      border-radius: 16px;
      border:none;
      background: var(--inputBg);
      color: #ffffff;
      outline:none;
      font-size: 15px;
    }

    .sendBtn{
      height:44px;
      min-width: 54px;
      border-radius: 16px;
      border:none;
      background: var(--sendBtnBg);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
    }
    .sendBtn:active{transform:scale(.98)}
    .sendBtn svg{
      width:20px; height:20px;
      fill:none;
      stroke:#ffffff;
      stroke-width:2.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size:12px; color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      .title{font-size:13px}
      .iconBtn{width:36px; height:36px}
      main{padding:10px; padding-bottom: 96px;}
      .bubble{font-size:16px}
      #input{
        flex: 1 1 auto;
        max-width: none;
        height:46px;
        line-height:46px;
      }
      .sendBtn{
        height:46px;
        min-width: 56px;
      }
      .pickerPalette{ grid-template-columns: repeat(6, 1fr); }
      .hexInput{ width: 120px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="title">
        BK Translator <span id="verTag" class="ver">v1.40</span>
      </div>

      <button id="settingsToggleBtn" class="iconBtn" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <button id="downloadBtn" class="iconBtn" type="button" aria-label="번역 기록 다운로드">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zm7-18v12l4-4 1.4 1.4L12 16.8l-5.4-5.4L8 10l4 4V2z"/></svg>
      </button>

      <div style="flex:1"></div>

      <!-- ✅ 연결 TEST: 와이파이 아이콘 -->
      <button id="topTestBtn" class="iconBtn" type="button" aria-label="연결 테스트">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 18.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path>
          <path d="M2.3 9.9a14 14 0 0 1 19.4 0l-1.4 1.4a12 12 0 0 0-16.6 0L2.3 9.9z"></path>
          <path d="M5.8 13.4a9 9 0 0 1 12.4 0l-1.4 1.4a7 7 0 0 0-9.6 0l-1.4-1.4z"></path>
          <path d="M9.3 16.9a4 4 0 0 1 5.4 0l-1.4 1.4a2 2 0 0 0-2.6 0l-1.4-1.4z"></path>
        </svg>
      </button>

      <button id="topClearBtn" class="iconBtn" type="button" aria-label="Clear(대화 삭제)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
      </button>

      <!-- ✅ 연결 상태: 원형 색상만 -->
      <button id="connBtn" class="statusOnly" type="button" aria-label="연결 상태"></button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">

      <section id="settingsPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          OpenRouter 설정 · 프롬프트 · 폰트 · 테마(색상)
        </div>

        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." autocomplete="off" />

        <div class="row">
          <div style="flex:1 1 240px;">
            <label for="model">모델</label>
            <input id="model" type="text" value="google/gemini-2.0-flash" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="temperature">temperature</label>
            <input id="temperature" type="text" value="0.2" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="top_p">top_p</label>
            <input id="top_p" type="text" value="1" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="text" value="800" />
          </div>
        </div>

        <label for="systemPrompt">프롬프트(시스템/규칙)</label>
        <textarea id="systemPrompt" placeholder="여기에 본인 프롬프트를 붙여넣으세요."></textarea>

        <div class="row" style="align-items:center; margin-top:10px;">
          <label style="margin:0; display:flex; align-items:center; gap:10px; color:var(--text);">
            <input id="autoCopy" type="checkbox" style="width:18px; height:18px; accent-color: var(--blue);" />
            번역 완료 시 자동 복사(Chrome 모바일)
          </label>
        </div>

        <label>폰트(폰에서 업로드)</label>
        <div class="row" style="align-items:center;">
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff2" />
          <button id="clearFontBtn" class="btn secondary" type="button">폰트 초기화</button>
          <button id="saveBtn" class="btn" type="button">저장</button>
        </div>
        <div class="hint">현재 폰트: <span id="fontStatus">기본(레포 woff2 우선)</span></div>

        <!-- ✅ 테마(색상) 설정: 모바일 호환(팔레트+HEX) -->
        <label style="margin-top:14px;">색상 테마</label>
        <div class="hint">일부 모바일에서 색상선택이 안 되는 문제 방지(팔레트 + HEX 입력)</div>

        <div class="colorGrid">
          <div class="colorItem">
            <span>전체 배경색</span>
            <div class="colorCtl">
              <button id="sw_bg" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_bg" class="hexInput" type="text" maxlength="12" placeholder="#050505" />
            </div>
          </div>

          <div class="colorItem">
            <span>채팅방 배경색</span>
            <div class="colorCtl">
              <button id="sw_chatBg" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_chatBg" class="hexInput" type="text" maxlength="12" placeholder="#0e1420" />
            </div>
          </div>

          <div class="colorItem">
            <span>입력 말풍선색</span>
            <div class="colorCtl">
              <button id="sw_userBubble" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_userBubble" class="hexInput" type="text" maxlength="12" placeholder="#2e3440" />
            </div>
          </div>

          <div class="colorItem">
            <span>출력 말풍선색</span>
            <div class="colorCtl">
              <button id="sw_assistBubble" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_assistBubble" class="hexInput" type="text" maxlength="12" placeholder="transparent" />
            </div>
          </div>

          <div class="colorItem">
            <span>입력창색</span>
            <div class="colorCtl">
              <button id="sw_input" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_input" class="hexInput" type="text" maxlength="12" placeholder="#2e3440" />
            </div>
          </div>

          <div class="colorItem">
            <span>전송 버튼색</span>
            <div class="colorCtl">
              <button id="sw_sendBtn" class="swatchBtn" type="button" aria-label="색상 선택"></button>
              <input id="c_sendBtn" class="hexInput" type="text" maxlength="12" placeholder="#1d4ed8" />
            </div>
          </div>

          <div class="row" style="margin-top:6px;">
            <button id="themeResetBtn" class="btn secondary" type="button">테마 초기화</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panelHead">
          <div class="left">
            <div class="h">Chat</div>
            <div class="s">입력 후 전송하면 번역 결과가 아래에 표시됩니다.</div>
          </div>
        </div>
        <div id="chat" class="chat"></div>
        <div id="bottomAnchor" style="height:1px;"></div>
      </section>

    </div>
  </main>

  <div class="composer">
    <div class="composerInner">
      <button id="sendBtnL" class="sendBtn" type="button" aria-label="전송(좌)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>

      <input id="input" type="text" placeholder="" autocomplete="off" />

      <button id="sendBtnR" class="sendBtn" type="button" aria-label="전송(우)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>
    </div>
  </div>

  <div id="copyBar" class="copyBar hidden" role="button" aria-label="복사 바">
    <div class="copyBarText">번역 완료 · 탭하면 복사</div>
    <button id="copyBarBtn" class="copyBarBtn" type="button">복사</button>
  </div>

  <div id="toast" class="toast"></div>

  <!-- ✅ 모바일 호환 색상선택 오버레이 -->
  <div id="pickerOverlay" class="pickerOverlay hidden" role="dialog" aria-modal="true">
    <div class="pickerCard">
      <div class="pickerTitle">색상 선택</div>
      <div id="pickerPalette" class="pickerPalette"></div>

      <div class="pickerRow">
        <input id="pickerHex" class="hexInput" type="text" maxlength="12" placeholder="#RRGGBB 또는 transparent" />
        <button id="pickerApplyBtn" class="btn" type="button">적용</button>
        <button id="pickerCloseBtn" class="btn secondary" type="button">닫기</button>
      </div>

      <div class="hint" style="margin-top:8px;">HEX 예: #1d4ed8 / 투명: transparent</div>
    </div>
  </div>

  <script>
    /**********************
     * Version (v1.xx)
     **********************/
    const BUILD_ID = "2026-01-26-01"; // 코드 수정 시 여기만 변경(자동 버전 증가 트리거)
    const LS_VER = "bk_tr_version";
    const LS_BUILD = "bk_tr_build";
    function clamp2(n){ return Math.round(n * 100) / 100; }
    function fmtVer(n){
      const v = clamp2(n);
      // 소수점 두 자리까지만
      return v.toFixed(2);
    }
    function bumpVersionIfNeeded(){

        localStorage.setItem(LS_BUILD, BUILD_ID);
      }
      return ver;
