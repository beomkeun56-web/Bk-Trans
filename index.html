<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Trans</title>

  <link rel="icon" href="data:," />

  <!-- API 호스트 사전 연결: 첫 요청 지연(TLS 핸드셰이크) 단축 -->
  <link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://api.anthropic.com" crossorigin />
  <link rel="preconnect" href="https://openrouter.ai" crossorigin />
  <link rel="dns-prefetch" href="https://generativelanguage.googleapis.com" />
  <link rel="dns-prefetch" href="https://api.anthropic.com" />
  <link rel="dns-prefetch" href="https://openrouter.ai" />

  <!-- 병음(pinyin) 표시용: 중국어 글자 위에 발음을 ruby로 렌더 -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3/dist/index.js" defer></script>

  <style>
    :root{
      --bg:#050505;
      --panel1:#0b0f14;
      --panel2:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;

      --menuScale: 1;
      --chatScale: 1;

      --headerSpacing: 10px;
      --chatSpacing: 16px;
      --inputSpacing: 4px;
      --maxWidth: 860px;

      /* 상단바 커스터마이징 */
      --topbarHeight: 64px;
      --topbarHPadding: 14px;
      --headerHPadding: 16px;

      --chatBg: #0e1420;
      --inputBg: #2e3440;
      --userBubbleBg: #2e3440;
      --assistantBubbleBg: #1e2430;
      --sendBtnBg: #2d6bff;
      --headerBg: #0b0f14;
      --copyBtnBg: #1a1f2a;

      /* 입력창 커스터마이징 */
      --inputMinHeight: 72px;
      --inputMaxHeight: 240px;
      --inputMaxWidth: 860px;
      --composerPadding: 10px;
      --chatBottomPadding: 4px;
      --composerBlur: 12px;
      --keyboardSpacing: 8px;
      --chatTopBlur: 4px;
      --chatTopFadeHeight: 24px;
    }

    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", "Noto Sans KR", system-ui, -apple-system, Segoe UI, Roboto, Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    header{
      position:sticky; top:0; z-index:30;
      padding: 0 var(--headerHPadding) 0;
      padding-top: calc(var(--headerSpacing) + env(safe-area-inset-top));
      background: var(--bg);
    }
    .headerInner{
      background: var(--headerBg);
      border-radius: 16px;
      border: none;
      padding: 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.3);
      position:relative;
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:6px;
      height: var(--topbarHeight);
      padding: 0 var(--topbarHPadding);
    }
    .title{
      font-weight:800;
      letter-spacing:.3px;
      font-size: calc(14px * var(--textScale));
      display:flex;
      align-items:center;
      gap:6px;
      white-space:nowrap;
      min-width:0;
      overflow:hidden;
    }
    .ver{
      font-size: calc(10px * var(--textScale));
      font-weight:600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255,255,255,.06);
      color: rgba(230,237,243,.7);
      cursor:pointer;
      user-select:none;
      flex-shrink:0;
      letter-spacing:.3px;
    }
    #modelTag{
      padding: 5px 12px;
      border-radius: 8px;
      background: var(--sendBtnBg);
      color: #ffffff;
      font-size: calc(16px * var(--textScale));
      font-weight:700;
      display:inline-block;
      vertical-align:middle;
      letter-spacing:.2px;
      white-space:normal;
      word-break:keep-all;
      line-height:1.3;
      cursor:pointer;
      transition: background .15s, transform .15s;
    }
    #modelTag:hover{filter: brightness(1.15)}
    #modelTag:active{transform:scale(.97)}

    .modelDropdown{
      display:none;
      position:absolute;
      top:100%;
      left:10px;
      margin-top:6px;
      min-width:240px;
      max-width:320px;
      background: var(--panel2);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      padding:6px;
      z-index:50;
      max-height:60vh;
      overflow-y:auto;
    }
    .modelDropdown.show{display:block}
    .modelDropdownItem{
      display:block;
      width:100%;
      padding:10px 12px;
      border:none;
      background:transparent;
      color:var(--text);
      font-size:calc(13px * var(--textScale));
      font-family:inherit;
      text-align:left;
      border-radius:10px;
      cursor:pointer;
      transition:background .12s;
    }
    .modelDropdownItem:hover{background:rgba(255,255,255,.08)}
    .modelDropdownItem:active{transform:scale(.98)}
    .modelDropdownItem.active{background:rgba(45,107,255,.2); color:#ffffff;}
    .modelDropdownItem .mdName{font-weight:700}
    .modelDropdownItem .mdId{font-size:calc(11px * var(--textScale)); color:var(--muted); margin-top:2px}

    .menuDropdownWrap{position:relative; display:inline-block;}
    .menuDropdown{
      display:none;
      position:absolute;
      top:100%;
      right:0;
      margin-top:6px;
      min-width:200px;
      background: var(--panel2);
      border:1px solid rgba(255,255,255,.08);
      border-radius:14px;
      box-shadow: 0 12px 36px rgba(0,0,0,.55);
      padding:6px;
      z-index:50;
    }
    .menuDropdown.show{display:block}
    .menuDropdownItem{
      display:flex;
      align-items:center;
      gap:10px;
      width:100%;
      padding:10px 12px;
      border:none;
      background:transparent;
      color:var(--text);
      font-size:calc(13px * var(--textScale));
      font-family:inherit;
      text-align:left;
      border-radius:10px;
      cursor:pointer;
      transition:background .12s;
    }
    .menuDropdownItem:hover{background:rgba(255,255,255,.08)}
    .menuDropdownItem:active{transform:scale(.98)}
    .menuDropdownItem svg{width:18px; height:18px; flex:0 0 18px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; color:var(--muted);}
    .menuDropdownItem.danger{color:var(--danger, #ff6b6b);}
    .menuDropdownItem.danger svg{color:var(--danger, #ff6b6b);}

    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:10px;
      border:none;
      background: transparent;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      padding:0;
      flex: 0 0 36px;
      transition: background .15s, color .15s;
    }
    .iconBtn.newActive{
      opacity:1 !important;
      color:#4af;
      font-weight:700;
    }
    .iconBtn:hover{background:rgba(255,255,255,.06); color:rgba(230,237,243,.9)}
    .iconBtn:active{transform:scale(.93)}
    .iconBtn svg{width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}

    .rightBtns{
      display:flex;
      align-items:center;
      gap:2px;
    }

    .statusBtn{
      width:36px; height:36px;
      border-radius:10px;
      border:none;
      background:transparent;
      cursor:pointer;
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 36px;
      transition: background .15s;
    }
    .statusBtn:hover{background:rgba(255,255,255,.06)}
    .statusBtn:active{transform:scale(.93)}
    .statusCircle{
      width:10px; height:10px;
      border-radius:999px;
      background: var(--warn);
      box-shadow: 0 0 6px rgba(247,201,72,.4);
      transition: background .3s, box-shadow .3s;
    }

    main{
      flex:1;
      overflow:hidden;
      padding-top: var(--headerSpacing);
      padding-left: var(--chatSpacing);
      padding-right: var(--chatSpacing);
      padding-bottom: 100px;
      display:flex;
      flex-direction:column;
    }
    .wrap{
      max-width: var(--maxWidth);
      margin:0 auto;
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      width:100%;
    }

    .panel{
      background: var(--chatBg);
      border: none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      flex:1;
      display:flex;
      flex-direction:column;
      min-height:0;
      position:relative;
    }
    .chatTopFade{
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: var(--chatTopFadeHeight);
      background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
      backdrop-filter: blur(var(--chatTopBlur));
      -webkit-backdrop-filter: blur(var(--chatTopBlur));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 10;
      border-radius: var(--radius) var(--radius) 0 0;
    }
    .chatTopFade.visible{
      opacity: 1;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size: calc(13px * var(--textScale))}
    .panelHead .s{font-size: calc(12px * var(--textScale)); color:var(--muted); line-height:1.35}

    .settingsOverlay{
      display:none;
      position:fixed; top:0; left:0; right:0; bottom:0;
      z-index:100;
      background: rgba(0,0,0,.75);
      align-items:center; justify-content:center;
      padding: 20px;
    }
    .settingsOverlay.show{
      display:flex;
    }
    .settings{
      width:100%; max-width:580px;
      max-height: calc(100vh - 40px);
      overflow-y:auto;
      padding: 16px 16px 20px;
      background: rgba(10,14,20,.97);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,.7);
      position:relative;
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    /* 모바일/터치: 키보드가 입력칸을 가리지 않도록 모달을 상단 정렬 */
    @media (hover: none) and (pointer: coarse){
      .settingsOverlay{ align-items:flex-start; }
    }
    label{font-size: calc(12px * var(--textScale)); color:var(--muted); display:block; margin:10px 0 6px}
    input, textarea, select, button{
      font-family: inherit;
    }
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size: calc(14px * var(--textScale));
    }
    .colorTextInput{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: calc(11px * var(--textScale));
      font-family: 'Courier New', monospace;
      text-transform: none;
      flex:1;
      min-width:0;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size: calc(12px * var(--textScale)); color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size: calc(13px * var(--textScale));
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}

    .colorItem{
      min-width:0;
    }
    .colorItem input[type="color"]{
      width:100%; height:36px; padding:0; border:none;
      border-radius:10px; background:rgba(0,0,0,.35); cursor:pointer;
    }
    .colorSwatches{
      display:flex; gap:5px; flex-wrap:wrap; margin-top:6px;
    }
    .cSwatch{
      width:24px; height:24px; border-radius:7px; border:1.5px solid rgba(255,255,255,.08);
      padding:0; cursor:pointer; transition: transform .1s, border-color .15s;
    }
    .cSwatch:hover{border-color:rgba(255,255,255,.3)}
    .cSwatch:active{transform:scale(.9)}
    .presetGrid{
      display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;
    }
    .presetBtn{
      border:none; border-radius:12px; padding:10px 0;
      cursor:pointer; background:rgba(255,255,255,.04);
      color:var(--text); font-size:calc(12px * var(--textScale));
      display:flex; flex-direction:column; align-items:center; gap:6px;
      transition: background .15s;
    }
    .presetBtn:hover{background:rgba(255,255,255,.08)}
    .presetBtn:active{transform:scale(.97)}
    .presetDot{
      width:20px; height:20px; border-radius:999px;
      box-shadow: 0 0 0 2px rgba(255,255,255,.08);
    }

    .chat{
      padding: 14px;
      padding-bottom: var(--chatBottomPadding);
      display:flex;
      flex-direction:column;
      gap: 16px;
      flex:1;
      overflow-y:auto;
      min-height:0;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: calc(15px * var(--chatScale));
    }

    .msg.user .bubble{
      background: var(--userBubbleBg);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    .msg.assistant .bubble{
      background: var(--assistantBubbleBg);
      color: rgba(230,237,243,.92);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-left-radius: 10px;
      max-width: 92%;
    }

    /* 병음·한글발음 표시: 한자는 인라인 baseline 유지, 병음/한글은 absolute로 위에 띄움
       → 숫자·기호가 한자에 맞춰 정렬되고, 글자 가로폭도 한자 크기 그대로 */
    .bubble:has(.py), .focusText:has(.py) { line-height: 1.8; }
    .py {
      position: relative;
      display: inline-block;
      vertical-align: baseline;
    }
    .py > .pt {  /* 병음(한자 바로 위) */
      position: absolute;
      bottom: calc(100% + 1px);
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.55em;
      color: rgba(180,180,180,.75);
      font-weight: 400;
      user-select: none;
      letter-spacing: 0;
      line-height: 1;
      white-space: nowrap;
      pointer-events: none;
    }
    .py > .pt::selection { background: transparent; }

    .focusOverlay{
      display:none; position:fixed; top:0; left:0; width:100%; height:100%;
      background:rgba(0,0,0,.95); z-index:9999;
      justify-content:center; align-items:center;
      padding:24px; box-sizing:border-box; cursor:pointer;
    }
    .focusOverlay.active{display:flex}
    .focusOverlay .focusText{
      color:#fff; font-size:28px; line-height:1.7;
      text-align:center; white-space:pre-wrap; word-break:break-word;
      max-width:90%; max-height:90vh; overflow-y:auto;
      user-select:text; -webkit-user-select:text;
    }

    .actionsRow{
      display:flex; gap:6px; align-items:center;
    }
    .actionsRow button{
      min-width: 48px;
      text-align:center;
      justify-content:center;
    }
    .retryPill{
      border:none;
      background: rgba(220,80,60,.7);
      border-radius: 10px;
      padding: 5px 12px;
      cursor:pointer;
      color: #fff;
      font-size: calc(12px * var(--textScale));
      font-family:inherit;
      font-weight:600;
      letter-spacing:.3px;
      transition: background .15s;
    }
    .retryPill:hover{background: rgba(220,80,60,.9)}

    .copyPill{
      border:none;
      background: var(--copyBtnBg);
      border-radius: 10px;
      padding: 4px 10px;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      font-size: calc(11px * var(--textScale));
      font-family:inherit;
      font-weight:600;
      letter-spacing:.3px;
      transition: background .15s, color .15s;
    }
    .copyPill:hover{background:rgba(255,255,255,.14); color:rgba(230,237,243,.9)}
    .copyPill:active{transform:scale(.95)}
    .ttsBtn{
      border:none;
      background: var(--copyBtnBg);
      border-radius: 10px;
      padding: 4px 10px;
      cursor:pointer;
      color: rgba(230,237,243,.6);
      font-size: calc(11px * var(--textScale));
      font-family:inherit;
      font-weight:600;
      display:inline-flex;
      align-items:center;
      gap:3px;
      transition: background .15s, color .15s;
    }
    .ttsBtn:hover{background:rgba(255,255,255,.14); color:rgba(230,237,243,.9)}
    .ttsBtn:active{transform:scale(.95)}
    .ttsBtn.speaking{color:#4af; background:rgba(45,107,255,.2)}

    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 0 var(--composerPadding) calc(var(--keyboardSpacing) + env(safe-area-inset-bottom));
      background: transparent;
      pointer-events:none;
      transition: background 0.3s, backdrop-filter 0.3s;
    }
    .composer.keyboard-visible{
      background: rgba(5,5,5,0.75);
      backdrop-filter: blur(var(--composerBlur));
      -webkit-backdrop-filter: blur(var(--composerBlur));
    }
    .composerFade{
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      height: 24px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .composer:focus-within .composerFade{
      opacity: 1;
    }
    .composerInner{
      position: relative;
    }
    .composerInner{
      max-width: var(--inputMaxWidth);
      margin:0 auto;
      background: var(--inputBg);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 18px;
      box-shadow: 0 4px 16px rgba(0,0,0,.3);
      display:flex;
      flex-direction:column;
      position:relative;
      pointer-events:auto;
    }

    #input{
      width:100%;
      min-height: var(--inputMinHeight);
      max-height: var(--inputMaxHeight);
      padding: 20px 16px;
      border-radius: 18px;
      border:none;
      background: transparent;
      color: #ffffff;
      outline:none;
      font-size: calc(15px * var(--chatScale));
      font-family:inherit;
      line-height:1.5;
      resize:none;
      overflow-y:auto;
    }


    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: calc(12px * var(--textScale));
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size: calc(12px * var(--textScale)); color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
      font-size: calc(13px * var(--textScale));
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      header{padding: 0; padding-top: env(safe-area-inset-top);}
      .headerInner{border-radius:0; padding:0;}
      .topbar{gap:4px; padding: 0 10px;}
      .title{font-size: calc(12px * var(--textScale)); gap:4px}
      .ver{font-size: calc(9px * var(--textScale)); padding:2px 6px}
      .topbar{height:56px}
      #modelTag{font-size: calc(14px * var(--textScale))}
      .modelDropdown{left:6px; min-width:220px; max-width:280px}
      .iconBtn{width:32px; height:32px; flex:0 0 32px}
      .iconBtn svg{width:18px; height:18px}
      .statusBtn{width:32px; height:32px; flex:0 0 32px}
      .rightBtns{gap:0}

    function prettifyModelName(modelId){
      const raw = String(modelId || '').trim();
      if(!raw) return 'Model';
      const found = MODEL_OPTIONS.concat(GOOGLE_MODEL_OPTIONS, ANTHROPIC_MODEL_OPTIONS).find(m => m.id === raw);
      if(found) return found.name;
      const short = raw.split('/').pop() || raw;
      const cleaned = short.replace(/[_]+/g,'-').replace(/-+/g,'-');
      return cleaned.split('-').filter(Boolean).map(t => {
        if(/^\d+(\.\d+)?$/.test(t)) return t;
        return t.charAt(0).toUpperCase() + t.slice(1);
      }).filter(word => word.toLowerCase() !== 'preview').join(' ');
    }

    function getCurrentModelId(){
      return (((el.model && el.model.value) || '') || localStorage.getItem(modelLsKey()) || '').trim();

          await navigator.clipboard.writeText(t);
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      try{
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      if(!silent) toast('복사 실패(보안 정책)');
      return false;
    }

    function hasChinese(s){
      return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(String(s || ''));
    }
    function hasKorean(s){
      return /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(String(s || ''));
    }
    function countCharsByType(s){
      const str = String(s || '');
      const ko = (str.match(/[\uAC00-\uD7AF]/g) || []).length;
      const zh = (str.match(/[\u4E00-\u9FFF\u3400-\u4DBF]/g) || []).length;
      const en = (str.match(/[a-zA-Z]/g) || []).length;
      return { ko, zh, en, total: str.replace(/\s/g, '').length };
    }
    function detectDominantLang(s){
      const c = countCharsByType(s);
      if(c.ko === 0 && c.zh === 0) return 'en';
      return c.ko >= c.zh ? 'ko' : 'zh';
    }
    function isEnglishLongText(s){
      const str = String(s || '');
      const c = countCharsByType(str);
      if(c.ko + c.zh === 0 && c.en >= 40) return true;
      const cjk = c.ko + c.zh;
      if(cjk > 0 && c.en >= 40 && cjk / (cjk + c.en) < 0.15) return true;
      return false;
    }

    const DB_NAME = 'bk_tr_test_db_test';
    const DB_STORE = 'kv';
    let _fontBlobUrl = null;

    function openDB(){
      return new Promise((resolve, reject) => {
        if(!('indexedDB' in window)) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const os = tx.objectStore(DB_STORE);
        const r = os.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    async function idbSet(key, val){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function applyFontRecord(rec){
      if(_fontBlobUrl){
        try{ URL.revokeObjectURL(_fontBlobUrl); } catch {}
        _fontBlobUrl = null;
      }
      const styleId = 'customFontStyle';
      let st = document.getElementById(styleId);
      if(!st){
        st = document.createElement('style');
        st.id = styleId;
        document.head.appendChild(st);
      }

      if(!rec){
        st.textContent = '';
        document.documentElement.style.setProperty('--fontMain', 'system-ui');
        el.fontStatus.textContent = '기본(레포 woff2 우선)';
        return;
      }

      const blob = new Blob([rec.data], {type: rec.type || 'font/ttf'});
      _fontBlobUrl = URL.createObjectURL(blob);

      const format = (rec.type && rec.type.includes('woff2')) ? 'woff2' : 'truetype';
      st.textContent =
        '@font-face{' +
          'font-family:"BKCustom";' +
          'src:url("' + _fontBlobUrl + '") format("' + format + '");' +
          'font-display:swap;' +
        '}';

      document.documentElement.style.setProperty('--fontMain', '"BKCustom"');
      el.fontStatus.textContent = rec.name || 'BKCustom';
    }

    function trimChatToMaxInputs(){
      while(countUserInputs(chat) > MAX_INPUTS_PER_PAGE){
        if(chat.length === 0) break;
        if(chat[0] && chat[0].role === 'user'){
          chat.shift();
          if(chat[0] && chat[0].role === 'assistant') chat.shift();
        } else {
          chat.shift();
        }
      }
      while(chat.length > MAX_MESSAGES){
        chat.shift();
      }

    function normalizeNewlines(s){
      return String(s).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    }

    function countMeaningfulLines(s){
      const norm = normalizeNewlines(s);
      const trimmed = norm.replace(/\n+$/g, '');
      if(trimmed.length === 0) return 1;
      return trimmed.split('\n').length;
    }

    function stripTranslationPrefix(s){
      return String(s).replace(/^\s*(?:번역|译文|翻译|译|Translation)\s*[:：]\s*/i, '');
    }

    function stripSurroundingQuotes(s){
      const str = String(s).trim();
      const pairs = [['"','"'],['\'','\''],['“','”'],['‘','’'],['「','」'],['『','』']];
      for(const [a,b] of pairs){
        if(str.startsWith(a) && str.endsWith(b) && str.length >= 2){
          const inner = str.slice(a.length, str.length - b.length);
          if(!inner.includes(a) && !inner.includes(b)) return inner;
        }
      }
      return str;
    }

    function normalizeChinesePunctuation(s){
      if(!hasChinese(s)) return s;
      return String(s)
        .replace(/([\u4E00-\u9FFF]) ?, ?/g, '$1，')
        .replace(/([\u4E00-\u9FFF]) ?\. ?(?=[\u4E00-\u9FFF]|$)/g, '$1。')
        .replace(/([\u4E00-\u9FFF]) ?\? ?/g, '$1？')
        .replace(/([\u4E00-\u9FFF]) ?! ?/g, '$1！')
        .replace(/([\u4E00-\u9FFF]) ?: ?/g, '$1：')
        .replace(/([\u4E00-\u9FFF]) ?; ?/g, '$1；');
    }

    function normalizeOutput(src, out){
      const srcLineCount = countMeaningfulLines(src);
      let norm = normalizeNewlines(out).trimEnd();
      if(norm.length === 0) return '';

      norm = norm.split('\n').map(l => stripTranslationPrefix(l)).join('\n');
      norm = stripSurroundingQuotes(norm);
      norm = normalizeChinesePunctuation(norm);

      const lines = norm.split('\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const uniq = [...new Set(nonEmpty.map(l => l.trim()))];
      if(srcLineCount === 1 && uniq.length === 1 && nonEmpty.length > 1){
        return uniq[0];
      }
      return norm;
    }

    function validateNumber(x, min, max, name){
      const v = Number(x);
      if(!Number.isFinite(v)) throw new Error(name + ' 값이 숫자가 아닙니다.');
      if(v < min || v > max) throw new Error(name + ' 범위 오류(' + min + '~' + max + ')');
      return v;
    }

    const DEFAULT_API_URL = 'https://openrouter.ai/api/v1/chat/completions';
    const GOOGLE_API_URL = 'https://generativelanguage.googleapis.com/v1beta/openai/chat/completions';

    function getProvider(){
      return (el.apiProvider && el.apiProvider.value) || localStorage.getItem(LS.apiProvider) || 'openrouter';
    }
    function isGoogleProvider(){ return getProvider() === 'google'; }
    function isAnthropicProvider(){ return getProvider() === 'anthropic'; }
    function getActiveApiKey(){
      const p = getProvider();
      if(p === 'google') return ((el.googleApiKey && el.googleApiKey.value) || '').trim();
      if(p === 'anthropic') return ((el.anthropicApiKey && el.anthropicApiKey.value) || '').trim();

    function toRequestModelId(id){

    // 프롬프트 관련 키를 제공자별로 분리 (openrouter는 기존 키 그대로 = 하위호환)
    function provKey(base, prov){
      prov = prov || getProvider();
      return prov === 'openrouter' ? base : base + '_' + prov;
    }
    function sysLsKey(prov){ return provKey(LS.system, prov); }
    function enhancedLsKey(prov){ return provKey(LS.enhancedPrompt, prov); }
    function useEnhancedLsKey(prov){ return provKey(LS.useEnhanced, prov); }
    function tempLsKey(prov){ return provKey(LS.temp, prov); }

    function getApiUrl(){
      const p = getProvider();
      if(p === 'google') return GOOGLE_API_URL;

    // 제공자별 요청(헤더/본문) 생성 — Anthropic은 OpenAI 형식이 아님
    function buildChatRequest(opts){
      const p = getProvider();
      const key = getActiveApiKey();
      const url = getApiUrl();
      if(p === 'anthropic'){
        let systemText = '';
        const convo = [];
        (opts.messages || []).forEach(function(m){
          if(m.role === 'system') systemText += (systemText ? '\n' : '') + m.content;
          else convo.push({ role: m.role, content: m.content });
        });
        const body = {
          model: opts.model,
          max_tokens: opts.maxTokens,
          messages: convo,
          stream: !!opts.stream
        };
        // Anthropic은 temperature 최대 1.0 (top_p/top_k는 보내지 않음)
        if(typeof opts.temperature === 'number') body.temperature = Math.min(opts.temperature, 1);
        if(systemText) body.system = systemText;
        return {
          url: url,
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': key,
            'anthropic-version': '2023-06-01',
            'anthropic-dangerous-direct-browser-access': 'true'
          },
          body: body
        };
      }
      const body = {
        model: opts.model,
        messages: opts.messages,
        temperature: opts.temperature,
        top_p: opts.topP,
        stream: !!opts.stream,
        max_tokens: opts.maxTokens
      };
      if(p === 'openrouter' && typeof opts.topK === 'number') body.top_k = opts.topK;
      if(opts.stream) body.stream_options = { include_usage: true }; // 토큰 사용량 수신
      return {
        url: url,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key },
        body: body
      };
    }

    // 스트리밍 청크에서 토큰 사용량 추출 (Anthropic / OpenAI 형식 모두 처리)
    function captureUsage(j){
      if(j.usage && (j.usage.prompt_tokens != null || j.usage.completion_tokens != null)){
        var det = j.usage.completion_tokens_details;
        _lastUsage = {
          in: j.usage.prompt_tokens,
          out: j.usage.completion_tokens,
          think: (det && det.reasoning_tokens != null) ? det.reasoning_tokens : undefined
        };
        return;
      }
      if(j.type === 'message_start' && j.message && j.message.usage){
        _lastUsage = _lastUsage || {};
        if(j.message.usage.input_tokens != null) _lastUsage.in = j.message.usage.input_tokens;
        if(j.message.usage.output_tokens != null) _lastUsage.out = j.message.usage.output_tokens;
      }
      if(j.type === 'message_delta' && j.usage){
        _lastUsage = _lastUsage || {};
        if(j.usage.output_tokens != null) _lastUsage.out = j.usage.output_tokens;
        if(j.usage.input_tokens != null) _lastUsage.in = j.usage.input_tokens;
      }
    }

    // 스트리밍 청크에서 텍스트 추출 (Anthropic / OpenAI 형식 모두 처리)
    function parseChatDelta(j){
      if(isAnthropicProvider()){
        if(j.type === 'content_block_delta' && j.delta && typeof j.delta.text === 'string') return j.delta.text;
        return '';
      }
      const c = j.choices && j.choices[0];
      if(!c) return '';
      if(c.delta && c.delta.content) return c.delta.content;
      if(c.message && c.message.content) return c.message.content;
      return '';
    }
    // 비스트리밍 단일 JSON 응답에서 본문 추출
    function parseChatFull(j){
      if(isAnthropicProvider()){
        if(Array.isArray(j.content)) return j.content.map(function(c){ return c && c.text ? c.text : ''; }).join('');
        return '';
      }
      const m = j.choices && j.choices[0] && j.choices[0].message;
      return (m && m.content) ? m.content : '';
    }

    let _currentAbort = null;
    let _lastApiCallAt = 0;
    let _effortOverride = undefined; // 재번역 시 일시적 effort 지정 ('' = 기본/thinking 최대, 'low' 등)
    let _lastUsage = null; // 직전 응답의 토큰 사용량
    let _lastEffort = ''; // 직전 요청에 적용된 effort (low/medium/high), 없으면 ''
    let _showTokens = localStorage.getItem(LS.showTokens) === '1';

    function abortCurrentRequest(){
      if(_currentAbort){ _currentAbort.abort(); _currentAbort = null; }
    }

    function buildContextMessages(userText){
      let sys = el.systemPrompt.value || defaultSystemPrompt();
      if(_useEnhancedPrompt){
        const enhanced = localStorage.getItem(enhancedLsKey());
        if(enhanced) sys = enhanced;
      }
      return [
        { role: 'system', content: sys },
        { role: 'user', content: userText }
      ];
    }

    async function callOpenRouterStreamOnce(userText, onChunk, timeoutMs){
      const google = isGoogleProvider();
      const anthropic = isAnthropicProvider();
      const provName = anthropic ? 'Anthropic ' : google ? 'Google ' : 'OpenRouter ';
      const apiKey = getActiveApiKey();
      if(!apiKey) throw new Error(provName + 'API Key가 비어 있습니다.');

      const model = toRequestModelId(el.model.value.trim());
      if(!model) throw new Error('모델이 비어 있습니다.');

      const isPing = userText === 'ping';
      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const topP = validateNumber(el.topP.value.trim(), 0, 1, 'top_p');
      const topK = Math.floor(validateNumber(el.topK.value.trim(), 1, 200, 'top_k'));
      const maxTokensRaw = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 32000, 'max_tokens'));
      const dynMax = isPing ? 16 : maxTokensRaw;

      const messages = isPing
        ? [{ role: 'user', content: 'ping' }]
        : buildContextMessages(userText);

      const req = buildChatRequest({
        model: model,
        messages: messages,
        temperature: temperature,
        topP: topP,
        topK: topK,
        maxTokens: dynMax,
        stream: true
      });
      _lastEffort = '';
      if(!google && !anthropic){
        var _mopt = MODEL_OPTIONS.find(function(m){ return m.id === el.model.value.trim(); });
        if(_mopt && _mopt.effort){
          req.body.reasoning = { effort: _mopt.effort };
          _lastEffort = _mopt.effort;
        }
      }
      // Gemini: 모델 effort가 지정되면 thinking 수준 조절 (예: low → 사고 시간 단축 = 빠름)
      if(google){
        var _gmopt = GOOGLE_MODEL_OPTIONS.find(function(m){ return m.id === el.model.value.trim(); });
        var _eff = (_effortOverride !== undefined) ? _effortOverride : (_gmopt && _gmopt.effort);
        if(_eff){ req.body.reasoning_effort = _eff; _lastEffort = _eff; }
      }

      // 연속 요청 차단: 직전 API 호출과 최소 간격(MIN_REQUEST_GAP_MS) 보장
      const _gap = CONFIG.MIN_REQUEST_GAP_MS - (Date.now() - _lastApiCallAt);
      if(_gap > 0) await new Promise(r => setTimeout(r, _gap));
      _lastApiCallAt = Date.now();

      const ac = new AbortController();
      _currentAbort = ac;
      const timeout = setTimeout(() => ac.abort('timeout'), timeoutMs);

      let res;
      try{
        res = await fetch(req.url, {
          method: 'POST',
          headers: req.headers,
          body: JSON.stringify(req.body),
          signal: ac.signal
        });
      } finally {
        clearTimeout(timeout);
      }

      if(!res.ok){
        const text = await res.text();
        let msg = text;
        try { msg = JSON.parse(text).error.message; } catch{}
        if(res.status === 403){
          msg += '\n(VPN 연결 확인 / 브라우저 데이터절약 모드 OFF 필요)';
        }
        const err = new Error('HTTP ' + res.status + ': ' + msg);
        err.status = res.status;
        throw err;
      }

      let full = '';
      _lastUsage = null;

      if(res.body && res.body.getReader){
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        while(true){
          const { done, value } = await reader.read();
          if(done) break;
          buf += decoder.decode(value, { stream: true });
          const lines = buf.split('\n');
          buf = lines.pop() || '';
          for(const line of lines){
            const trimmed = line.trim();
            if(!trimmed || !trimmed.startsWith('data:')) continue;
            const data = trimmed.slice(5).trim();
            if(data === '[DONE]') break;
            try{
              const j = JSON.parse(data);
              captureUsage(j);
              const piece = parseChatDelta(j);
              if(piece){
                full += piece;
                const visible = stripThinkingTags(full);
                if(visible) onChunk(visible);
              }
            } catch{}
          }
        }
      } else {
        const text = await res.text();
        const lines = text.split('\n');
        for(const line of lines){
          const trimmed = line.trim();
          if(!trimmed || !trimmed.startsWith('data:')) continue;
          const data = trimmed.slice(5).trim();
          if(data === '[DONE]') continue;
          try{
            const j = JSON.parse(data);
            captureUsage(j);
            full += parseChatDelta(j);
          } catch{}
        }
        onChunk(stripThinkingTags(full));
      }
      return stripThinkingTags(full);
    }

    function stripThinkingTags(s){
      return s.replace(/<think>[\s\S]*?<\/think>/g, '').trim();
    }

    async function callOpenRouterStream(userText, onChunk){
      const timeoutMs = CONFIG.REQUEST_TIMEOUT_MS;
      try{
        return await callOpenRouterStreamOnce(userText, onChunk, timeoutMs);
      } catch(err){
        const status = err && err.status;
        const retriable = !status || status === 408 || status === 429 || (status >= 500 && status < 600);
        const isAbort = err && (err.name === 'AbortError' || String(err.message || '').includes('abort'));
        if(!retriable || isAbort) throw err;
        await new Promise(r => setTimeout(r, 400));
        return await callOpenRouterStreamOnce(userText, onChunk, timeoutMs);
      }
    }

    async function callOpenRouter(userText){
      return callOpenRouterStream(userText, () => {});
    }

    var _ttsBusy = false;
    var _ttsBtn = null;
    var _ttsAudio = null;
    var _ttsChunks = [];
    var _ttsChunkIdx = 0;
    var _ttsCancelled = false;

    function splitTts(text, max){
      if(text.length <= max) return [text];
      var chunks = [], rest = text;
      while(rest.length > 0){
        if(rest.length <= max){ chunks.push(rest); break; }
        var i = rest.lastIndexOf('。', max);
        if(i < max*0.3) i = rest.lastIndexOf('.', max);
        if(i < max*0.3) i = rest.lastIndexOf('?', max);
        if(i < max*0.3) i = rest.lastIndexOf('!', max);
        if(i < max*0.3) i = rest.lastIndexOf(',', max);
        if(i < max*0.3) i = rest.lastIndexOf('，', max);
        if(i < max*0.3) i = rest.lastIndexOf(' ', max);
        if(i < max*0.3) i = max;
        chunks.push(rest.substring(0, i+1).trim());
        rest = rest.substring(i+1).trim();
      }
      return chunks.filter(function(c){ return c.length > 0; });
    }

    function stopTts(){
      _ttsBusy = false;
      _ttsCancelled = true;
      _ttsChunks = [];
      _ttsChunkIdx = 0;
      if(_ttsAudio){
        try{ _ttsAudio.pause(); }catch(e){}
        _ttsAudio = null;
      }
      if('speechSynthesis' in window) speechSynthesis.cancel();
      document.querySelectorAll('.ttsBtn.speaking').forEach(function(b){ b.classList.remove('speaking'); });
    }

    function ttsFinish(){
      _ttsBusy = false;
      _ttsChunks = [];
      if(_ttsBtn) _ttsBtn.classList.remove('speaking');
    }

    function speakText(text, btn){
      if(_ttsBusy){ stopTts(); if(_ttsBtn === btn) return; }
      _ttsBusy = true; _ttsCancelled = false; _ttsBtn = btn;
      if(btn) btn.classList.add('speaking');
      var lang = detectDominantLang(text);
      var voice = lang === 'zh' ? 'cmn-Hant-TW' : lang === 'ko' ? 'ko-KR' : 'en-US';
      _ttsChunks = splitTts(text, 200);
      _ttsChunkIdx = 0;
      playSotChunk(voice);
    }
    function playSotChunk(voice){
      if(_ttsCancelled || !_ttsBusy || _ttsChunkIdx >= _ttsChunks.length){ ttsFinish(); return; }
      var chunk = _ttsChunks[_ttsChunkIdx++];
      fetch('https://api.soundoftext.com/sounds', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({engine:'Google', data:{text:chunk, voice:voice}})
      }).then(function(r){ return r.json(); }).then(function(d){
        if(!d.success){ throw new Error('create fail'); }
        var sid = d.id;
        var poll = function(tries){
          if(_ttsCancelled || !_ttsBusy){ ttsFinish(); return; }
          fetch('https://api.soundoftext.com/sounds/' + sid).then(function(r){ return r.json(); }).then(function(s){
            if(s.status === 'Done' && s.location){
              var a = new Audio(s.location);
              a.playbackRate = 1.3;
              _ttsAudio = a;
              a.onended = function(){ playSotChunk(voice); };
              a.onerror = function(){ playSotChunk(voice); };
              setTimeout(function(){
                if(_ttsCancelled || !_ttsBusy){ ttsFinish(); return; }
                a.play().catch(function(){ playSotChunk(voice); });
              }, 300);
            } else if(tries < 10){
              setTimeout(function(){ poll(tries+1); }, 1000);
            } else { ttsFinish(); showToast('TTS 시간초과'); }
          }).catch(function(){ ttsFinish(); showToast('TTS 실패'); });
        };
        poll(0);
      }).catch(function(err){
        console.warn('SoundOfText error:', err);
        ttsFinish(); showToast('TTS 실패');
      });
    }

    function effLabel(e){

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
      });
    }
    var CJK_RE = /[㐀-䶿一-鿿豈-﫿]/;
    // 핀인 → 한글 발음 변환 (한어병음 한글 표기 근사)
    var _INIT_ORDER = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s'];
    var _INIT_JAMO = {'zh':'ㅈ','ch':'ㅊ','sh':'ㅅ','b':'ㅂ','p':'ㅍ','m':'ㅁ','f':'ㅍ','d':'ㄷ','t':'ㅌ','n':'ㄴ','l':'ㄹ','g':'ㄱ','k':'ㅋ','h':'ㅎ','j':'ㅈ','q':'ㅊ','x':'ㅅ','r':'ㄹ','z':'ㅉ','c':'ㅊ','s':'ㅅ'};
    var _FIN_HAN = {
      'a':'아','o':'오','e':'어','i':'이','u':'우','ü':'위',
      'ai':'아이','ei':'에이','ao':'아오','ou':'어우',
      'an':'안','en':'언','ang':'앙','eng':'엉','ong':'옹','er':'얼',
      'ia':'야','ie':'예','iao':'야오','iu':'유','iou':'유',
      'ian':'옌','in':'인','iang':'양','ing':'잉','iong':'융',
      'ua':'와','uo':'워','uai':'와이','ui':'웨이','uei':'웨이',
      'uan':'완','un':'운','uen':'운','uang':'왕','ueng':'웡',
      'üe':'위에','üan':'위안','ün':'윈'
    };
    var _CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
    function _composeHangul(initJamo, finStr){
      if(!initJamo) return finStr;
      var ci = _CHO.indexOf(initJamo);
      if(ci < 0) return finStr;
      var code = finStr.charCodeAt(0);
      if(code < 0xAC00 || code > 0xD7A3) return initJamo + finStr;
      var offset = code - 0xAC00;
      var jong = offset % 28;
      var jung = Math.floor(offset / 28) % 21;
      return String.fromCharCode(0xAC00 + (ci * 21 + jung) * 28 + jong) + finStr.slice(1);
    }
    function pinyinToHangul(py){
      if(!py) return '';
      try{
        var p = String(py).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/v/g, 'ü');
        var init = '', rest = p;
        for(var i = 0; i < _INIT_ORDER.length; i++){
          var k = _INIT_ORDER[i];
          if(p.startsWith(k)){ init = _INIT_JAMO[k]; rest = p.slice(k.length); break; }
        }
        if(p.startsWith('y')){
          rest = p.slice(1);
          if(rest === 'i' || rest === 'in' || rest === 'ing'){ /* unchanged */ }
          else if(rest === 'u' || rest === 'un' || rest === 'uan' || rest.startsWith('ue')) rest = 'ü' + rest.slice(1);
          else rest = 'i' + rest;
          init = '';
        } else if(p.startsWith('w')){
          rest = p.slice(1);
          if(rest !== 'u') rest = 'u' + rest;
          init = '';
        }
        var fin = _FIN_HAN[rest] || rest;
        return _composeHangul(init, fin);
      } catch(e){ return ''; }
    }

    // 중국어 텍스트 → 한자 + 위에 병음 + 그 위에 한글발음 HTML
    function renderWithPinyin(text){
      if(!hasChinese(text) || typeof window.pinyinPro === 'undefined'){
        return escapeHtml(text);
      }
      try{
        var cjk = (text.match(new RegExp(CJK_RE.source, 'g')) || []).join('');
        var pyArr = window.pinyinPro.pinyin(cjk, { type: 'array' }) || [];
        var out = '';
        var pi = 0;
        for(var i = 0; i < text.length; i++){
          var ch = text[i];
          if(CJK_RE.test(ch)){
            var py = pyArr[pi++] || '';
            out += '<span class="py"><span class="pt">' + escapeHtml(py) + '</span>' + escapeHtml(ch) + '</span>';
          } else {
            out += escapeHtml(ch);
          }
        }
        return out;
      } catch(e){
        return escapeHtml(text);
      }
    }
    // 버블 안 텍스트를 복사할 때 병음(rt)은 제외하고 한자만 복사
    document.addEventListener('copy', function(e){
      try{
        var sel = window.getSelection();
        if(!sel || sel.rangeCount === 0) return;
        var range = sel.getRangeAt(0);
        var anchor = range.commonAncestorContainer;
        if(anchor.nodeType === 3) anchor = anchor.parentNode;
        if(!anchor || !anchor.closest || !anchor.closest('.bubble')) return;
        var temp = document.createElement('div');
        temp.appendChild(range.cloneContents());
        temp.querySelectorAll('rt, .ann, .pt, .pk').forEach(function(rt){ rt.remove(); });
        var clean = temp.textContent;
        if(e.clipboardData){
          e.clipboardData.setData('text/plain', clean);
          e.preventDefault();
        }
      } catch(_){}
    });

    function extractPromptVersion(){
      var sys = el.systemPrompt ? (el.systemPrompt.value || '') : '';

      }
      var m = sys.match(/\bv\d+(?:\.\d+)?[a-z]*/i);
      return m ? m[0] : '';
    }

          editBtn.className = 'copyPill';
          editBtn.type = 'button';
          editBtn.textContent = 'Edit';
          editBtn.addEventListener('click', () => { el.input.value = m.text; autoResizeInput(); el.input.focus(); });

    async function send(){
      if(_isBusy){ abortCurrentRequest(); return; }

      const userText = el.input.value.trim();
      if(!userText) return;

      hideCopyBar();

      chat.push({ role:'user', text:userText, ts:Date.now() });
      renderChat();

      el.input.value = '';
      autoResizeInput();
      if(document.activeElement === el.input) el.input.blur();
      setConnState('busy');

      const streamRow = document.createElement('div');
      streamRow.className = 'msg assistant';
      const streamBubble = document.createElement('div');
      streamBubble.className = 'bubble';
      streamBubble.textContent = '번역 중...';
      streamBubble.style.opacity = '0.5';
      streamRow.appendChild(streamBubble);
      el.chat.insertBefore(streamRow, el.bottomAnchor);

      let _scrollRaf = 0;
      function scrollThrottled(){
        if(_scrollRaf) return;
        _scrollRaf = requestAnimationFrame(() => {
          _scrollRaf = 0;
          el.chat.scrollTop = el.chat.scrollHeight;
        });
      }
      scrollThrottled();

      const _t0 = Date.now();
      try{
        const translatedRaw = await callOpenRouterStream(userText, (partial) => {
          streamBubble.style.opacity = '1';
          streamBubble.textContent = partial;
          scrollThrottled();
        });
        const translated = normalizeOutput(userText, translatedRaw);
        const _ms = Date.now() - _t0;
        const _modelName = prettifyModelName(getCurrentModelId());
        const _promptVer = extractPromptVersion();

        chat.push({ role:'assistant', text: translated, ts: Date.now(), model: _modelName, usage: _lastUsage, ms: _ms, effort: _lastEffort, promptVer: _promptVer });
        trimChatToMaxInputs();
        saveChatHistory();

        if(hasChinese(translated)){
          streamBubble.innerHTML = renderWithPinyin(translated);
        } else {
          streamBubble.textContent = translated;
        }
        streamBubble.style.opacity = '1';
        streamBubble.style.cursor = 'pointer';
        streamBubble.addEventListener('click', () => showFocusOverlay(translated));

        const actions = document.createElement('div');
        actions.className = 'actionsRow';
        actions.appendChild(createTtsBtn(translated));
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copyPill';
        copyBtn.type = 'button';
        copyBtn.textContent = 'Copy';
        copyBtn.addEventListener('click', async () => { await copyToClipboard(translated, false); });
        actions.appendChild(copyBtn);
        const editBtn = document.createElement('button');
        editBtn.className = 'copyPill';
        editBtn.type = 'button';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => { el.input.value = translated; autoResizeInput(); el.input.focus(); });
        actions.appendChild(editBtn);
        appendUsageLine(actions, _lastUsage, _ms, _modelName, _lastEffort, _promptVer);
        streamRow.appendChild(actions);

        scrollThrottled();

        if(el.autoCopy.checked && hasChinese(translated)){
          const ok = await copyToClipboard(translated, true);
          if(ok){
            toast('중국어 자동 복사 완료');
            updateLastClipboard(translated);
          } else {
            showCopyBar(translated);
            toast('자동 복사 제한 → 아래 바 탭');
          }
        } else {
          hideCopyBar();
        }

        setConnState('ok');
      } catch(err){
        const msg = (err && err.message) ? err.message : String(err);
        const isAbort = (err && err.name === 'AbortError');
        if(streamRow.parentNode) streamRow.remove();

        if(isAbort){
          toast('번역 취소됨');
          chat.pop();
        } else {
          chat.push({ role:'assistant', text: '오류: ' + msg, ts: Date.now(), model: prettifyModelName(getCurrentModelId()) });
          trimChatToMaxInputs();
          toast('요청 실패: ' + msg);
        }
        saveChatHistory();
        renderChat();
        setConnState(isAbort ? 'warn' : 'err');
      } finally {
        _currentAbort = null;
      }
    }

    function exportChat(){
      if(chat.length === 0){ toast('저장할 대화가 없습니다'); return; }
      let text = '';
      for(const m of chat){
        if(m.role === 'user'){
          text += '[원문] ' + m.text + '\n';
        } else {
          const modelStr = m.model ? ' (' + m.model + ')' : '';
          text += '[번역]' + modelStr + ' ' + m.text + '\n';
        }

    function shuffleArray(arr){
      const a = arr.slice();
      for(let i = a.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function enhanceQuality(){
      const pairs = [];
      for(let i = 0; i < chat.length - 1; i++){
        if(chat[i].role === 'user' && chat[i+1] && chat[i+1].role === 'assistant' && !chat[i+1].text.startsWith('오류:')){
          pairs.push({ src: chat[i].text, tgt: chat[i+1].text });
        }
      }
      if(pairs.length < 3){ toast('품질점검을 먼저 실행하세요 (최소 3쌍 필요)'); return; }
      if(!confirm('Opus 4.7로 번역 품질을 분석하고 프롬프트를 보강합니다.\nAPI 호출 1회 발생합니다.')) return;

      toast('품질 분석 중...');

      const samplePairs = shuffleArray(pairs).slice(0, 10);
      let pairText = '';
      samplePairs.forEach((p, i) => {
        pairText += (i+1) + '. 원문: ' + p.src + '\n   번역: ' + p.tgt + '\n';
      });

      const currentPrompt = el.systemPrompt.value || defaultSystemPrompt();
      const analyzePrompt = '당신은 한국어↔중국어 번역 품질 전문가입니다.\n\n' +
        '현재 시스템 프롬프트:\n' + currentPrompt + '\n\n' +
        '아래 번역 결과를 분석하세요:\n' + pairText + '\n' +
        '작업:\n' +
        '1. 오역, 누락, 어색한 표현, 톤 불일치를 찾으세요\n' +
        '2. 현재 프롬프트에 추가할 보완 규칙을 생성하세요\n\n' +
        '출력 형식: 보완 규칙만 3줄 이내로 출력. 기존 프롬프트 내용 반복 금지. 설명 금지. 규칙만 출력.\n' +
        '예시: "구어체는 구어체로, 경어는 경어로 톤 유지."';

      const apiKey = getActiveApiKey();
      if(!apiKey){ toast('API Key가 필요합니다'); return; }
      let analyzeModel;
      if(isGoogleProvider()) analyzeModel = toRequestModelId(el.model.value.trim() || 'gemini-3-flash-preview');
      else if(isAnthropicProvider()) analyzeModel = toRequestModelId(el.model.value.trim() || 'claude-opus-4-7');
      else analyzeModel = 'anthropic/claude-opus-4.7';

      try{
        const req = buildChatRequest({
          model: analyzeModel,
          messages: [{ role: 'user', content: analyzePrompt }],
          temperature: 0.1,
          maxTokens: 512,
          stream: false
        });
        const res = await fetch(req.url, {
          method: 'POST',
          headers: req.headers,
          body: JSON.stringify(req.body)
        });
        if(!res.ok){
          const t = await res.text();
          let msg = t; try{ msg = JSON.parse(t).error.message; }catch{}
          toast('분석 실패: ' + msg); return;
        }
        const json = await res.json();
        const rules = (parseChatFull(json) || '').trim();
        if(!rules){ toast('보완 규칙 생성 실패'); return; }

        const enhanced = currentPrompt + '\n' + rules;

    function importPrompt(file){
      const reader = new FileReader();
      reader.onload = function(e){
        const text = String(e.target.result || '');
        const baseMark = '=== 기본 프롬프트 ===';
        const enhMark = '=== 수정 프롬프트 ===';
        const baseIdx = text.indexOf(baseMark);
        const enhIdx = text.indexOf(enhMark);

        let basePrompt = '', enhPrompt = '';
        if(baseIdx !== -1){
          // 앱 내보내기 형식
          if(enhIdx !== -1){
            basePrompt = text.substring(baseIdx + baseMark.length, enhIdx).trim();
            enhPrompt = text.substring(enhIdx + enhMark.length).trim();
          } else {
            basePrompt = text.substring(baseIdx + baseMark.length).trim();
          }
        } else {
          // 마커 없는 일반 txt → 전체를 기본 프롬프트로
          basePrompt = text.trim();
        }
        if(!basePrompt){ toast('빈 파일입니다'); return; }

        // 현재 선택된 제공자에만 적용 (제공자별 분리)
        el.systemPrompt.value = basePrompt;
        localStorage.setItem(sysLsKey(), basePrompt);
        if(enhPrompt){
          localStorage.setItem(enhancedLsKey(), enhPrompt);
          _useEnhancedPrompt = true;
          localStorage.setItem(useEnhancedLsKey(), 'true');
        }
        updateNewToggleUI();
        const provLabel = isGoogleProvider() ? 'Google' : isAnthropicProvider() ? 'Anthropic' : 'OpenRouter';
        toast(provLabel + ' 프롬프트 가져오기 완료' + (enhPrompt ? ' (수정 프롬프트 적용)' : ''));
      };
      reader.readAsText(file);
    }

    let _autoSending = false;

    async function checkClipboard(){
      try{
        if(_isBusy || _autoSending) return;
        if(!navigator.clipboard || !navigator.clipboard.readText) return;
        if(!document.hasFocus || !document.hasFocus()) return;

        const clipText = await navigator.clipboard.readText();
        const trimmed = String(clipText || '').trim();
        if(!trimmed) return;

        if(_lastClipboardText === trimmed) return;
        if(!hasKorean(trimmed) && !hasChinese(trimmed)) return;
        if(isEnglishLongText(trimmed)) return;

        if(trimmed.length >= CONFIG.AUTO_TRANSLATE_MAX_LEN){
          if(_lastLongTextWarn !== trimmed){
            _lastLongTextWarn = trimmed;
            toast('긴 텍스트(' + trimmed.length + '자) 자동 번역 생략 - 직접 입력하세요');
          }
          updateLastClipboard(trimmed);
          return;
        }

        updateLastClipboard(trimmed);
        if(isChatDuplicate(trimmed)) return;

        _autoSending = true;
        try{
          el.input.value = trimmed;
          await send();
        } finally {
          _autoSending = false;
        }
      } catch(err){
      }
    }

    }

    if(topExportPromptBtn) topExportPromptBtn.addEventListener('click', exportPrompt);

    var topTokenToggleBtn = document.getElementById('topTokenToggleBtn');
    function updateTokenToggleLabel(){
      if(!topTokenToggleBtn) return;

      if(span) span.textContent = '토큰수 확인: ' + (_showTokens ? '켜짐' : '꺼짐');

    if(el.topClearBtn) el.topClearBtn.addEventListener('click', clearChatOnly);

    const topMenuBtn = document.getElementById('topMenuBtn');
    const topMenuDropdown = document.getElementById('topMenuDropdown');
    function setTopMenuOpen(open){
      if(!topMenuDropdown || !topMenuBtn) return;
      if(open){ topMenuDropdown.classList.add('show'); topMenuBtn.setAttribute('aria-expanded','true'); }
      else { topMenuDropdown.classList.remove('show'); topMenuBtn.setAttribute('aria-expanded','false'); }

      topMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        setTopMenuOpen(!topMenuDropdown.classList.contains('show'));

    }
    if(topMenuDropdown){
      topMenuDropdown.addEventListener('click', (e) => {

      });
    }
    document.addEventListener('click', (e) => {
      if(!topMenuDropdown || !topMenuDropdown.classList.contains('show')) return;
      if(topMenuBtn && topMenuBtn.contains(e.target)) return;
      if(topMenuDropdown.contains(e.target)) return;
      setTopMenuOpen(false);
    });

    if(el.model) el.model.addEventListener('input', updateModelTag);


    function autoResizeInput(){
      if(!el.input) return;
      el.input.style.height = 'auto';
      el.input.style.height = Math.min(el.input.scrollHeight, 240) + 'px';

        setTimeout(updateMainPaddingBottom, 10);
      }
    }

    if(el.input){
      el.input.addEventListener('keydown', (e) => {
        if(e.key === 'Enter' && !e.shiftKey){
          e.preventDefault();
          send();
        }
        if(e.key === 'Escape'){
          el.input.value = '';
          autoResizeInput();
        }
      });

    }

    const inputBtnWrap = document.getElementById('inputBtnWrap');

    const inputClearBtn = document.getElementById('inputClearBtn');
    function updateInputCopyBtn(){
      if(!inputBtnWrap || !el.input) return;
      inputBtnWrap.style.display = el.input.value.trim() ? 'flex' : 'none';
    }
    if(inputCopyBtn){
      inputCopyBtn.addEventListener('click', async () => { await copyToClipboard(el.input.value.trim(), false); });
    }
    if(inputClearBtn){
      inputClearBtn.addEventListener('click', () => { el.input.value = ''; autoResizeInput(); updateInputCopyBtn(); el.input.focus(); });

    updateInputCopyBtn();

    if(el.copyBar) el.copyBar.addEventListener('click', async () => {
      if(!_pendingCopyText) return;

      if(ok) hideCopyBar();
    });
    if(el.copyBarBtn) el.copyBarBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();

    if(el.fontFile) el.fontFile.addEventListener('change', async (e) => {

    // Layout settings

    function setLayoutSettingsVisible(v){
      if(v) layoutSettingsOverlay.classList.add('show');

    if(appTitle) appTitle.addEventListener('click', toggleApiSettings);
    if(layoutToggleBtn) layoutToggleBtn.addEventListener('click', () => setLayoutSettingsVisible(true));

    const layoutSettingsCloseBtn = document.getElementById('layoutSettingsCloseBtn');
    const layoutSaveBtn = document.getElementById('layoutSaveBtn');
    const layoutCloseBtnBottom = document.getElementById('layoutCloseBtnBottom');

    if(layoutSettingsCloseBtn) layoutSettingsCloseBtn.addEventListener('click', () => setLayoutSettingsVisible(false));
    if(layoutSaveBtn) layoutSaveBtn.addEventListener('click', () => { setLayoutSettingsVisible(false); toast('레이아웃 설정 저장 완료'); });
    if(layoutCloseBtnBottom) layoutCloseBtnBottom.addEventListener('click', () => setLayoutSettingsVisible(false));
    if(layoutSettingsOverlay) layoutSettingsOverlay.addEventListener('click', (e) => {
      if(e.target === layoutSettingsOverlay) setLayoutSettingsVisible(false);
    });

    // Menu font scale
    const menuFontScale = document.getElementById('menuFontScale');
    const menuFontScaleVal = document.getElementById('menuFontScaleVal');
    const menuFontScaleResetBtn = document.getElementById('menuFontScaleResetBtn');

    function applyMenuFontScale(scale){
      let s = Number(scale);
      if(!Number.isFinite(s)) s = 1;
      s = Math.max(0.85, Math.min(1.5, s));
      document.documentElement.style.setProperty('--menuScale', String(s));
      if(menuFontScale) menuFontScale.value = String(s);
      if(menuFontScaleVal) menuFontScaleVal.textContent = Math.round(s * 100) + '%';
    }

    if(menuFontScale){
      menuFontScale.addEventListener('input', (e) => {
        const v = e.target.value;
        applyMenuFontScale(v);
        try{ localStorage.setItem('bk_tr_test_menuScale', String(v)); } catch {}
      });
    }
    if(menuFontScaleResetBtn){
      menuFontScaleResetBtn.addEventListener('click', () => {
        applyMenuFontScale(1);
        try{ localStorage.setItem('bk_tr_test_menuScale', '1'); } catch {}
      });
    }

    // Chat font scale
    const chatFontScale = document.getElementById('chatFontScale');
    const chatFontScaleVal = document.getElementById('chatFontScaleVal');
    const chatFontScaleResetBtn = document.getElementById('chatFontScaleResetBtn');

    function applyChatFontScale(scale){
      let s = Number(scale);
      if(!Number.isFinite(s)) s = 1;
      s = Math.max(0.85, Math.min(1.5, s));
      document.documentElement.style.setProperty('--chatScale', String(s));
      if(chatFontScale) chatFontScale.value = String(s);
      if(chatFontScaleVal) chatFontScaleVal.textContent = Math.round(s * 100) + '%';

    if(chatFontScale){
      chatFontScale.addEventListener('input', (e) => {
        const v = e.target.value;
        applyChatFontScale(v);
        try{ localStorage.setItem('bk_tr_test_chatScale', String(v)); } catch {}
      });
    }
    if(chatFontScaleResetBtn){
      chatFontScaleResetBtn.addEventListener('click', () => {
        applyChatFontScale(1);
        try{ localStorage.setItem('bk_tr_test_chatScale', '1'); } catch {}
      });
    }

    function updateMainPaddingBottom(){
      const composer = document.querySelector('.composer');
      if(!composer) return;
      const composerHeight = composer.offsetHeight;
      const mainEl = document.getElementById('main');
      if(mainEl){
        mainEl.style.paddingBottom = (composerHeight + 10) + 'px';
      }
    }

    function bindPxSlider(opts){
      const slider = document.getElementById(opts.sliderId);
      const valEl = document.getElementById(opts.valId);
      const resetBtn = document.getElementById(opts.resetId);
      const cssVar = opts.cssVar;
      const lsKey = opts.lsKey;
      const def = opts.defaultVal;
      const suffix = opts.suffix != null ? opts.suffix : 'px';
      const onApply = opts.onApply;
      const extraCssVars = opts.extraCssVars;

      function apply(v){
        const num = Number(v);
        const val = Number.isFinite(num) ? num : def;
        document.documentElement.style.setProperty(cssVar, val + suffix);
        if(extraCssVars) extraCssVars(val);
        if(slider) slider.value = val;
        if(valEl) valEl.textContent = val + suffix;
        if(onApply) onApply(val);
      }

      if(slider){
        slider.addEventListener('input', (e) => {
          const v = e.target.value;
          apply(v);
          try{ localStorage.setItem(lsKey, String(v)); } catch {}
        });
      }
      if(resetBtn){
        resetBtn.addEventListener('click', () => {
          apply(def);
          try{ localStorage.setItem(lsKey, String(def)); } catch {}
        });
      }
      return apply;
    }

    const applyTopbarHeight = bindPxSlider({sliderId:'topbarHeightSlider', valId:'topbarHeightVal', resetId:'topbarHeightResetBtn', cssVar:'--topbarHeight', lsKey:'bk_tr_topbarHeight', defaultVal:64});
    const applyTopbarHPadding = bindPxSlider({sliderId:'topbarHPaddingSlider', valId:'topbarHPaddingVal', resetId:'topbarHPaddingResetBtn', cssVar:'--topbarHPadding', lsKey:'bk_tr_topbarHPadding', defaultVal:14});
    const applyHeaderHPadding = bindPxSlider({sliderId:'headerHPaddingSlider', valId:'headerHPaddingVal', resetId:'headerHPaddingResetBtn', cssVar:'--headerHPadding', lsKey:'bk_tr_headerHPadding', defaultVal:16});
    const applyHeaderSpacing = bindPxSlider({sliderId:'headerSpacingSlider', valId:'headerSpacingVal', resetId:'headerSpacingResetBtn', cssVar:'--headerSpacing', lsKey:'bk_tr_test_headerSpacing', defaultVal:10});
    const applyChatSpacing = bindPxSlider({sliderId:'chatSpacingSlider', valId:'chatSpacingVal', resetId:'chatSpacingResetBtn', cssVar:'--chatSpacing', lsKey:'bk_tr_test_chatSpacing', defaultVal:16});
    const applyInputSpacing = bindPxSlider({sliderId:'inputSpacingSlider', valId:'inputSpacingVal', resetId:'inputSpacingResetBtn', cssVar:'--inputSpacing', lsKey:'bk_tr_test_inputSpacing', defaultVal:4});
    const applyMaxWidth = bindPxSlider({sliderId:'maxWidthSlider', valId:'maxWidthVal', resetId:'maxWidthResetBtn', cssVar:'--maxWidth', lsKey:'bk_tr_test_maxWidth', defaultVal:860});
    const applyInputMinHeight = bindPxSlider({sliderId:'inputMinHeightSlider', valId:'inputMinHeightVal', resetId:'inputMinHeightResetBtn', cssVar:'--inputMinHeight', lsKey:'bk_tr_inputMinHeight', defaultVal:72, onApply:() => setTimeout(updateMainPaddingBottom, 50)});
    const applyInputMaxHeight = bindPxSlider({sliderId:'inputMaxHeightSlider', valId:'inputMaxHeightVal', resetId:'inputMaxHeightResetBtn', cssVar:'--inputMaxHeight', lsKey:'bk_tr_inputMaxHeight', defaultVal:240});
    const applyInputMaxWidth = bindPxSlider({sliderId:'inputMaxWidthSlider', valId:'inputMaxWidthVal', resetId:'inputMaxWidthResetBtn', cssVar:'--inputMaxWidth', lsKey:'bk_tr_inputMaxWidth', defaultVal:860});
    const applyComposerPadding = bindPxSlider({sliderId:'composerHPaddingSlider', valId:'composerHPaddingVal', resetId:'composerHPaddingResetBtn', cssVar:'--composerPadding', lsKey:'bk_tr_composerPadding', defaultVal:10, onApply:() => setTimeout(updateMainPaddingBottom, 50)});
    const applyChatBottomPadding = bindPxSlider({sliderId:'chatBottomGapSlider', valId:'chatBottomGapVal', resetId:'chatBottomGapResetBtn', cssVar:'--chatBottomPadding', lsKey:'bk_tr_chatBottomPadding', defaultVal:4});
    const applyComposerBlur = bindPxSlider({sliderId:'composerBlurSlider', valId:'composerBlurVal', resetId:'composerBlurResetBtn', cssVar:'--composerBlur', lsKey:'bk_tr_composerBlur', defaultVal:12});
    const applyKeyboardSpacing = bindPxSlider({sliderId:'keyboardSpacingSlider', valId:'keyboardSpacingVal', resetId:'keyboardSpacingResetBtn', cssVar:'--keyboardSpacing', lsKey:'bk_tr_keyboardSpacing', defaultVal:8, onApply:() => setTimeout(updateMainPaddingBottom, 50)});
    const applyChatTopBlur = bindPxSlider({sliderId:'chatTopBlurSlider', valId:'chatTopBlurVal', resetId:'chatTopBlurResetBtn', cssVar:'--chatTopBlur', lsKey:'bk_tr_chatTopBlur', defaultVal:4, extraCssVars:(v) => document.documentElement.style.setProperty('--chatTopFadeHeight', Math.max(v * 3, 12) + 'px')});

    // Load layout settings
    function loadLayoutSettings(){
      const menuScale = localStorage.getItem('bk_tr_test_menuScale') || '1';
      const chatScale = localStorage.getItem('bk_tr_test_chatScale') || '1';
      const hSpacing = localStorage.getItem('bk_tr_test_headerSpacing') || '10';
      const cSpacing = localStorage.getItem('bk_tr_test_chatSpacing') || '16';
      const iSpacing = localStorage.getItem('bk_tr_test_inputSpacing') || '4';
      const mWidth = localStorage.getItem('bk_tr_test_maxWidth') || '860';

      const topbarH = localStorage.getItem('bk_tr_topbarHeight') || '64';
      const topbarHP = localStorage.getItem('bk_tr_topbarHPadding') || '14';
      const headerHP = localStorage.getItem('bk_tr_headerHPadding') || '16';

      const inputMinH = localStorage.getItem('bk_tr_inputMinHeight') || '72';
      const inputMaxH = localStorage.getItem('bk_tr_inputMaxHeight') || '240';
      const inputMaxW = localStorage.getItem('bk_tr_inputMaxWidth') || '860';
      const composerP = localStorage.getItem('bk_tr_composerPadding') || '10';
      const chatBP = localStorage.getItem('bk_tr_chatBottomPadding') || '4';
      const composerB = localStorage.getItem('bk_tr_composerBlur') || '12';
      const keyboardS = localStorage.getItem('bk_tr_keyboardSpacing') || '8';
      const chatTopB = localStorage.getItem('bk_tr_chatTopBlur') || '4';

      applyMenuFontScale(menuScale);
      applyChatFontScale(chatScale);
      applyTopbarHeight(topbarH);
      applyTopbarHPadding(topbarHP);
      applyHeaderHPadding(headerHP);
      applyHeaderSpacing(hSpacing);
      applyChatSpacing(cSpacing);
      applyInputSpacing(iSpacing);
      applyMaxWidth(mWidth);

      applyInputMinHeight(inputMinH);
      applyInputMaxHeight(inputMaxH);
      applyInputMaxWidth(inputMaxW);
      applyComposerPadding(composerP);
      applyChatBottomPadding(chatBP);
      applyComposerBlur(composerB);
      applyKeyboardSpacing(keyboardS);
      applyChatTopBlur(chatTopB);

      setTimeout(updateMainPaddingBottom, 100);
    }

    loadLayoutSettings();

    applyColorsFromStorage();
    bindColorPicker(el.colorBg, LS.colorBg, '--bg');
    bindColorPicker(el.colorChatBg, LS.colorChatBg, '--chatBg');
    bindColorPicker(el.colorInputBg, LS.colorInputBg, '--inputBg');
    bindColorPicker(el.colorUserBubbleBg, LS.colorUserBubbleBg, '--userBubbleBg');
    bindColorPicker(el.colorAssistantBubbleBg, LS.colorAssistantBubbleBg, '--assistantBubbleBg');
    bindColorPicker(el.colorSendBtnBg, LS.colorSendBtnBg, '--sendBtnBg');
    bindColorPicker(el.colorHeaderBg, LS.colorHeaderBg, '--headerBg');
    bindColorPicker(el.colorCopyBtnBg, LS.colorCopyBtnBg, '--copyBtnBg');

    initColorChips();

    function isValidHex(str){
      return /^#[0-9A-Fa-f]{6}$/.test(str);
    }

    function parseRgba(str){
      const match = str.match(/rgba?\s*\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*(?:,\s*([\d.]+))?\s*\)/i);
      if(!match) return null;
      const r = parseInt(match[1]);
      const g = parseInt(match[2]);
      const b = parseInt(match[3]);
      const a = match[4] !== undefined ? parseFloat(match[4]) : 1;
      if(r > 255 || g > 255 || b > 255 || a < 0 || a > 1) return null;
      return { r, g, b, a };
    }

    function rgbToHex(r, g, b){
      return '#' + [r, g, b].map(x => {
        const hex = x.toString(16);
        return hex.length === 1 ? '0' + hex : hex;
      }).join('');
    }

    function hexToRgba(hex, alpha){
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function syncColorTextInputs(){
      document.querySelectorAll('.colorTextInput').forEach(textInput => {
        const targetId = textInput.getAttribute('data-target');
        const colorPicker = document.getElementById(targetId);
        if(!colorPicker) return;

        const updateTextInput = () => {
          const hex = colorPicker.value;
          textInput.value = hex.toUpperCase();
        };

        updateTextInput();

        colorPicker.addEventListener('input', updateTextInput);

        textInput.addEventListener('input', (e) => {
          let val = e.target.value.trim();

          // Try parsing as hex
          if(!val.startsWith('#')) val = '#' + val;
          if(isValidHex(val)){
            colorPicker.value = val;
            colorPicker.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
      });
    }

    syncColorTextInputs();



    const composerEl = document.querySelector('.composer');
    function adjustForKeyboard(){
      if(!window.visualViewport) return;
      const vv = window.visualViewport;
      const bottomOffset = window.innerHeight - vv.height - vv.offsetTop;

      // 키보드가 올라왔을 때만 블러 효과 적용
      if(composerEl){
        composerEl.style.bottom = Math.max(0, bottomOffset) + 'px';
        if(bottomOffset > 50){
          composerEl.classList.add('keyboard-visible');
        } else {
          composerEl.classList.remove('keyboard-visible');
        }
      }

      if(el.main){
        el.main.style.paddingBottom = (Math.max(0, bottomOffset) + 82) + 'px';
      }
      scrollToBottom('instant');
    }
    if(el.input) el.input.addEventListener('focus', () => { adjustForKeyboard(); scrollToBottom('smooth'); });
    if(el.input) el.input.addEventListener('blur', () => {
      if(composerEl){
        composerEl.style.bottom = '0';
        composerEl.classList.remove('keyboard-visible');
      }
      if(el.main) el.main.style.paddingBottom = '';
      setTimeout(updateMainPaddingBottom, 10);
    });
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', adjustForKeyboard);
      window.visualViewport.addEventListener('scroll', adjustForKeyboard);
    }
    window.addEventListener('resize', () => setTimeout(updateMainPaddingBottom, 100));

    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      toast('권장: HTTPS에서 사용하세요(키 보안)');
    }
  </script>
