<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Translator</title>

  <!-- 404 favicon 방지 -->
  <link rel="icon" href="data:," />

  <style>
    :root{
      --bg:#050505;
      --panel1:#0b0f14;
      --panel2:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;
      --warn:#f7c948;
      --danger:#ff6b6b;

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;
    }

    /* GitHub Pages에 올린 woff2가 있으면 자동 적용 (업로드폰트가 있으면 그게 우선) */
    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* ===== Header ===== */
    header{
      position:sticky; top:0; z-index:30;
      padding: 10px 10px calc(10px + env(safe-area-inset-top));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:10px;
    }
    .title{
      font-weight:800;
      letter-spacing:.2px;
      font-size:14px;
      margin-right:4px;
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }
    .ver{
      font-size:12px;
      font-weight:800;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      color: rgba(230,237,243,.92);
    }

    /* 아이콘 버튼: 크기 통일 / 진한 검은색 / 테두리 없음 */
    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      border:none;
      background: #070707;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor:pointer;
      color: rgba(230,237,243,.88);
      padding:0;
      flex: 0 0 36px;
    }
    .iconBtn:active{transform:scale(.98)}
    .iconBtn svg{width:18px; height:18px; fill: currentColor}

    /* ✅ 우측 버튼 3개: 동일 크기/간격 고정 */
    .rightBtns{
      display:flex;
      align-items:center;
      gap:10px;          /* 필요시 8px로 조정 가능 */
    }

    /* ✅ 연결상태: 아이콘 없이 “원형 색상”만 표시 (버튼 박스는 36x36로 통일) */
    .statusBtn{
      width:36px; height:36px;
      border-radius:12px;
      border:none;
      background:#070707;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor:pointer;
      padding:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      flex: 0 0 36px;
    }
    .statusBtn:active{transform:scale(.98)}
    .statusCircle{
      width:14px; height:14px;
      border-radius:999px;
      background: var(--warn);
      box-shadow: 0 0 0 2px rgba(5,5,5,.95);
    }

    /* ===== Main ===== */
    main{
      flex:1;
      overflow:auto;
      padding: 10px;
      padding-bottom: 92px;
    }
    .wrap{
      max-width: 860px;
      margin:0 auto;
    }

    /* 카드/테두리 제거: 배경색으로만 구분 */
    .panel{
      background: linear-gradient(180deg, rgba(14,20,32,.92), rgba(8,12,18,.92));
      border:none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size:13px}
    .panelHead .s{font-size:12px; color:var(--muted); line-height:1.35}

    /* ===== Settings ===== */
    .settings{
      margin-bottom:10px;
      padding: 12px 14px 14px;
      background: rgba(10,14,20,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    label{font-size:12px; color:var(--muted); display:block; margin:10px 0 6px}
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size:14px;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size:12px; color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size:13px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}
    .btn.danger{background: rgba(255,107,107,.14)}

    /* ===== Chat ===== */
    .chat{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 16px;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
    }

    /* 입력 말풍선: 단색 진한 회색 */
    .msg.user .bubble{
      background: rgba(46, 52, 64, .92);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    /* 출력 말풍선: 배경 없음(투명) + 그림자 제거 */
    .msg.assistant .bubble{
      background: transparent;
      color: rgba(230,237,243,.92);
      box-shadow: none;
      padding: 0;
      border-radius: 0;
      max-width: 92%;
    }

    .actionsRow{
      display:flex; gap:8px; align-items:center;
      opacity:.9;
    }
    .miniIconBtn{
      width:32px; height:32px;
      border:none;
      background: rgba(255,255,255,.06);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      color: rgba(230,237,243,.9);
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }
    .miniIconBtn svg{width:18px; height:18px; fill: currentColor}

    /* ===== Composer ===== */
    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .composerInner{
      max-width: 860px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    #input{
      height:44px;
      line-height:44px;
      flex: 0 1 440px;
      min-width: 160px;
      max-width: 520px;
      padding: 0 12px;
      border-radius: 16px;
      border:none;

      background: #2e3440;
      color: #ffffff;

      outline:none;
      font-size: 15px;
    }

    .sendBtn{
      height:44px;
      min-width: 54px;
      border-radius: 16px;
      border:none;
      background: rgba(45,107,255,.18);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
    }
    .sendBtn:active{transform:scale(.98)}
    .sendBtn svg{
      width:20px; height:20px;
      fill:none;
      stroke:#ffffff;
      stroke-width:2.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* 토스트 */
    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    /* 복사 바 */
    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size:12px; color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      .title{font-size:13px}
      .iconBtn{width:36px; height:36px}
      .statusBtn{width:36px; height:36px}
      main{padding:10px; padding-bottom: 96px;}
      .bubble{font-size:16px}
      #input{
        flex: 1 1 auto;
        max-width: none;
        height:46px;
        line-height:46px;
      }
      .sendBtn{
        height:46px;
        min-width: 56px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="title">BK Translator <span class="ver" id="appVer">v1.21</span></div>

      <!-- 설정(메뉴) -->
      <button id="settingsToggleBtn" class="iconBtn" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <!-- 번역 기록 다운로드 -->
      <button id="downloadBtn" class="iconBtn" type="button" aria-label="번역 기록 다운로드">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zm7-18v12l4-4 1.4 1.4L12 16.8l-5.4-5.4L8 10l4 4V2z"/></svg>
      </button>

      <!-- 프롬프트 선택 버튼 -->
      <button id="promptSelectBtn" class="iconBtn" type="button" aria-label="프롬프트 선택">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
      </button>

      <div style="flex:1"></div>

      <!-- ✅ 우측 3버튼: 동일 크기/간격 -->
      <div class="rightBtns">
        <!-- 연결 TEST: 와이파이 아이콘 -->
        <button id="topTestBtn" class="iconBtn" type="button" aria-label="연결 테스트">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 18.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"></path>
            <path d="M2.3 9.9a14 14 0 0 1 19.4 0l-1.4 1.4a12 12 0 0 0-16.6 0L2.3 9.9z"></path>
            <path d="M5.8 13.4a9 9 0 0 1 12.4 0l-1.4 1.4a7 7 0 0 0-9.6 0l-1.4-1.4z"></path>
            <path d="M9.3 16.9a4 4 0 0 1 5.4 0l-1.4 1.4a2 2 0 0 0-2.6 0l-1.4-1.4z"></path>
          </svg>
        </button>

        <!-- Clear(대화 삭제): 휴지통 -->
        <button id="topClearBtn" class="iconBtn" type="button" aria-label="Clear(대화 삭제)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
        </button>

        <!-- 연결상태: 원형 색상만 -->
        <button id="connBtn" class="statusBtn" type="button" aria-label="연결 상태">
          <span id="statusCircle" class="statusCircle"></span>
        </button>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="wrap">

      <!-- 설정 패널 -->
      <section id="settingsPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          OpenRouter(Gemini) 설정 · 프롬프트 · 폰트(폰 업로드)
        </div>

        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." autocomplete="off" />

        <div class="row">
          <div style="flex:1 1 240px;">
            <label for="model">모델</label>
            <input id="model" type="text" value="google/gemini-2.0-flash" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="temperature">temperature</label>
            <input id="temperature" type="text" value="0.2" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="top_p">top_p</label>
            <input id="top_p" type="text" value="1" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="text" value="800" />
          </div>
        </div>

        <label for="systemPrompt">프롬프트(시스템/규칙)</label>
        <textarea id="systemPrompt" placeholder="여기에 본인 프롬프트를 붙여넣으세요."></textarea>

        <div class="row" style="align-items:center; margin-top:10px;">
          <label style="margin:0; display:flex; align-items:center; gap:10px; color:var(--text);">
            <input id="autoCopy" type="checkbox" style="width:18px; height:18px; accent-color: var(--blue);" />
            번역 완료 시 자동 복사(Chrome 모바일)
          </label>
        </div>

        <label>폰트(폰에서 업로드)</label>
        <div class="row" style="align-items:center;">
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff2" />
          <button id="clearFontBtn" class="btn secondary" type="button">폰트 초기화</button>
          <button id="saveBtn" class="btn" type="button">저장</button>
        </div>
        <div class="hint">현재 폰트: <span id="fontStatus">기본(레포 woff2 우선)</span></div>
      </section>

      <!-- 프롬프트 선택 패널(유지) -->
      <section id="promptSelectPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          번역에 사용할 프롬프트 선택
        </div>
        <div class="row" style="gap:10px; flex-wrap:wrap;">
          <label style="display:flex; align-items:center; gap:6px; color:var(--text);">
            <input type="radio" name="promptSelect" value="original" checked style="width:18px; height:18px; accent-color:var(--blue);" />
            기존 프롬프트
          </label>
          <label style="display:flex; align-items:center; gap:6px; color:var(--text);">
            <input type="radio" name="promptSelect" value="learned" style="width:18px; height:18px; accent-color:var(--blue);" />
            학습 프롬프트
          </label>
          <label style="display:flex; align-items:center; gap:6px; color:var(--text);">
            <input type="radio" name="promptSelect" value="merged" style="width:18px; height:18px; accent-color:var(--blue);" />
            프롬프트 합치기
          </label>
        </div>
        <div class="row" style="margin-top:10px;">
          <button id="applyPromptBtn" class="btn" type="button">선택 적용</button>
          <button id="mergeToOriginalBtn" class="btn secondary" type="button">학습→기존 복사</button>
        </div>
        <div id="promptSelectStatus" class="hint" style="margin-top:8px;">현재: 기존 프롬프트 사용 중</div>
      </section>

      <!-- 대화 -->
      <section class="panel">
        <div class="panelHead">
          <div class="left">
            <div class="h">Chat</div>
          </div>
        </div>
        <div id="chat" class="chat"></div>
        <div id="bottomAnchor" style="height:1px;"></div>
      </section>

    </div>
  </main>

  <!-- Composer -->
  <div class="composer">
    <div class="composerInner">
      <button id="sendBtnL" class="sendBtn" type="button" aria-label="전송(좌)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>

      <input id="input" type="text" placeholder="" autocomplete="off" />

      <button id="sendBtnR" class="sendBtn" type="button" aria-label="전송(우)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Copy bar -->
  <div id="copyBar" class="copyBar hidden" role="button" aria-label="복사 바">
    <div class="copyBarText">번역 완료 · 탭하면 복사</div>
    <button id="copyBarBtn" class="copyBarBtn" type="button">복사</button>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const APP_VERSION = 'v1.21';

    const LS = {
      apiKey: 'bk_tr_apiKey',
      model: 'bk_tr_model',
      temp: 'bk_tr_temp',
      top_p: 'bk_tr_top_p',
      maxTokens: 'bk_tr_maxTokens',
      system: 'bk_tr_systemPrompt',
      autoCopy: 'bk_tr_autoCopy',
      chat: 'bk_tr_chat',
      promptSelect: 'bk_tr_promptSelect'
    };

    const el = {
      main: document.getElementById('main'),
      appVer: document.getElementById('appVer'),

      settingsToggleBtn: document.getElementById('settingsToggleBtn'),
      settingsPanel: document.getElementById('settingsPanel'),
      downloadBtn: document.getElementById('downloadBtn'),

      topTestBtn: document.getElementById('topTestBtn'),
      topClearBtn: document.getElementById('topClearBtn'),
      connBtn: document.getElementById('connBtn'),
      statusCircle: document.getElementById('statusCircle'),

      apiKey: document.getElementById('apiKey'),
      model: document.getElementById('model'),
      temperature: document.getElementById('temperature'),
      top_p: document.getElementById('top_p'),
      maxTokens: document.getElementById('maxTokens'),
      systemPrompt: document.getElementById('systemPrompt'),
      autoCopy: document.getElementById('autoCopy'),
      saveBtn: document.getElementById('saveBtn'),

      chat: document.getElementById('chat'),
      bottomAnchor: document.getElementById('bottomAnchor'),

      input: document.getElementById('input'),
      sendBtnL: document.getElementById('sendBtnL'),
      sendBtnR: document.getElementById('sendBtnR'),

      copyBar: document.getElementById('copyBar'),
      copyBarBtn: document.getElementById('copyBarBtn'),
      toast: document.getElementById('toast'),

      fontFile: document.getElementById('fontFile'),
      clearFontBtn: document.getElementById('clearFontBtn'),
      fontStatus: document.getElementById('fontStatus'),

      promptSelectBtn: document.getElementById('promptSelectBtn'),
      promptSelectPanel: document.getElementById('promptSelectPanel'),
      applyPromptBtn: document.getElementById('applyPromptBtn'),
      mergeToOriginalBtn: document.getElementById('mergeToOriginalBtn'),
      promptSelectStatus: document.getElementById('promptSelectStatus'),
    };

    if(el.appVer) el.appVer.textContent = APP_VERSION;

    function toast(msg){
      el.toast.textContent = String(msg ?? '');
      el.toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.toast.classList.remove('show'), 2200);
    }

    function scrollToBottom(behavior){
      const b = behavior || 'smooth';
      try{
        el.bottomAnchor.scrollIntoView({behavior: (b === 'instant' ? 'auto' : b), block:'end'});
      } catch {}
      const scroller = el.main;
      const doScroll = () => {
        if(b === 'instant'){
          scroller.scrollTop = scroller.scrollHeight;
        } else {
          try{ scroller.scrollTo({ top: scroller.scrollHeight, behavior: b }); }
          catch { scroller.scrollTop = scroller.scrollHeight; }
        }
      };
      if(b === 'instant'){
        doScroll();
      } else {
        requestAnimationFrame(() => { doScroll(); requestAnimationFrame(doScroll); });
      }
    }

    async function copyToClipboard(text, silent){
      const t = String(text ?? '');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(t);
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      try{
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      if(!silent) toast('복사 실패(보안 정책)');
      return false;
    }

    let _pendingCopyText = '';
    function showCopyBar(text){
      _pendingCopyText = String(text ?? '');
      el.copyBar.classList.remove('hidden');
    }
    function hideCopyBar(){
      _pendingCopyText = '';
      el.copyBar.classList.add('hidden');
    }

    // 중국어(한자) 1글자라도 포함 여부
    function hasChinese(s){
      return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(String(s || ''));
    }
    // 한국어 포함 여부
    function hasKorean(s){
      return /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(String(s || ''));
    }
    // 영어 장문 여부 (40자 이상 영어만 있으면 장문으로 판단)
    function isEnglishLongText(s){
      const str = String(s || '');
      if(hasKorean(str) || hasChinese(str)) return false;
      const englishChars = str.match(/[a-zA-Z]/g);
      return englishChars && englishChars.length >= 40;
    }

    // ===== Font: IndexedDB =====
    const DB_NAME = 'bk_tr_db';
    const DB_STORE = 'kv';
    let _fontBlobUrl = null;

    function openDB(){
      return new Promise((resolve, reject) => {
        if(!('indexedDB' in window)) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const os = tx.objectStore(DB_STORE);
        const r = os.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    async function idbSet(key, val){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function applyFontRecord(rec){
      if(_fontBlobUrl){
        try{ URL.revokeObjectURL(_fontBlobUrl); } catch {}
        _fontBlobUrl = null;
      }
      const styleId = 'customFontStyle';
      let st = document.getElementById(styleId);
      if(!st){
        st = document.createElement('style');
        st.id = styleId;
        document.head.appendChild(st);
      }

      if(!rec){
        st.textContent = '';
        document.documentElement.style.setProperty('--fontMain', 'system-ui');
        el.fontStatus.textContent = '기본(레포 woff2 우선)';
        return;
      }

      const blob = new Blob([rec.data], {type: rec.type || 'font/ttf'});
      _fontBlobUrl = URL.createObjectURL(blob);

      const format = (rec.type && rec.type.includes('woff2')) ? 'woff2' : 'truetype';
      st.textContent =
        '@font-face{' +
          'font-family:"BKCustom";' +
          'src:url("' + _fontBlobUrl + '") format("' + format + '");' +
          'font-display:swap;' +
        '}';

      document.documentElement.style.setProperty('--fontMain', '"BKCustom"');
      el.fontStatus.textContent = rec.name || 'BKCustom';
    }

    async function loadCustomFont(){
      try{
        const rec = await idbGet('font');
        applyFontRecord(rec || null);
      } catch {
        applyFontRecord(null);
      }
    }

    async function saveCustomFontFile(file){
      if(!file) return;
      const buf = await file.arrayBuffer();
      const rec = {name: file.name, type: file.type, data: buf};
      await idbSet('font', rec);
      applyFontRecord(rec);
      toast('폰트 적용 완료');
    }

    async function clearCustomFont(){
      try{ await idbDel('font'); } catch {}
      applyFontRecord(null);
      toast('폰트 초기화 완료');
    }

    // ===== Chat =====
    let chat = [];

    function defaultSystemPrompt(){
      return [
        "You are a translation engine.",
        "Translate the user's input according to the rules below.",
        "- Output ONLY the translated text. No explanations.",
        "- If input starts with '#', remove it and translate Korean -> Simplified Chinese.",
        "- Otherwise translate Simplified Chinese -> Korean.",
        "- Keep line breaks as-is."
      ].join("\\n");
    }

    function loadSettings(){
      el.apiKey.value = localStorage.getItem(LS.apiKey) || '';
      el.model.value = localStorage.getItem(LS.model) || el.model.value;
      el.temperature.value = localStorage.getItem(LS.temp) || el.temperature.value;
      el.top_p.value = localStorage.getItem(LS.top_p) || el.top_p.value;
      el.maxTokens.value = localStorage.getItem(LS.maxTokens) || el.maxTokens.value;
      el.systemPrompt.value = localStorage.getItem(LS.system) || defaultSystemPrompt();
      el.autoCopy.checked = (localStorage.getItem(LS.autoCopy) || '0') === '1';

      const savedChat = localStorage.getItem(LS.chat);
      if(savedChat){
        try{ chat = JSON.parse(savedChat) || []; } catch { chat = []; }
      }
    }

    function saveSettings(){
      localStorage.setItem(LS.apiKey, el.apiKey.value.trim());
      localStorage.setItem(LS.model, el.model.value.trim());
      localStorage.setItem(LS.temp, el.temperature.value.trim());
      localStorage.setItem(LS.top_p, el.top_p.value.trim());
      localStorage.setItem(LS.maxTokens, el.maxTokens.value.trim());
      localStorage.setItem(LS.system, el.systemPrompt.value || defaultSystemPrompt());
      localStorage.setItem(LS.autoCopy, el.autoCopy.checked ? '1' : '0');
      toast('저장 완료');
      setSettingsVisible(false);
    }

    function saveChat(){
      localStorage.setItem(LS.chat, JSON.stringify(chat));
    }

    function setSettingsVisible(v){
      el.settingsPanel.classList.toggle('hidden', !v);
      if(v){
        requestAnimationFrame(() => el.settingsPanel.scrollIntoView({behavior:'smooth', block:'start'}));
      }
    }

    function toggleSettings(){
      const isHidden = el.settingsPanel.classList.contains('hidden');
      setSettingsVisible(isHidden);
    }

    let _isBusy = false;
    function setConnState(state){
      _isBusy = (state === 'busy');
      if(state === 'ok') el.statusCircle.style.background = 'var(--ok)';
      else if(state === 'busy') el.statusCircle.style.background = 'var(--warn)';
      else if(state === 'err') el.statusCircle.style.background = 'var(--danger)';
      else el.statusCircle.style.background = 'var(--warn)';
    }

    function normalizeNewlines(s){
      return String(s).replace(/\\r\\n/g, '\\n').replace(/\\r/g, '\\n');
    }

    function countMeaningfulLines(s){
      const norm = normalizeNewlines(s);
      const trimmed = norm.replace(/\\n+$/g, '');
      if(trimmed.length === 0) return 1;
      return trimmed.split('\\n').length;
    }

    function normalizeOutput(src, out){
      const srcLineCount = countMeaningfulLines(src);
      const norm = normalizeNewlines(out).trimEnd();
      if(norm.length === 0) return '';
      const lines = norm.split('\\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const uniq = [...new Set(nonEmpty.map(l => l.trim()))];
      if(srcLineCount === 1 && uniq.length === 1 && nonEmpty.length > 1){
        return uniq[0];
      }
      return norm;
    }

    function validateNumber(x, min, max, name){
      const v = Number(x);
      if(!Number.isFinite(v)) throw new Error(name + ' 값이 숫자가 아닙니다.');
      if(v < min || v > max) throw new Error(name + ' 범위 오류(' + min + '~' + max + ')');
      return v;
    }

    async function callOpenRouter(userText){
      const apiKey = el.apiKey.value.trim();
      if(!apiKey) throw new Error('API Key가 비어 있습니다.');

      const model = el.model.value.trim();
      if(!model) throw new Error('모델이 비어 있습니다.');

      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const top_p = validateNumber(el.top_p.value.trim(), 0, 1, 'top_p');
      const max_tokens = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 8000, 'max_tokens'));
      const systemPrompt = el.systemPrompt.value || defaultSystemPrompt();

      const payload = {
        model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userText }
        ],
        temperature,
        top_p,
        max_tokens
      };

      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey,
          'HTTP-Referer': location.origin,
          'X-Title': 'BK Translator (Personal)'
        },
        body: JSON.stringify(payload)
      });

      const text = await res.text();
      let json = null;
      try{ json = JSON.parse(text); } catch {}

      if(!res.ok){
        const msg = (json && (json.error?.message || json.message)) ? (json.error?.message || json.message) : text;
        throw new Error('HTTP ' + res.status + ': ' + String(msg).slice(0, 300));
      }

      const out = json && json.choices && json.choices[0] && json.choices[0].message && json.choices[0].message.content;
      if(typeof out !== 'string') throw new Error('응답 파싱 실패');
      return out;
    }

    function renderChat(){
      el.chat.innerHTML = '';
      if(chat.length === 0){
        const empty = document.createElement('div');
        empty.className = 'hint';
        empty.textContent = '대화가 없습니다. 아래 입력창에 문장을 입력하세요.';
        el.chat.appendChild(empty);
        scrollToBottom('instant');
        return;
      }

      for(const m of chat){
        const row = document.createElement('div');
        row.className = 'msg ' + (m.role === 'user' ? 'user' : 'assistant');

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = m.text;
        row.appendChild(bubble);

        const actions = document.createElement('div');
        actions.className = 'actionsRow';

        if(m.role === 'assistant'){
          const copyBtn = document.createElement('button');
          copyBtn.className = 'miniIconBtn';
          copyBtn.type = 'button';
          copyBtn.setAttribute('aria-label', '복사');
          copyBtn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 18H8V7h11v16z"/></svg>';
          copyBtn.addEventListener('click', async () => { await copyToClipboard(m.text, false); });
          actions.appendChild(copyBtn);
        }

        if(actions.children.length > 0){
          row.appendChild(actions);
        }

        el.chat.appendChild(row);
      }
      scrollToBottom('instant');
    }

    async function send(){
      const userText = el.input.value.trim();
      if(!userText) return;

      hideCopyBar();

      chat.push({ role:'user', text:userText, ts:Date.now() });
      saveChat();
      renderChat();
      scrollToBottom('smooth');

      el.input.value = '';
      setConnState('busy');

      try{
        const translatedRaw = await callOpenRouter(userText);
        const translated = normalizeOutput(userText, translatedRaw);

        chat.push({ role:'assistant', text: translated, ts: Date.now() });
        saveChat();
        renderChat();

        // ✅ 번역 완료 후 “확실히” 하단 고정
        scrollToBottom('smooth');

        // 자동복사(중국어일 때만)
        if(el.autoCopy.checked && hasChinese(translated)){
          const ok = await copyToClipboard(translated, true);
          if(ok){
            toast('중국어 자동 복사 완료');
            updateLastClipboard(translated);
          } else {
            showCopyBar(translated);
            toast('자동 복사 제한 → 아래 바 탭');
          }
        } else {
          hideCopyBar();
        }

        setConnState('ok');
      } catch(err){
        const msg = (err && err.message) ? err.message : String(err);
        chat.push({ role:'assistant', text: '오류: ' + msg, ts: Date.now() });
        saveChat();
        renderChat();
        setConnState('err');
        toast('요청 실패: ' + msg);
      }
    }

    async function testConnection(){
      setConnState('busy');
      try{
        await callOpenRouter('ping');
        setConnState('ok');
        toast('연결 테스트 성공');
      } catch(err){
        setConnState('err');
        toast('연결 테스트 실패: ' + (err && err.message ? err.message : err));
      }
    }

    function clearChatOnly(){
      if(!confirm('대화를 삭제합니다. 계속할까요?')) return;
      chat = [];
      hideCopyBar();
      try{ localStorage.setItem(LS.chat, '[]'); } catch {}
      try{ localStorage.removeItem(LS.chat); } catch {}
      renderChat();
      scrollToBottom('smooth');
      toast('Clear 완료');
    }

    function downloadChatAsTxt(){
      if(chat.length === 0){
        toast('다운로드할 번역 기록이 없습니다.');
        return;
      }
      let content = '';
      for(const m of chat){
        const role = m.role === 'user' ? '[입력]' : '[번역]';
        const time = m.ts ? new Date(m.ts).toLocaleString('ko-KR') : '';
        content += role + ' ' + time + '\n' + m.text + '\n\n';
      }
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'BK_Translator_' + new Date().toISOString().slice(0,10) + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('번역 기록 다운로드 완료');
    }

    // Init
    loadSettings();
    loadCustomFont();
    renderChat();
    setSettingsVisible(false);
    setConnState('warn');

    // 클립보드 상시 감시 및 자동 번역
    const LS_LAST_CLIP = 'bk_tr_lastClip';
    let _lastClipboardText = localStorage.getItem(LS_LAST_CLIP) || '';

    // ✅ 300자 이상은 자동입력/자동번역 금지
    const AUTO_TRANSLATE_MAX_LEN = 300;

    function updateLastClipboard(text){
      _lastClipboardText = text;
      localStorage.setItem(LS_LAST_CLIP, text);
    }

    async function checkClipboard(){
      try{
        if(_isBusy) return;
        if(!navigator.clipboard || !navigator.clipboard.readText) return;

        const clipText = await navigator.clipboard.readText();
        const trimmed = String(clipText || '').trim();
        if(!trimmed) return;

        if(trimmed.length >= AUTO_TRANSLATE_MAX_LEN) return;
        if(_lastClipboardText === trimmed) return;

        if(!hasKorean(trimmed) && !hasChinese(trimmed)) return;
        if(isEnglishLongText(trimmed)) return;

        updateLastClipboard(trimmed);
        el.input.value = trimmed;
        setTimeout(() => send(), 80);
      } catch(err){
        // 권한 거부 등은 조용히 무시
      }
    }

    checkClipboard();
    setInterval(checkClipboard, 1000);

    // Events
    el.settingsToggleBtn.addEventListener('click', toggleSettings);
    el.downloadBtn.addEventListener('click', downloadChatAsTxt);
    el.topTestBtn.addEventListener('click', testConnection);
    el.topClearBtn.addEventListener('click', clearChatOnly);
    el.saveBtn.addEventListener('click', saveSettings);

    el.sendBtnL.addEventListener('click', send);
    el.sendBtnR.addEventListener('click', send);

    el.input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        send();
      }
      if(e.key === 'Escape'){
        el.input.value = '';
      }
    });

    // Copy bar
    el.copyBar.addEventListener('click', async () => {
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });
    el.copyBarBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });

    // Font upload
    el.fontFile.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) await saveCustomFontFile(file);
      e.target.value = '';
    });
    el.clearFontBtn.addEventListener('click', clearCustomFont);

    // viewport 변화 시 하단 유지
    el.input.addEventListener('focus', () => scrollToBottom('smooth'));
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', () => scrollToBottom('smooth'));
    }

    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      toast('권장: HTTPS에서 사용하세요(키 보안)');
    }
  </script>
</body>
</html>
