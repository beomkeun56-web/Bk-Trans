<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>BK Translator (OpenRouter)</title>

  <!-- 404 favicon 방지 -->
  <link rel="icon" href="data:," />

  <!-- 네트워크 체감 개선 -->
  <link rel="dns-prefetch" href="//openrouter.ai" />
  <link rel="preconnect" href="https://openrouter.ai" crossorigin />

  <style>
    :root{
      --bg:#050505;
      --panel1:#0b0f14;
      --panel2:#0e1420;

      --text:#e6edf3;
      --muted:#9fb0c0;

      --blue:#2d6bff;
      --blue2:#1d4ed8;

      --ok:#33d17a;     /* 초록 */
      --warn:#f7c948;   /* 노랑 */
      --danger:#ff6b6b; /* 빨강 */

      --radius:18px;
      --shadow: 0 10px 28px rgba(0,0,0,.45);

      --fontMain: system-ui;
    }

    /* GitHub Pages에 올린 woff2가 있으면 자동 적용 (업로드폰트가 있으면 그게 우선) */
    @font-face{
      font-family:"BKRepoFont";
      src:url("./assets/fonts/NEXONLv2Gothic.woff2") format("woff2");
      font-display:swap;
    }

    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family: var(--fontMain), "BKRepoFont", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", Arial;
      -webkit-font-smoothing:antialiased;
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }

    /* ===== Header ===== */
    header{
      position:sticky; top:0; z-index:30;
      padding: 10px 10px calc(10px + env(safe-area-inset-top));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .topbar{
      max-width: 860px;
      margin:0 auto;
      display:flex; align-items:center; gap:10px;
    }
    .title{
      font-weight:800;
      letter-spacing:.2px;
      font-size:14px;
      margin-right:4px;
      display:flex;
      align-items:baseline;
      gap:6px;
    }
    .ver{
      font-weight:700;
      font-size:12px;
      color:var(--muted);
    }

    /* 아이콘 버튼: 크기 통일 / 진한 검은색 / 테두리 없음 */
    .iconBtn{
      width:36px; height:36px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border-radius:12px;
      border:none;
      background: #070707;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
      cursor:pointer;
      color: rgba(230,237,243,.88);
      padding:0;
    }
    .iconBtn:active{transform:scale(.98)}
    .iconBtn svg{width:18px; height:18px; fill: currentColor}

    /* 연결 상태 버튼도 동일 크기 */
    .connBtn{ position:relative; }
    /* ✅ (5) 연결상태 원형 점: 초록/노랑/빨강 */
    .connDot{
      position:absolute;
      right:8px; bottom:8px;
      width:10px; height:10px; border-radius:999px;
      background: var(--warn);
      box-shadow:
        0 0 0 2px rgba(5,5,5,.95),
        0 0 10px rgba(0,0,0,.35);
    }

    /* ===== Main ===== */
    main{
      flex:1;
      overflow:auto;
      padding: 10px;
      padding-bottom: 92px;
    }
    .wrap{
      max-width: 860px;
      margin:0 auto;
    }

    /* 카드/테두리 제거: 배경색으로만 구분 */
    .panel{
      background: linear-gradient(180deg, rgba(14,20,32,.92), rgba(8,12,18,.92));
      border:none;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      padding: 12px 14px;
      gap: 10px;
    }
    .panelHead .left{display:flex; flex-direction:column; gap:3px}
    .panelHead .h{font-weight:800; font-size:13px}

    /* ===== Settings ===== */
    .settings{
      margin-bottom:10px;
      padding: 12px 14px 14px;
      background: rgba(10,14,20,.92);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .settings .row{display:flex; gap:10px; flex-wrap:wrap}
    label{font-size:12px; color:var(--muted); display:block; margin:10px 0 6px}
    input[type="password"], input[type="text"], textarea{
      width:100%;
      background: rgba(0,0,0,.35);
      color: var(--text);
      border:none;
      outline:none;
      border-radius: 14px;
      padding: 12px 12px;
      font-size:14px;
    }
    textarea{min-height:120px; resize:vertical; line-height:1.5}
    .hint{font-size:12px; color:var(--muted); line-height:1.45}

    .btn{
      border:none;
      background: rgba(45,107,255,.14);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 14px;
      font-size:13px;
      cursor:pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,.35);
    }
    .btn:active{transform:scale(.98)}
    .btn.secondary{background: rgba(255,255,255,.06)}

    /* ===== Chat ===== */
    .chat{
      padding: 14px;
      display:flex;
      flex-direction:column;
      gap: 16px;
    }
    .msg{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
    .msg.user{align-items:flex-end}

    .bubble{
      max-width: 92%;
      border:none;
      border-radius: 18px;
      padding: 12px 14px;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      font-size: 15px;
    }

    /* 입력 말풍선: 단색 진한 회색 */
    .msg.user .bubble{
      background: rgba(46, 52, 64, .92);
      color: rgba(255,255,255,.95);
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      border-bottom-right-radius: 10px;
      max-width: 80%;
    }

    /* 출력 말풍선: 배경 없음(투명) */
    .msg.assistant .bubble{
      background: transparent;
      color: rgba(230,237,243,.92);
      box-shadow: none;
      padding: 0;
      border-radius: 0;
      max-width: 92%;
    }

    .actionsRow{
      display:flex; gap:8px; align-items:center;
      opacity:.9;
    }
    .miniIconBtn{
      width:32px; height:32px;
      border:none;
      background: rgba(255,255,255,.06);
      border-radius: 12px;
      box-shadow: 0 8px 18px rgba(0,0,0,.25);
      cursor:pointer;
      color: rgba(230,237,243,.9);
      display:inline-flex; align-items:center; justify-content:center;
      padding:0;
    }
    .miniIconBtn[disabled]{opacity:.45; cursor:default}
    .miniIconBtn svg{width:18px; height:18px; fill: currentColor}

    /* ===== Composer ===== */
    .composer{
      position:fixed; left:0; right:0; bottom:0; z-index:40;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(5,5,5,.92);
      backdrop-filter: blur(10px);
    }
    .composerInner{
      max-width: 860px;
      margin:0 auto;
      display:flex;
      gap:10px;
      align-items:center;
    }

    #input{
      height:44px;
      line-height:44px;
      flex: 0 1 440px;
      min-width: 160px;
      max-width: 520px;
      padding: 0 12px;
      border-radius: 16px;
      border:none;
      background: #2e3440;
      color: #ffffff;
      outline:none;
      font-size: 15px;
    }

    .sendBtn{
      height:44px;
      min-width: 54px;
      border-radius: 16px;
      border:none;
      background: rgba(45,107,255,.18);
      color: #ffffff;
      box-shadow: 0 10px 22px rgba(0,0,0,.35);
      cursor:pointer;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:0 14px;
    }
    .sendBtn:active{transform:scale(.98)}
    .sendBtn[disabled]{opacity:.55; cursor:default}
    .sendBtn svg{
      width:20px; height:20px;
      fill:none;
      stroke:#ffffff;
      stroke-width:2.8;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    /* 토스트 */
    .toast{
      position:fixed;
      left:50%;
      top:70px;
      transform:translateX(-50%);
      background: rgba(10,16,32,.92);
      border:none;
      padding: 10px 12px;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 12px;
      color: var(--text);
      opacity:0;
      pointer-events:none;
      transition: opacity .25s ease;
      max-width: 90vw;
      z-index: 999;
    }
    .toast.show{opacity:1}

    /* 복사 바 */
    .copyBar{
      position:fixed;
      left:50%;
      transform:translateX(-50%);
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 60;
      width: min(860px, 92vw);
      display:flex;
      align-items:center;
      gap:10px;
      padding: 10px 12px;
      border-radius: 16px;
      border:none;
      background: rgba(10,16,32,.92);
      box-shadow: var(--shadow);
    }
    .copyBarText{flex:1; font-size:12px; color: var(--muted)}
    .copyBarBtn{
      border:none;
      background: rgba(255,255,255,.06);
      color: var(--text);
      border-radius: 14px;
      padding: 10px 12px;
      cursor:pointer;
    }
    .hidden{display:none !important}

    @media (max-width: 520px){
      .title{font-size:13px}
      .iconBtn{width:36px; height:36px}
      main{padding:10px; padding-bottom: 96px;}
      .bubble{font-size:16px}
      #input{
        flex: 1 1 auto;
        max-width: none;
        height:46px;
        line-height:46px;
      }
      .sendBtn{
        height:46px;
        min-width: 56px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="title">BK Translator <span id="verLabel" class="ver">v1.0</span></div>

      <!-- 설정(메뉴) -->
      <button id="settingsToggleBtn" class="iconBtn" type="button" aria-label="설정">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/></svg>
      </button>

      <!-- 번역 기록 다운로드 -->
      <button id="downloadBtn" class="iconBtn" type="button" aria-label="번역 기록 다운로드">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20h14v-2H5v2zm7-18v12l4-4 1.4 1.4L12 16.8l-5.4-5.4L8 10l4 4V2z"/></svg>
      </button>

      <div style="flex:1"></div>

      <!-- ✅ (4) 연결 TEST 아이콘: 와이파이 모양 -->
      <button id="topTestBtn" class="iconBtn" type="button" aria-label="연결 테스트">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 18.2a1.8 1.8 0 1 0 0 3.6 1.8 1.8 0 0 0 0-3.6zM4.9 15.1l1.4 1.4A8.1 8.1 0 0 1 12 14.2c2.1 0 4.1.8 5.7 2.3l1.4-1.4A10.1 10.1 0 0 0 12 12.2c-2.7 0-5.2 1-7.1 2.9zM2.1 12.3l1.4 1.4A12.1 12.1 0 0 1 12 10.2c3.2 0 6.2 1.3 8.5 3.5l1.4-1.4A14.1 14.1 0 0 0 12 8.2c-3.9 0-7.5 1.5-9.9 4.1zM12 4.2c-4.9 0-9.4 1.9-12 5.1l1.4 1.4A15.8 15.8 0 0 1 12 6.2c4.1 0 7.9 1.6 10.6 4.5l1.4-1.4c-3-3.2-7.3-5.1-12-5.1z"/>
        </svg>
      </button>

      <button id="topClearBtn" class="iconBtn" type="button" aria-label="Clear(대화 삭제)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 14H7L6 7zm3-3h6l1 2H8l1-2z"/></svg>
      </button>

      <!-- 연결 상태 -->
      <button id="connBtn" class="iconBtn connBtn" type="button" aria-label="연결 상태">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 17l-1.5 1.5a4 4 0 0 1-5.7-5.6L5 10.7a4 4 0 0 1 5.6 0l.8.8-1.4 1.4-.8-.8a2 2 0 0 0-2.8 0L4.2 14.3a2 2 0 1 0 2.8 2.8L8.6 15.5 10 17zm4-10l1.5-1.5a4 4 0 1 1 5.7 5.6L19 13.3a4 4 0 0 1-5.6 0l-.8-.8 1.4-1.4.8.8a2 2 0 0 0 2.8 0l2.2-2.2a2 2 0 1 0-2.8-2.8L15.4 8.5 14 7zM8 14l6-6 1.4 1.4-6 6L8 14z"/></svg>
        <span id="connDot" class="connDot"></span>
      </button>
    </div>
  </header>

  <main id="main">
    <div class="wrap">

      <!-- 설정 패널 -->
      <section id="settingsPanel" class="settings hidden">
        <div class="hint" style="margin-bottom:8px;">
          OpenRouter 설정 · 프롬프트 · 폰트(폰 업로드)
        </div>

        <label for="apiKey">OpenRouter API Key</label>
        <input id="apiKey" type="password" placeholder="sk-or-..." autocomplete="off" />

        <div class="row">
          <div style="flex:1 1 240px;">
            <label for="model">모델</label>
            <input id="model" type="text" value="google/gemini-2.0-flash" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="temperature">temperature</label>
            <input id="temperature" type="text" value="0.2" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="top_p">top_p</label>
            <input id="top_p" type="text" value="1" />
          </div>
          <div style="flex:1 1 140px;">
            <label for="maxTokens">max_tokens</label>
            <input id="maxTokens" type="text" value="512" />
          </div>
        </div>

        <label for="systemPrompt">프롬프트(시스템/규칙)</label>
        <textarea id="systemPrompt" placeholder="여기에 본인 프롬프트를 붙여넣으세요."></textarea>

        <div class="row" style="align-items:center; margin-top:10px;">
          <label style="margin:0; display:flex; align-items:center; gap:10px; color:var(--text);">
            <input id="autoCopy" type="checkbox" style="width:18px; height:18px; accent-color: var(--blue);" />
            번역 완료 시 자동 복사(재시도 포함)
          </label>
        </div>

        <label>폰트(폰에서 업로드)</label>
        <div class="row" style="align-items:center;">
          <input id="fontFile" type="file" accept=".ttf,.otf,.woff2" />
          <button id="clearFontBtn" class="btn secondary" type="button">폰트 초기화</button>
          <button id="saveBtn" class="btn" type="button">저장</button>
        </div>
        <div class="hint">현재 폰트: <span id="fontStatus">기본(레포 woff2 우선)</span></div>
      </section>

      <!-- 대화 -->
      <section class="panel">
        <div class="panelHead">
          <div class="left">
            <div class="h">Chat</div>
          </div>
        </div>
        <div id="chat" class="chat"></div>
        <div id="bottomAnchor" style="height:1px;"></div>
      </section>

    </div>
  </main>

  <!-- Composer -->
  <div class="composer">
    <div class="composerInner">
      <button id="sendBtnL" class="sendBtn" type="button" aria-label="전송(좌)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>

      <input id="input" type="text" placeholder="" autocomplete="off" />

      <button id="sendBtnR" class="sendBtn" type="button" aria-label="전송(우)">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 19V5"></path>
          <path d="M5.5 11.5L12 5l6.5 6.5"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Copy bar -->
  <div id="copyBar" class="copyBar hidden" role="button" aria-label="복사 바">
    <div class="copyBarText">자동복사 실패 · 탭하면 복사</div>
    <button id="copyBarBtn" class="copyBarBtn" type="button">복사</button>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    // =========================
    // 성능/자동번역 옵션
    // =========================
    const APP_VERSION_BASE = 'v1.0';
    const MAX_CHAT_STORE = 250;
    const MAX_CHAT_RENDER = 140;

    // ✅ (3) 300자 이상 클립보드 자동입력 번역 차단
    const AUTO_TRANSLATE_BLOCK_LEN = 300;

    // 자동복사 재시도(상시감시)
    const AUTO_COPY_RETRY_MS = 1200;

    const API_TIMEOUT_MS = 35000;
    const CLIPBOARD_INTERVAL_MS = 1500;

    const LS = {
      apiKey: 'bk_tr_apiKey',
      model: 'bk_tr_model',
      temp: 'bk_tr_temp',
      top_p: 'bk_tr_top_p',
      maxTokens: 'bk_tr_maxTokens',
      system: 'bk_tr_systemPrompt',
      autoCopy: 'bk_tr_autoCopy',
      chat: 'bk_tr_chat',
      lastClip: 'bk_tr_lastClip'
    };

    const el = {
      main: document.getElementById('main'),

      verLabel: document.getElementById('verLabel'),

      settingsToggleBtn: document.getElementById('settingsToggleBtn'),
      settingsPanel: document.getElementById('settingsPanel'),
      downloadBtn: document.getElementById('downloadBtn'),

      topTestBtn: document.getElementById('topTestBtn'),
      topClearBtn: document.getElementById('topClearBtn'),
      connBtn: document.getElementById('connBtn'),
      connDot: document.getElementById('connDot'),

      apiKey: document.getElementById('apiKey'),
      model: document.getElementById('model'),
      temperature: document.getElementById('temperature'),
      top_p: document.getElementById('top_p'),
      maxTokens: document.getElementById('maxTokens'),
      systemPrompt: document.getElementById('systemPrompt'),
      autoCopy: document.getElementById('autoCopy'),
      saveBtn: document.getElementById('saveBtn'),

      chat: document.getElementById('chat'),
      bottomAnchor: document.getElementById('bottomAnchor'),

      input: document.getElementById('input'),
      sendBtnL: document.getElementById('sendBtnL'),
      sendBtnR: document.getElementById('sendBtnR'),

      copyBar: document.getElementById('copyBar'),
      copyBarBtn: document.getElementById('copyBarBtn'),
      toast: document.getElementById('toast'),

      fontFile: document.getElementById('fontFile'),
      clearFontBtn: document.getElementById('clearFontBtn'),
      fontStatus: document.getElementById('fontStatus')
    };

    function toast(msg){
      el.toast.textContent = String(msg ?? '');
      el.toast.classList.add('show');
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.toast.classList.remove('show'), 2200);
    }

    // ✅ 번역 완료 후 항상 맨 아래로 스크롤 (anchor + scrollTop 이중 보장)
    function scrollToBottom(behavior='instant'){
      const scroller = el.main;
      const doScroll = () => {
        try{ el.bottomAnchor.scrollIntoView({ behavior, block:'end' }); } catch {}
        scroller.scrollTop = scroller.scrollHeight;
      };
      requestAnimationFrame(() => { doScroll(); requestAnimationFrame(doScroll); });
    }

    async function copyToClipboard(text, silent){
      const t = String(text ?? '');
      try{
        if(navigator.clipboard && window.isSecureContext){
          await navigator.clipboard.writeText(t);
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      try{
        const ta = document.createElement('textarea');
        ta.value = t;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        ta.setSelectionRange(0, ta.value.length);
        const ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if(ok){
          if(!silent) toast('복사 완료');
          return true;
        }
      } catch {}
      if(!silent) toast('복사 실패(보안 정책)');
      return false;
    }

    let _pendingCopyText = '';
    function showCopyBar(text){
      _pendingCopyText = String(text ?? '');
      el.copyBar.classList.remove('hidden');
    }
    function hideCopyBar(){
      _pendingCopyText = '';
      el.copyBar.classList.add('hidden');
    }

    function hasChinese(s){
      return /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF]/.test(String(s || ''));
    }
    function hasKorean(s){
      return /[\uAC00-\uD7AF\u1100-\u11FF\u3130-\u318F]/.test(String(s || ''));
    }
    function isEnglishLongText(s){
      const str = String(s || '');
      if(hasKorean(str) || hasChinese(str)) return false;
      const englishChars = str.match(/[a-zA-Z]/g);
      return englishChars && englishChars.length >= 40;
    }

    // ✅ (2) 수정될 때마다 자동 버전 변경: document.lastModified 기반
    function setAutoVersionLabel(){
      // lastModified가 서버/환경에 따라 "현재시간"으로 보일 수도 있음(일부 환경)
      // 그래도 파일 수정 시 일반적으로 갱신됨.
      let d = null;
      try{
        d = new Date(document.lastModified);
        if(!Number.isFinite(d.getTime())) d = null;
      } catch { d = null; }

      const pad = (n) => String(n).padStart(2,'0');
      const fmt = (dt) => {
        const y = dt.getFullYear();
        const m = pad(dt.getMonth()+1);
        const da = pad(dt.getDate());
        const hh = pad(dt.getHours());
        const mm = pad(dt.getMinutes());
        return `${y}${m}${da}${hh}${mm}`; // 숫자만
      };

      const stamp = d ? fmt(d) : fmt(new Date());
      el.verLabel.textContent = `${APP_VERSION_BASE}.${stamp}`;
    }

    // ===== Font: IndexedDB =====
    const DB_NAME = 'bk_tr_db';
    const DB_STORE = 'kv';
    let _fontBlobUrl = null;

    function openDB(){
      return new Promise((resolve, reject) => {
        if(!('indexedDB' in window)) return reject(new Error('IndexedDB 미지원'));
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if(!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function idbGet(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readonly');
        const os = tx.objectStore(DB_STORE);
        const r = os.get(key);
        r.onsuccess = () => resolve(r.result);
        r.onerror = () => reject(r.error);
      });
    }

    async function idbSet(key, val){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).put(val, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function idbDel(key){
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, 'readwrite');
        tx.objectStore(DB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function normalizeNewlines(s){
      return String(s).replace(/\\r\\n/g, '\\n').replace(/\\r/g, '\\n');
    }
    function countMeaningfulLines(s){
      const norm = normalizeNewlines(s);
      const trimmed = norm.replace(/\\n+$/g, '');
      if(trimmed.length === 0) return 1;
      return trimmed.split('\\n').length;
    }
    function normalizeOutput(src, out){
      const srcLineCount = countMeaningfulLines(src);
      const norm = normalizeNewlines(out).trimEnd();
      if(norm.length === 0) return '';
      const lines = norm.split('\\n');
      const nonEmpty = lines.filter(l => l.trim().length > 0);
      const uniq = [...new Set(nonEmpty.map(l => l.trim()))];
      if(srcLineCount === 1 && uniq.length === 1 && nonEmpty.length > 1) return uniq[0];
      return norm;
    }
    function validateNumber(x, min, max, name){
      const v = Number(x);
      if(!Number.isFinite(v)) throw new Error(name + ' 값이 숫자가 아닙니다.');
      if(v < min || v > max) throw new Error(name + ' 범위 오류(' + min + '~' + max + ')');
      return v;
    }

    // ===== OpenRouter: Stream (체감 출력 속도 개선) =====
    function safeReferer(){
      return (location.origin && location.origin !== 'null') ? location.origin : 'https://localhost';
    }

    async function callOpenRouterStream(userText, onChunk){
      const apiKey = el.apiKey.value.trim();
      if(!apiKey) throw new Error('API Key가 비어 있습니다.');
      const model = el.model.value.trim();
      if(!model) throw new Error('모델이 비어 있습니다.');

      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const top_p = validateNumber(el.top_p.value.trim(), 0, 1, 'top_p');
      const max_tokens = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 8000, 'max_tokens'));
      const systemPrompt = (el.systemPrompt.value || defaultSystemPrompt()).trim();

      const payload = {
        model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userText }
        ],
        temperature,
        top_p,
        max_tokens,
        stream: true
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);

      const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Accept': 'text/event-stream',
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + apiKey,
          'HTTP-Referer': safeReferer(),
          'X-Title': 'BK Translator (Personal)'
        },
        body: JSON.stringify(payload),
        cache: 'no-store',
        signal: controller.signal
      });

      if(!res.ok){
        const raw = await res.text().catch(()=>'');
        let msg = raw;
        try{
          const j = JSON.parse(raw);
          msg = j?.error?.message || j?.message || raw;
        } catch {}
        clearTimeout(timeoutId);
        throw new Error('HTTP ' + res.status + ': ' + String(msg).slice(0, 300));
      }

      if(!res.body){
        clearTimeout(timeoutId);
        throw new Error('스트림 미지원 응답');
      }

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buf = '';
      let done = false;

      try{
        while(true){
          const { value, done: rdDone } = await reader.read();
          if(rdDone) break;

          buf += decoder.decode(value, { stream:true });

          let idx;
          while((idx = buf.indexOf('\n')) >= 0){
            const line = buf.slice(0, idx).trimEnd();
            buf = buf.slice(idx + 1);

            if(!line.startsWith('data:')) continue;
            const data = line.slice(5).trim();
            if(!data) continue;
            if(data === '[DONE]'){ done = true; break; }

            let j = null;
            try{ j = JSON.parse(data); } catch { continue; }

            const delta = j?.choices?.[0]?.delta?.content;
            if(typeof delta === 'string' && delta.length){
              onChunk(delta);
            }
          }
          if(done) break;
        }
      } finally {
        clearTimeout(timeoutId);
        try{ reader.releaseLock(); } catch {}
      }
    }

    async function callOpenRouterOnce(userText){
      const apiKey = el.apiKey.value.trim();
      if(!apiKey) throw new Error('API Key가 비어 있습니다.');
      const model = el.model.value.trim();
      if(!model) throw new Error('모델이 비어 있습니다.');

      const temperature = validateNumber(el.temperature.value.trim(), 0, 2, 'temperature');
      const top_p = validateNumber(el.top_p.value.trim(), 0, 1, 'top_p');
      const max_tokens = Math.floor(validateNumber(el.maxTokens.value.trim(), 1, 8000, 'max_tokens'));
      const systemPrompt = (el.systemPrompt.value || defaultSystemPrompt()).trim();

      const payload = {
        model,
        messages: [
          { role: 'system', content: systemPrompt },
          { role: 'user', content: userText }
        ],
        temperature,
        top_p,
        max_tokens,
        stream: false
      };

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);

      try{
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Accept': 'application/json',
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + apiKey,
            'HTTP-Referer': safeReferer(),
            'X-Title': 'BK Translator (Personal)'
          },
          body: JSON.stringify(payload),
          cache: 'no-store',
          signal: controller.signal
        });

        const raw = await res.text();
        let json = null;
        try{ json = JSON.parse(raw); } catch {}

        if(!res.ok){
          const msg = (json && (json.error?.message || json.message)) ? (json.error?.message || json.message) : raw;
          throw new Error('HTTP ' + res.status + ': ' + String(msg).slice(0, 300));
        }

        const out = json?.choices?.[0]?.message?.content;
        if(typeof out !== 'string') throw new Error('응답 파싱 실패');
        return out;
      } finally {
        clearTimeout(timeoutId);
      }
    }

    // ===== 자동복사 상시 재시도(감시) =====
    let _autoCopyRetryTimer = null;
    let _autoCopyNotified = false;

    async function tryAutoCopyPending(silent){
      if(!el.autoCopy.checked) return false;
      if(!_pendingCopyText) return false;
      if(!hasChinese(_pendingCopyText)) return false;

      // 권한 상태 확인(가능하면)
      try{
        if(navigator.permissions && navigator.permissions.query){
          const p = await navigator.permissions.query({ name: 'clipboard-write' });
          if(p && p.state === 'denied') return false;
        }
      } catch {}

      const ok = await copyToClipboard(_pendingCopyText, true);
      if(ok){
        hideCopyBar();
        if(!silent && !_autoCopyNotified){
          _autoCopyNotified = true;
          toast('자동 복사 재시도 성공');
        }
        updateLastClipboard(_pendingCopyText);
        return true;
      }
      return false;
    }

    function startAutoCopyWatch(){
      stopAutoCopyWatch();
      _autoCopyNotified = false;
      _autoCopyRetryTimer = setInterval(() => {
        // 사용자 제스처 없이도 성공하는 케이스가 있어 계속 재시도(상시감시)
        tryAutoCopyPending(true);
      }, AUTO_COPY_RETRY_MS);
    }

    function stopAutoCopyWatch(){
      if(_autoCopyRetryTimer){
        clearInterval(_autoCopyRetryTimer);
        _autoCopyRetryTimer = null;
      }
    }

    // ===== Send =====
    async function send(){
      const userText = el.input.value.trim();
      if(!userText) return;

      hideCopyBar();
      _autoCopyNotified = false;

      chat.push({ role:'user', text:userText, ts:Date.now() });
      _seenUser.add(userText);
      trimChat();
      saveChatDebounced();

      appendMessageToUI('user', userText, false);

      el.input.value = '';
      setConnState('busy');

      // pending bubble
      const pendingUI = appendMessageToUI('assistant', '…', true);

      let acc = '';
      try{
        await callOpenRouterStream(userText, (chunk) => {
          acc += chunk;
          pendingUI.bubble.textContent = acc || '…';
          scrollToBottom('instant');
        });

        if(!acc.trim()){
          acc = await callOpenRouterOnce(userText);
        }

        const translated = normalizeOutput(userText, acc);

        pendingUI.bubble.textContent = translated;
        if(pendingUI.copyBtn) pendingUI.copyBtn.disabled = false;

        chat.push({ role:'assistant', text: translated, ts: Date.now() });
        _seenAssistant.add(translated);
        trimChat();
        saveChatDebounced();

        // ✅ (1) 자동복사: 실패 시 copyBar 띄우고, 상시 재시도 감시로 계속 시도
        if(el.autoCopy.checked && hasChinese(translated)){
          _pendingCopyText = translated; // 재시도 대상 등록
          const ok1 = await copyToClipboard(translated, true);

          if(ok1){
            toast('중국어 자동 복사 완료');
            updateLastClipboard(translated);
            hideCopyBar();
          } else {
            showCopyBar(translated);
            // 즉시 2차 재시도(타이밍 이슈 보정)
            setTimeout(() => tryAutoCopyPending(true), 180);
            setTimeout(() => tryAutoCopyPending(true), 650);
            toast('자동 복사 실패 → 재시도 중');
          }
        } else {
          hideCopyBar();
        }

        setConnState('ok');
        scrollToBottom('smooth');
      } catch(err){
        const msg = (err && err.message) ? err.message : String(err);
        pendingUI.bubble.textContent = '오류: ' + msg;
        if(pendingUI.copyBtn) pendingUI.copyBtn.disabled = true;

        chat.push({ role:'assistant', text: '오류: ' + msg, ts: Date.now() });
        _seenAssistant.add('오류: ' + msg);
        trimChat();
        saveChatDebounced();

        setConnState('err');
        toast('요청 실패: ' + msg);
        scrollToBottom('instant');
      }
    }

    function downloadChatAsTxt(){

      for(const m of chat){

        const time = m.ts ? new Date(m.ts).toLocaleString('ko-KR') : '';
        content += role + ' ' + time + '\n' + m.text + '\n\n';
      }
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'BK_Translator_' + new Date().toISOString().slice(0,10) + '.txt';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

    // ===== Clipboard auto translate =====

    async function checkClipboard(){
      try{
        if(_isBusy) return;
        if(document.hidden) return;

        if(!navigator.clipboard || !navigator.clipboard.readText) return;
        const clipText = await navigator.clipboard.readText();
        const trimmed = String(clipText || '').trim();
        if(!trimmed) return;

        // ✅ (3) 300자 이상이면 자동 입력 번역 금지(프롬프트 붙여넣기 방지)
        if(trimmed.length >= AUTO_TRANSLATE_BLOCK_LEN) return;

        if(_lastClipboardText === trimmed) return;
        if(_seenAssistant.has(trimmed)) return;
        if(_seenUser.has(trimmed)) return;

        if(!hasKorean(trimmed) && !hasChinese(trimmed)) return;
        if(isEnglishLongText(trimmed)) return;

        updateLastClipboard(trimmed);
        el.input.value = trimmed;
        setTimeout(() => send(), 90);
      } catch(err){
        // 권한 거부 등은 조용히 무시
      }
    }

    el.downloadBtn.addEventListener('click', downloadChatAsTxt);
    el.topTestBtn.addEventListener('click', testConnection);
    el.topClearBtn.addEventListener('click', clearChatOnly);
    el.saveBtn.addEventListener('click', saveSettings);

    el.sendBtnL.addEventListener('click', send);
    el.sendBtnR.addEventListener('click', send);

    el.input.addEventListener('keydown', (e) => {
      if(e.key === 'Enter'){
        e.preventDefault();
        send();
      }
      if(e.key === 'Escape'){
        el.input.value = '';
      }
    });

    // Copy bar
    el.copyBar.addEventListener('click', async () => {
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });
    el.copyBarBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if(!_pendingCopyText) return;
      const ok = await copyToClipboard(_pendingCopyText, false);
      if(ok) hideCopyBar();
    });

    // Font upload
    el.fontFile.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if(file) await saveCustomFontFile(file);
      e.target.value = '';
    });
    el.clearFontBtn.addEventListener('click', clearCustomFont);

    // viewport 변화 시 하단 유지
    el.input.addEventListener('focus', () => scrollToBottom('smooth'));
    if(window.visualViewport){
      window.visualViewport.addEventListener('resize', () => scrollToBottom('instant'));
    }

    // 자동복사 체크 변경 시 감시 토글
    el.autoCopy.addEventListener('change', () => {
      localStorage.setItem(LS.autoCopy, el.autoCopy.checked ? '1' : '0');
      if(el.autoCopy.checked) startAutoCopyWatch();
      else stopAutoCopyWatch();
    });

    // 포커스/복귀 시 자동복사 재시도(상시감시 보강)
    window.addEventListener('focus', () => tryAutoCopyPending(true));
    document.addEventListener('visibilitychange', () => {
      if(!document.hidden) tryAutoCopyPending(true);
    });

    if(location.protocol !== 'https:' && location.hostname !== 'localhost'){
      toast('권장: HTTPS에서 사용하세요(키 보안)');
    }
  </script>
</body>
</html>
